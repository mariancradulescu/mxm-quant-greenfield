name: MXM repaired full native frontier finite resumable campaigns
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/critical_frontier_repair_20261014_v2/REPAIR_AUTHORITY_V2.json]
  workflow_dispatch:
    inputs:
      previous_generation:
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: mxm-repaired-native-frontier-single-writer-20261014-v2
  cancel-in-progress: false
jobs:
  repair:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - run: python3 -m unittest -v research_core_v4.critical_frontier_repair_20261014_v2.test_v2
      - name: Compact checkpoint migration and actual encrypted release rotation proof
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m research_core_v4.critical_frontier_repair_20261014_v2.runner_v2
  cold_verify:
    needs: repair
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Independent runner cold resume before broker continuation
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m research_core_v4.critical_frontier_repair_20261014_v2.runner_v2
  worker_01:
    needs: cold_verify
    if: ${{ success()  }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      done: ${{ steps.engine.outputs.done }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - run: dotnet build research_core_v4/full_native_frontier_20261014_v1/csharp/Replay.csproj -c Release --nologo
      - run: dotnet build research_core_v4/full_native_frontier_20261014_v1/csharp/NativeCompatible.csproj -c Release --nologo
      - name: Resume accepted native data and qualify frozen economic mechanism
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m research_core_v4.critical_frontier_repair_20261014_v2.runner_v2
  worker_02:
    needs: worker_01
    if: ${{ success() && needs.worker_01.outputs.done != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      done: ${{ steps.engine.outputs.done }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - run: dotnet build research_core_v4/full_native_frontier_20261014_v1/csharp/Replay.csproj -c Release --nologo
      - run: dotnet build research_core_v4/full_native_frontier_20261014_v1/csharp/NativeCompatible.csproj -c Release --nologo
      - name: Resume accepted native data and qualify frozen economic mechanism
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m research_core_v4.critical_frontier_repair_20261014_v2.runner_v2
  worker_03:
    needs: worker_02
    if: ${{ success() && needs.worker_02.outputs.done != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      done: ${{ steps.engine.outputs.done }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - run: dotnet build research_core_v4/full_native_frontier_20261014_v1/csharp/Replay.csproj -c Release --nologo
      - run: dotnet build research_core_v4/full_native_frontier_20261014_v1/csharp/NativeCompatible.csproj -c Release --nologo
      - name: Resume accepted native data and qualify frozen economic mechanism
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m research_core_v4.critical_frontier_repair_20261014_v2.runner_v2
  handoff:
    needs: worker_03
    if: ${{ success() && needs.worker_03.outputs.done != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Dispatch next finite campaign under the same accepted authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m research_core_v4.critical_frontier_repair_20261014_v2.handoff_v2
