name: MXM R3 protected technical installation CI
on:
  pull_request:
    branches: [main, mxm-remediation-p0-p4-20261015-v1]
permissions: {contents: read}
jobs:
  shared-catalogue-regression:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: installation, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: aa41ee31268bcf773f5f9299ac611d4bae7b88ff
          path: code
          persist-credentials: false
      - name: Verify exact installable workflow and pinned code
        working-directory: code
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          from research_core_v4.laboratory.secret_isolation import build_workflow as isolation_workflow
          from research_core_v4.laboratory.checkpoint20_readback import build_workflow as checkpoint_workflow
          expected='aa41ee31268bcf773f5f9299ac611d4bae7b88ff'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected
          workflow=json.loads(pathlib.Path('../installation/.github/workflows/mxm-r3-secret-isolation.yml').read_bytes())
          assert workflow==isolation_workflow('e5add220235b14678a96972c2a7afb237d31a972')
          checkpoint=json.loads(pathlib.Path('../installation/.github/workflows/mxm-r3-checkpoint20-readback.yml').read_bytes())
          assert checkpoint==checkpoint_workflow(expected)
          print('Exact workflow, source SHA, four jobs, fixed secret mappings and restricted branch verified; no secrets used.')
          PY
      - working-directory: code
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Full laboratory and continuous account regressions
        working-directory: code
        run: |
          python3 - <<'PY'
          import pathlib,unittest
          names=sorted(str(p.with_suffix('')).replace('/','.') for p in pathlib.Path('research_core_v4/laboratory').glob('test_*.py'))+['tests.test_continuous_account_replay_v2']
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(names))
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Protected historical anchors unchanged
        working-directory: code
        run: python3 -m research_core_v4.laboratory.live_preflight_v3
        env:
          GH_TOKEN: ${{ github.token }}
