name: MXM one DOM information DEVELOPMENT qualification
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/dom_information_20261014_v1/EXECUTION_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-dom-information-20261014-v1
  cancel-in-progress: false
jobs:
  dom-information-qualification:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned existing protocol crypto dependencies
        run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Frozen historical contract plus additive transport and quantity tests
        run: python3 -m unittest -v research_core_v4.dom_live_probe_20261013_v1.test_live_v1 research_core_v4.dom_information_20261014_v1.test_information_v1
      - name: One bounded authenticated native DOM capture and encrypted readback
        env:
          GH_TOKEN: ${{ github.token }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 3145728
          timeout --signal=TERM 1700 python3 -m research_core_v4.dom_information_20261014_v1.runner_v1
