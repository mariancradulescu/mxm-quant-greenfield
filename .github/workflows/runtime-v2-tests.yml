name: Autonomous Research Runtime V2

on:
  push:
    branches:
      - performance-research-v3-20260922
    paths:
      - 'research_v3/general_ai_autonomy_loop.py'
      - 'research_v3/runtime_v2_primitives.py'
      - 'research_v3/trend_surface_transport_repair.py'
      - 'tests/test_autonomous_runtime_v2.py'
      - 'research_v3/general_ai_reasoning_provider.py'
      - 'research_v3/execution_router.py'
      - 'research_v3/deterministic_operation_executor.py'
      - 'research_v3/discovery_governance.py'
      - 'research_v3/PARAMETER_DISCOVERY_AND_ROBUSTNESS_GOVERNOR_V1.json'
      - 'research_v3/MULTI_FRONTIER_DISCOVERY_GOVERNOR_V1.json'
      - 'research_v3/DISCOVERY_COVERAGE_LEDGER_V1.json'
      - 'evidence/RETROSPECTIVE_EVIDENCE_SCOPE_AUDIT_V1.json'
      - 'research_v3/EPOCH38_CROSS_SECTIONAL_ALIGNED_HISTORY_SCOPE_FREEZE_V1.json'
      - 'research_v3/EPOCH38_CROSS_SECTIONAL_ALIGNED_HISTORY_ACQUISITION_READINESS_OPERATION_V1.json'
      - 'research_v3/epoch38_cross_sectional_aligned_history_scope_freeze.py'
      - 'tests/test_epoch38_cross_sectional_aligned_history_scope_freeze.py'
      - 'tests/test_discovery_governance_v1.py'
      - 'tests/test_epoch38_deterministic_readiness_operation.py'
      - 'tests/test_execution_router_v1.py'
      - 'research_v3/EPOCH35_BREAKOUT_UNSIGNED_VOLATILITY_DETERMINISTIC_OPERATION_V1.json'
      - 'research_v3/EPOCH36_MEAN_REVERSION_MAGNITUDE_PERSISTENCE_DETERMINISTIC_OPERATION_V1.json'
      - '.github/workflows/runtime-v2-tests.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Runtime entry mode
        required: true
        default: resume
        type: choice
        options:
          - resume
          - acceptance
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: mxm-research-writer-performance-research-v3-20260922
  cancel-in-progress: false

env:
  TARGET_BRANCH: performance-research-v3-20260922
  MXM_RUNTIME_TARGET_BRANCH: performance-research-v3-20260922
  PYTHONUNBUFFERED: "1"

jobs:
  runtime-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout authoritative research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure durable checkpoint identity
        run: |
          git config user.name "mxm-runtime-v2[bot]"
          git config user.email "mxm-runtime-v2@users.noreply.github.com"

      - name: Runtime V2 focused tests
        run: >
          python -m unittest -v
          tests.test_autonomous_runtime_v2
          tests.test_epoch38_cross_sectional_aligned_history_scope_freeze
          tests.test_discovery_governance_v1
          tests.test_epoch38_deterministic_readiness_operation

      - name: Diagnose persisted TREND surface transport without rerunning research
        run: python -m research_v3.trend_surface_transport_repair

      - name: Zero-human continuation acceptance demonstration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'acceptance' }}
        run: |
          mkdir -p research_v3/runtime_v2_acceptance
          python -m research_v3.autonomous_runtime_v2 acceptance \
            --report research_v3/runtime_v2_acceptance/LATEST_ACCEPTANCE_REPORT.json

      - name: Classify canonical research action
        id: route
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'resume') }}
        run: |
          python -m research_v3.lightweight_dispatcher classify \
            --root . --github-output "$GITHUB_OUTPUT"

      - name: Wake authoritative main Supervisor
        if: ${{ steps.route.outputs.dispatch_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run autonomous-research-runtime-v2.yml --ref main \
            -f mode=resume \
            -f predecessor_ci_head="$(git rev-parse HEAD)" \
            -f predecessor_ci_conclusion=success \
            -f predecessor_ci_run_id="$GITHUB_RUN_ID"
