name: MXM information source investigation saved contract readback V1
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/information_source_investigation_v1/SOURCE_READBACK_V1.json]
permissions:
  contents: write
jobs:
  saved-contract-copy:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Copy existing instrument economics and native contract fields
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
        run: python3 -m research_core_v4.information_source_investigation_v1.readback_v1
