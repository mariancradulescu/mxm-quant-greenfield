name: CRM ADBE M5 package
on:
  push:
    branches:
      - crm-adbe-m5-package-build-20261001
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm-adbe-m5-package-build-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install protobuf
        run: |
          python -m pip install --only-binary=:all: --no-deps -r tools/requirements-m6-capture.txt
      - name: Compile
        run: |
          python -m py_compile CRM_ADBE_M5_CAPTURE_RUN.py research_core_v3/crm_adbe_m5_temporal_capture.py research_core_v3/pydroid_crm_adbe_m5_temporal_launcher.py tools/build_crm_adbe_m5_temporal_package.py tools/validate_crm_adbe_m5_temporal_package.py
      - name: Validate and build
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/validate_crm_adbe_m5_temporal_package.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_V3_CRM_ADBE_M5_TEMPORAL_COLLECTOR_V1
          path: dist/
          if-no-files-found: error
          retention-days: 30
