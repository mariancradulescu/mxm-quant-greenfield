name: MXM C cold economic readback
on:
  workflow_run:
    workflows: [MXM C preserved result checkpoint]
    types: [completed]
permissions: {}
concurrency:
  group: mxm-c-cold-existing-readback
  cancel-in-progress: false
jobs:
  cold-economic-readback:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.run_attempt == 1 && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.head_repository.full_name == 'mariancradulescu/mxm-quant-greenfield' && github.event.workflow_run.head_branch == 'mxm-remediation-p0-p4-20261015-v1' && github.event.workflow_run.head_sha == '88d7fccd668963c9300bb4ccece8301f9b015f2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 88d7fccd668963c9300bb4ccece8301f9b015f2e
          persist-credentials: false
      - name: Existing hash-locked decoder, no App or broker secret
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mxm-c-preserved-${{ github.event.workflow_run.id }}
          path: verification/c-readonly/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Fresh workflow token, cold encrypted recovery, existing-summary interpretation
        run: python3 -m research_core_v4.successor_c_20261018.readback cold
        env:
          GH_TOKEN: ${{ github.token }}
          C_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          C_EXPECTED_SOURCE_SHA: 88d7fccd668963c9300bb4ccece8301f9b015f2e
          C_FETCH_RUN_ID: ${{ github.event.workflow_run.id }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-c-existing-economic-readback-${{ github.run_id }}
          path: |
            verification/c-readonly/economic-readback.mxmenc
            verification/c-readonly/public-status.json
          if-no-files-found: error
          retention-days: 90
