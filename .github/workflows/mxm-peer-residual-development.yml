{
  "name": "MXM one cross-sectional peer-residual economic falsification",
  "on": {
    "push": {
      "branches": [
        "mxm-remediation-p0-p4-20261015-v1"
      ],
      "paths": [
        ".github/workflows/mxm-peer-residual-development.yml"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "mxm-integrated-laboratory",
    "cancel-in-progress": false
  },
  "jobs": {
    "peer-residual": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "environment": "mxm-r3-custody-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Admit exact finite dependent hypothesis before source access",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -m research_core_v4.laboratory.peer_residual_development admit"
        },
        {
          "name": "Compile CSharp and independently check artificial causal selection before custody",
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock\ndotnet build research_core_v4/laboratory/csharp/peer_residual/MxmPeerResidual.csproj -c Release\npython3 -m unittest research_core_v4.laboratory.test_peer_residual -v"
        },
        {
          "name": "Authenticate original100 shards and export only original reference input in custody",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          },
          "run": "umask 077\npython3 -m research_core_v4.laboratory.peer_residual_development export"
        },
        {
          "name": "Execute exactly one CSharp policy; reconcile complete causal decision and episode audit with Python",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "umask 077\npython3 -m research_core_v4.laboratory.peer_residual_development evaluate"
        },
        {
          "name": "Separate custody readback of original encrypted result without policy replay",
          "env": {
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          },
          "run": "umask 077\npython3 -m research_core_v4.laboratory.peer_residual_development cold"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "peer-residual-${{ github.run_id }}",
            "path": "verification/peer-residual/receipt.json\nverification/peer-residual/result.mxmenc\nverification/peer-residual/evaluator.dll\nverification/peer-residual/cold.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
