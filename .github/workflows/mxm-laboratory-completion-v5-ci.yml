name: MXM laboratory V5 new controls only
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: ['research_core_v4/laboratory_completion_20261019_v1/**', '.github/workflows/mxm-laboratory-completion-v5-ci.yml']
permissions: {contents: read}
jobs:
  isolated-new-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0d53b956c80b8cce509adc788e6af1125bb94407
          persist-credentials: false
      - run: >-
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - run: python3 -m unittest research_core_v4.laboratory_completion_20261019_v1.test_analysis -v
