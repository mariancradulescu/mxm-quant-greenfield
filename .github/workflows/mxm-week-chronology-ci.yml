name: MXM full ISO week chronology bounded VIEW contract CI
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/laboratory/week_chronology_reception.py
      - research_core_v4/laboratory/test_week_chronology_reception.py
      - .github/workflows/mxm-week-chronology-ci.yml
      - .github/workflows/mxm-week-chronology-reception.yml
permissions: {contents: read}
jobs:
  weekly-view-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d2fae5641b759b1c8c24161d83d62d39e104eafd
          path: .native
          persist-credentials: false
      - run: python3 -m pip install --only-binary=:all: --require-hashes -r .native/research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Install actual bounded collector over unchanged native decoder and run wire/provenance negatives
        run: |
          cp research_core_v4/laboratory/week_chronology_reception.py .native/research_core_v4/laboratory/
          cp research_core_v4/laboratory/test_week_chronology_reception.py .native/research_core_v4/laboratory/
          cd .native
          test "$(git rev-parse HEAD)" = d2fae5641b759b1c8c24161d83d62d39e104eafd
          git diff --exit-code HEAD --
          python3 -m unittest research_core_v4.laboratory.test_chronology_reception research_core_v4.laboratory.test_week_chronology_reception -v
