name: MXM native frontier authenticated economic progress readback
on:
  push:
    branches: [mxm-full-frontier-readback-20261014-v1]
    paths: [research_core_v4/full_native_frontier_checkpoint_20261014_v1/EXECUTION_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-full-frontier-readback-20261014-v1
  cancel-in-progress: false
jobs:
  readback:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Read-only current economic support and signed encrypted recovery
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: timeout --signal=TERM 2100 python3 -m research_core_v4.full_native_frontier_checkpoint_20261014_v1.snapshot_v1
