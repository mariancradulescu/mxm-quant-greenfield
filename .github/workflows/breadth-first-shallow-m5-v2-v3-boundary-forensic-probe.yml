name: Shallow M5 V3 First Request Boundary Forensic Probe

on:
  push:
    branches: [performance-research-v3-20260922]
    paths:
      - research_core_v4/state/BREADTH_FIRST_SHALLOW_M5_SUPPORT_V2_V3_BOUNDARY_FORENSIC_ARM_V1.json

permissions:
  contents: write
  actions: read

concurrency:
  group: MXM_SHALLOW_M5_V3_FIRST_REQUEST_BOUNDARY_FORENSIC_SINGLETON
  cancel-in-progress: false

jobs:
  forensic-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact forensic ARM commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact protobuf runtime
        run: python -m pip install protobuf==5.29.5
      - name: Validate exact single-request forensic ARM before secrets
        run: python -m research_core_v4.shallow_m5_support_v2_v3_boundary_forensic_probe validate-arm
      - name: Execute exactly one read-only forensic history request
        env:
          CTRADER_CLIENT_ID: "${{ secrets.CTRADER_CLIENT_ID }}"
          CTRADER_CLIENT_SECRET: "${{ secrets.CTRADER_CLIENT_SECRET }}"
          CTRADER_ACCESS_TOKEN: "${{ secrets.CTRADER_ACCESS_TOKEN }}"
        run: |
          set -euo pipefail
          umask 077
          python -m research_core_v4.shallow_m5_support_v2_v3_boundary_forensic_probe run --output "$RUNNER_TEMP/mxm-v3-boundary-forensic-result-base.json"
      - name: Publish temporal geometry only and canonical audit stop
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          python -m research_core_v4.shallow_m5_support_v2_v3_boundary_forensic_probe publish --result-base "$RUNNER_TEMP/mxm-v3-boundary-forensic-result-base.json"
      - name: Remove local forensic result
        if: always()
        run: rm -f "$RUNNER_TEMP/mxm-v3-boundary-forensic-result-base.json"
