name: c012-recovery-source-bundle
on:
  push:
    branches:
      - forensic-stabilization-20260922
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact checked-out source
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path(".")
          out=Path("/tmp/MXM_C012_RECOVERY_SOURCE.zip")
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or ".git" in p.parts:
                      continue
                  z.write(p,p.as_posix())
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MXM_C012_RECOVERY_SOURCE
          path: /tmp/MXM_C012_RECOVERY_SOURCE.zip
          if-no-files-found: error
          retention-days: 1
