name: MXM B-E distinct annual JPY four-hour factor residual original CSharp EUR200
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/laboratory/mxm_be_jpy_residual_annual_funded_20261101.py
      - research_core_v4/laboratory/MXM_BE_JPY_RESIDUAL_ANNUAL_FUNDED_20261101.json
      - .github/workflows/mxm-be-jpy-residual-annual-20261101.yml
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [.github/workflows/mxm-be-jpy-residual-annual-20261101.yml]
permissions: {contents: read, actions: read}
concurrency: {group: mxm-be-jpy-residual-annual-new-first-20261101, cancel-in-progress: false}
jobs:
  offline-causal-source-and-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Only one genuinely distinct source-blind factor rule, original SHA, JSON-safe custody
        run: |
          set -eu
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          python3 -m research_core_v4.laboratory.mxm_be_jpy_residual_annual_funded_20261101 selftest
          python3 - <<'PY'
          from research_core_v4.laboratory.mxm_be_jpy_residual_annual_funded_20261101 import pdoc
          p=pdoc()
          assert p["risk"]["initial_eur"]==200 and p["source"]["new_broker_requests"]==0
          assert p["cost_scenario"]["historical_broker_costs_verified"] is False
          assert p["mechanism"]["prior_closed_identity_never_called"] is True
          print("FROZEN_ANNUAL_JPY_RESIDUAL_NATIVE_CSHARP_SOURCE_BLIND_OK")
          PY
      - name: Compile and exercise unchanged real CSharp shared funded account
        run: |
          dotnet build research_core_v4/laboratory/csharp/portfolio_policy/MxmPortfolioPolicy.csproj -c Release
          dotnet build research_core_v4/laboratory/csharp/shared_account/MxmSharedAccount.csproj -c Release
          python3 -m unittest research_core_v4.laboratory.test_portfolio_programme -v
  first-protected-original:
    needs: offline-causal-source-and-json
    if: github.event_name == 'push' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing native funded CSharp engine exact build
        run: |
          set -eu
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          dotnet build research_core_v4/laboratory/csharp/shared_account/MxmSharedAccount.csproj -c Release
      - name: Authorize exact first official reviewed source and one V4 registered study
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 -m research_core_v4.laboratory.mxm_be_jpy_residual_annual_funded_20261101 admit
      - name: Original M5 derived annual returns, actual native EUR200 account and stress
        id: economics
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.mxm_be_jpy_residual_annual_funded_20261101 run
      - name: Cold independently reconcile original CSharp cash ledger under owner encryption
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.mxm_be_jpy_residual_annual_funded_20261101 cold
      - name: Preserve public aggregate even if custody fails and private data encryption
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-be-jpy-fourhour-original-${{ github.run_id }}
          path: verification/mxm-be-jpy-residual-annual-20261101/
          if-no-files-found: warn
          retention-days: 90
