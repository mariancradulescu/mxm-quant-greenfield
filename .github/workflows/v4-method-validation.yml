name: Research Core V4 Method Validation

on:
  push:
    branches:
      - performance-research-v3-20260922
    paths:
      - "research_core_v4/**"
      - "tests/test_research_core_v4_method.py"
      - "tests/test_research_core_v4_response_evaluator.py"
      - "tests/test_research_core_v4_support_geometry.py"
      - "research_core_v3/state/V3_STATE.json"
      - "research_core_v3/state/V3_FREEZE_AUTHORITY_V1.json"
      - ".github/workflows/v4-method-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install method-only dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Static compile
        run: |
          python -m py_compile \
            research_core_v4/frozen_v2_semantics.py \
            research_core_v4/response_evaluator_v3.py \
            research_core_v4/exact_geometry_calibration_v2.py \
            research_core_v4/development_execution_runner_v1.py
      - name: Preoutcome architecture and evaluator invariants
        run: |
          python -m unittest \
            tests.test_research_core_v4_method \
            tests.test_research_core_v4_response_evaluator \
            tests.test_research_core_v4_support_geometry \
            tests.test_research_core_v4_execution_binding
      - name: Exact real-support geometry synthetic calibration smoke
        run: |
          python research_core_v4/exact_geometry_calibration_v2.py \
            --support-root research_core_v4/support \
            --smoke \
            --output /tmp/exact_geometry_smoke.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/exact_geometry_smoke.json"))
          assert x["market_responses_used"] is False
          assert x["support_rows"] == 3791
          assert x["P"] == 127
          assert 0 <= x["negative"]["global_any"] < .10
          assert x["positive"]["active_context"] > x["negative"]["active_context"]
          print("V4_EXACT_GEOMETRY_CALIBRATION_SMOKE_PASS",x)
          PY
      - name: Evaluator default is fail closed
        run: |
          python research_core_v4/response_evaluator_v3.py --self-test-summary > /tmp/evaluator.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/evaluator.json"))
          assert x["real_execution_default"] == "DENIED"
          assert x["horizons"] == [3,6,12,48]
          assert x["permutations"] == 1023
          print("V4_EVALUATOR_FAIL_CLOSED_PASS")
          PY
      - name: Assert no broker or order surface in V4 implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          files=list(Path("research_core_v4").rglob("*.py"))
          text="\n".join(p.read_text(encoding="utf-8") for p in files)
          forbidden=[
            "ProtoOAGetTickDataReq",
            "ProtoOAGetTrendbarsReq",
            "ProtoOANewOrderReq",
            "live.ctraderapi.com",
            "place_order",
            "accessToken",
          ]
          bad=[x for x in forbidden if x in text]
          if bad:
              raise SystemExit(f"broker/acquisition/order token present in V4 implementation: {bad}")
          print("V4_NO_BROKER_ACQUISITION_ORDER_SURFACE_PASS")
          PY
