name: Research Core V4 Method Validation

on:
  push:
    branches:
      - performance-research-v3-20260922
    paths:
      - "research_core_v4/**"
      - "tests/test_research_core_v4_method.py"
      - "research_core_v3/state/V3_STATE.json"
      - "research_core_v3/state/V3_CONTROL_PLANE_REPAIR_V1.json"
      - "research_core_v3/state/V3_FREEZE_AUTHORITY_V1.json"
      - "research_core_v3/state/V3_POST_FREEZE_WORKFLOW_HARDENING_V1.json"
      - ".github/workflows/v4-method-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install method-only dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Static compile
        run: |
          python -m py_compile research_core_v4/detector_calibration.py
      - name: Preoutcome architecture invariants
        run: |
          python -m unittest tests.test_research_core_v4_method
      - name: Synthetic pooled detector smoke calibration
        run: |
          python research_core_v4/detector_calibration.py --quick --mode pooled_information_source --output /tmp/v4_quick_calibration.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/v4_quick_calibration.json"))
          assert p["null_reps"] == 2000
          assert p["positive_reps_per_effect_per_regime"] == 400
          assert 2.0 < p["pooled_local_maxT_95pct_threshold"] < 4.0
          assert set(p["noise_regimes"]) == {"5","10","20"}
          print("V4_SYNTHETIC_SMOKE_PASS")
          PY
      - name: Assert no market execution surface in V4 method layer
        run: |
          python - <<'PY'
          from pathlib import Path
          files=list(Path("research_core_v4").rglob("*.py"))
          text="\n".join(p.read_text(encoding="utf-8") for p in files)
          forbidden=[
            "ProtoOAGetTickDataReq",
            "ProtoOAGetTrendbarsReq",
            "ProtoOANewOrderReq",
            "live.ctraderapi.com",
            "place_order",
          ]
          bad=[x for x in forbidden if x in text]
          if bad:
              raise SystemExit(f"market execution/acquisition token present in V4 method layer: {bad}")
          print("V4_NO_MARKET_EXECUTION_SURFACE_PASS")
          PY
