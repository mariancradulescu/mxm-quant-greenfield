name: Research Core V4 Method Validation
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: ["research_core_v4/**","tests/test_research_core_v4_*.py",".github/workflows/v4-method-validation.yml",".github/workflows/v4-greenfield-recovery-v4.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  publication-state:
    runs-on: ubuntu-24.04
    outputs:
      pre_arm: ${{ steps.phase.outputs.pre_arm }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Route only validations compatible with durable V4 phase
        id: phase
        run: |
          if test -f research_core_v4/state/FIRST_V4_DEVELOPMENT_RESPONSE_RESULT_V1.json; then
            python -m unittest -q tests.test_research_core_v4_publication_only
            python -m research_core_v4.publication_only_v1 --verify-canonical "$PWD"
            echo "pre_arm=false" >> "$GITHUB_OUTPUT"
          elif test -f research_core_v4/state/FIRST_V4_DEVELOPMENT_RESPONSE_CRASH_RECOVERY_V4_ARM_V1.json; then
            echo "pre_arm=false" >> "$GITHUB_OUTPUT"
          else
            echo "pre_arm=true" >> "$GITHUB_OUTPUT"
          fi
  method-validation:
    needs: publication-state
    if: needs.publication-state.outputs.pre_arm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r research_core_v4/runtime/numeric-requirements-v1.txt
      - run: python -m py_compile research_core_v4/frozen_v2_semantics.py research_core_v4/response_evaluator_v3.py research_core_v4/exact_geometry_calibration_v3.py research_core_v4/development_execution_runner_v1.py research_core_v4/crash_recovery_control_v3.py research_core_v4/greenfield_runtime_benchmark_v1.py research_core_v4/recovery_v3_prearm_gate.py research_core_v4/asymmetric_recovery_v4_gate.py
      - run: python -m unittest tests.test_research_core_v4_method tests.test_research_core_v4_response_evaluator tests.test_research_core_v4_support_geometry tests.test_research_core_v4_execution_binding tests.test_research_core_v4_prearm_gate
      - run: python research_core_v4/asymmetric_recovery_v4_gate.py --audit
      - name: Exact geometry synthetic smoke
        run: |
          python research_core_v4/exact_geometry_calibration_v3.py --support-root research_core_v4/support_v2 --smoke --output /tmp/g.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/g.json")); assert not x["market_responses_used"] and x["support_rows"]==3753 and x["P"]==127 and x["selector_tiecheck"]==2 and x["full_arm_weighting_parity"]["abs_diff"]<1e-12 and 0<=x["negative"]["global_any"]<.10 and x["positive"]["active_context"]>x["negative"]["active_context"]
          PY
      - name: Evaluator and runner default fail closed
        run: |
          python research_core_v4/response_evaluator_v3.py --self-test-summary >/tmp/e.json
          python research_core_v4/development_execution_runner_v1.py --self-test-summary >/tmp/r.json
          python - <<'PY'
          import json
          e=json.load(open("/tmp/e.json")); r=json.load(open("/tmp/r.json")); assert e["real_execution_default"]=="DENIED" and e["permutations"]==1023 and r["default"]=="DENIED" and r["seed"]==20261002
          PY
      - name: No broker acquisition or order surface
        run: |
          python - <<'PY'
          from pathlib import Path
          t="\n".join(p.read_text() for p in Path("research_core_v4").rglob("*.py")); bad=[x for x in ["ProtoOAGetTickDataReq","ProtoOAGetTrendbarsReq","ProtoOANewOrderReq","live.ctraderapi.com","place_order","accessToken"] if x in t]
          assert not bad,bad
          PY
