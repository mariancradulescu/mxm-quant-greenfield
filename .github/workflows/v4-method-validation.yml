name: Research Core V4 Method Validation

on:
  push:
    branches:
      - performance-research-v3-20260922
    paths:
      - "research_core_v4/**"
      - "tests/test_research_core_v4_method.py"
      - "research_core_v3/state/V3_STATE.json"
      - "research_core_v3/state/V3_CONTROL_PLANE_REPAIR_V1.json"
      - "research_core_v3/state/V3_FREEZE_AUTHORITY_V1.json"
      - "research_core_v3/state/V3_POST_FREEZE_WORKFLOW_HARDENING_V1.json"
      - ".github/workflows/v4-method-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install method-only dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Static compile
        run: |
          python -m py_compile research_core_v4/detector_calibration.py research_core_v4/detector_calibration_v3.py
      - name: Preoutcome architecture invariants
        run: |
          python -m unittest tests.test_research_core_v4_method
      - name: Synthetic heterogeneous hierarchical detector smoke calibration
        run: |
          python research_core_v4/detector_calibration_v3.py --quick --output /tmp/v4_v3_quick_calibration.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/v4_v3_quick_calibration.json"))
          assert p["market_data_used"] is False
          assert 0.0 <= p["negative_control"]["global_any"] < 0.10
          assert p["heterogeneous_high_only_20bps"]["active_context"] > p["negative_control"]["active_context"]
          print("V4_HETEROGENEOUS_HIERARCHICAL_SYNTHETIC_SMOKE_PASS",p)
          PY
      - name: Assert no market execution or acquisition surface in V4 method layer
        run: |
          python - <<'PY'
          from pathlib import Path
          files=list(Path("research_core_v4").rglob("*.py"))
          text="\n".join(p.read_text(encoding="utf-8") for p in files)
          forbidden=[
            "ProtoOAGetTickDataReq",
            "ProtoOAGetTrendbarsReq",
            "ProtoOANewOrderReq",
            "live.ctraderapi.com",
            "place_order",
          ]
          bad=[x for x in forbidden if x in text]
          if bad:
              raise SystemExit(f"market execution/acquisition token present in V4 method layer: {bad}")
          print("V4_NO_MARKET_EXECUTION_OR_ACQUISITION_SURFACE_PASS")
          PY
