name: Adaptive Competition V1 Mechanical Validation
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: ['adaptive_competition/**', '.github/workflows/adaptive-competition-v1-mechanical.yml']
permissions: {contents: read}
jobs:
  mechanical:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: {OPENBLAS_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.16.3
      - run: python -m adaptive_competition.test_core
      - name: Frozen implementation and historical boundary integrity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.loads(Path('adaptive_competition/state/ADAPTIVE_COMPETITION_POLICY_V1_FROZEN_SPEC.json').read_text())
          for p,h in s['implementation_hashes'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          assert hashlib.sha256(Path('research_core_v4/triad_v7/distributed/FINAL_V7_RUNTIME_BLOCKER_AUTHORITY_V1.json').read_bytes()).hexdigest()=='c519897953ad361d6949a76f14cb0e374705b1d296378179f58ac375daf34fd8'
          assert not s['protected_forward']['opened'] and not s['confirmation_opened'] and not s['orders']
          b=json.loads(Path('research_v3/SEARCH_BUDGET_GOVERNANCE_V2.json').read_text())['current']
          assert b['total']==84 and b['used']+b['remaining']==84
          PY
