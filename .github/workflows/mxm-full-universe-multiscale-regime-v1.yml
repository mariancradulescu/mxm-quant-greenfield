name: MXM full universe current cost and distinct multiscale regime DEVELOPMENT
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/multiscale_regime_v1/EXECUTION_V1.json]
permissions:
  contents: write
jobs:
  full-universe-read-only-current-cost:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.3.5
      - name: Freeze, causality, missingness and publication security synthetic tests
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python3 -m unittest research_core_v4.multiscale_regime_v1.test_kernel_v1
      - name: Read-only full broker contracts and minimum-ticket margins, encrypted
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
        run: |
          ulimit -v 2097152
          timeout --signal=TERM 2250 python3 -m research_core_v4.multiscale_regime_v1.cost_universe_v1
  authentic-distinct-multiscale-regime:
    needs: full-universe-read-only-current-cost
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.3.5
      - name: Strict paired new research on 100 authenticated original shards
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 2097152
          ulimit -t 1900
          timeout --signal=TERM 2250 python3 -m research_core_v4.multiscale_regime_v1.execute_v1
