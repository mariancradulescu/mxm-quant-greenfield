name: MXM Runtime isolated preflight (no credentials)

on:
  push:
    branches:
      - mxm-runtime-isolated-20261102
    paths:
      - '.github/workflows/mxm-runtime.yml'
      - 'mxm_runtime/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mxm-runtime-isolated-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-no-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout only isolated branch; no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce exactly one active workflow in isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" -eq 1
          test -f .github/workflows/mxm-runtime.yml
      - name: Validate new operation contract offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m mxm_runtime.contract selftest
      - name: Validate unchanged read-only transport and broker decoder offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          python3 -m research_core_v4.laboratory.mxm_be_owner_finite_broker_csharp_20261102 selftest
      - name: Build unchanged shared-funded EUR200 CSharp and single Cloud bot offline
        shell: bash
        run: |
          set -euo pipefail
          dotnet build research_core_v4/laboratory/csharp/shared_account/MxmSharedAccount.csproj -c Release
          dotnet build research_core_v4/native_tick_replay_v1/operational/MxmOperationalProductBot.csproj -c Release
