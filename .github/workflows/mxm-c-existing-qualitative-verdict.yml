name: MXM existing economic qualitative verdict
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [research_core_v4/successor_c_20261018/QUALITATIVE_VERDICT_REQUEST.json]
permissions: {}
concurrency:
  group: mxm-existing-qualitative-verdict
  cancel-in-progress: false
jobs:
  qualitative-existing-verdict:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing hash-locked modules
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Read saved interpretation only, no experiment or prior workflow replay
        run: python3 -m research_core_v4.successor_c_20261018.verdict
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-existing-qualitative-verdict-${{ github.run_id }}
          path: verification/c-qualitative/verdict.json
          if-no-files-found: error
          retention-days: 90
