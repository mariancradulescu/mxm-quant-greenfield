name: MXM B-E one bounded first-only recovery of October Pepperstone M5 after protobuf failure
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/laboratory/mxm_be_new_october_m5_20261101.py
      - .github/workflows/mxm-be-october-m5-one-recovery-20261101.yml
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [.github/workflows/mxm-be-october-m5-one-recovery-20261101.yml]
permissions: {contents: read, actions: read}
concurrency:
  group: mxm-be-october-m5-one-recovery-20261101
  cancel-in-progress: false
jobs:
  source-blind-native-m5-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install existing pinned read-only transport and encryption libraries
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Prove M5 OPEN timestamp causal fence, native price deltas and bounded view-only API request types
        run: |
          set -eu
          python3 -m research_core_v4.laboratory.mxm_be_new_october_m5_20261101 selftest
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research_core_v4/laboratory/mxm_be_new_october_m5_20261101.py').read_text()
          assert 'MAX_REQUESTS=3+1+1+SLICES*len(SYMBOLS)' in p
          assert 'available_no_earlier_than_utc_ms' in p
          assert 'require_complete_bars(ans,5000,account,matches[name])' in p
          assert 'ProtoOAGetTrendbarsReq' in p
          assert 'ProtoOANewOrderReq' in p and 'not in ALLOWED' in p
          assert '2026-10-22T00:00:00Z' in p
          print('MXM_BE_FIRST_OCTOBER_M5_SOURCE_BOUNDARIES_VERIFIED')
          PY
  one-pepperstone-view-m5-recovery:
    needs: source-blind-native-m5-boundaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    environment: mxm-r3-pepperstone-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify original failure and one bounded first-only recovery before any broker credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 - <<'PY'
          import json,os,subprocess
          repo='repos/mariancradulescu/mxm-quant-greenfield/'
          def get(p):return json.loads(subprocess.check_output(['gh','api',repo+p],text=True))
          b='mxm-remediation-p0-p4-20261015-v1'
          assert os.environ['GITHUB_REPOSITORY']=='mariancradulescu/mxm-quant-greenfield'
          assert os.environ['GITHUB_REF']=='refs/heads/'+b and os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert get('git/ref/heads/'+b)['object']['sha']==os.environ['GITHUB_SHA']
          assert len(get('commits/'+os.environ['GITHUB_SHA'])['parents'])==2
          quote_source=get('actions/runs/41311440117')
          assert quote_source['conclusion']=='success' and quote_source['head_sha']=='6273c44e559e7d9a703a86b66ef344300c31814a'
          failed=get('actions/runs/41324683974')
          assert failed['conclusion']=='failure' and failed['head_sha']=='8fdc957f1afc25a77f03d3e326a1648ba0de5d37'
          originals=get('actions/runs/41324683974/artifacts')
          assert originals['total_count']==0
          old_history=get('actions/workflows/mxm-be-new-october-m5-20261101.yml/runs?per_page=100')
          assert old_history['total_count']<=100 and old_history['total_count']==len(old_history['workflow_runs'])
          old_pushes=[x for x in old_history['workflow_runs'] if x['event']=='push' and x['head_branch']==b]
          assert len(old_pushes)==1 and old_pushes[0]['id']==41324683974
          inventory=get('actions/workflows/mxm-be-october-m5-one-recovery-20261101.yml/runs?per_page=100')
          assert inventory['total_count']<=100 and inventory['total_count']==len(inventory['workflow_runs'])
          pushes=[x for x in inventory['workflow_runs'] if x['event']=='push' and x['head_branch']==b]
          assert len(pushes)==1 and pushes[0]['id']==int(os.environ['GITHUB_RUN_ID'])
          print('MXM_BE_OCT_M5_ONLY_RECOVERY_READ_ONLY_SOURCE_ADMITTED')
          PY
      - name: Install existing pinned native broker transport and source encryption
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Bounded October M5 Pepperstone source, no trading or Cloud
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.mxm_be_new_october_m5_20261101 original
      - name: Preserve original broker M5 encrypted and public coverage geometry only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-be-october-m5-recovery-first-${{ github.run_id }}
          path: verification/be-new-october-m5-20261101/
          retention-days: 90
          if-no-files-found: error
