name: MXM delegated campaign new controls
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: ['research_core_v4/delegated_campaign_20261019/**', '.github/workflows/mxm-delegated-bc*.yml']
permissions: {}
jobs:
  new-delegation-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing locked dependencies, no App or OWNER key
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Only new delegated control, science and atomic cold recovery tests
        run: python3 -m unittest research_core_v4.delegated_campaign_20261019.test_campaign -v
