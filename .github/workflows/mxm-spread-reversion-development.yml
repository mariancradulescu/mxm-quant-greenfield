{
  "name": "MXM one prospective unilateral spread reversion headroom trial",
  "on": {
    "push": {
      "branches": [
        "mxm-remediation-p0-p4-20261015-v1"
      ],
      "paths": [
        ".github/workflows/mxm-spread-reversion-development.yml"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "mxm-integrated-laboratory",
    "cancel-in-progress": false
  },
  "jobs": {
    "spread-reversion-development": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "environment": "mxm-r3-custody-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "d2fae5641b759b1c8c24161d83d62d39e104eafd",
            "path": ".sealed-chronology-source",
            "persist-credentials": false
          }
        },
        {
          "name": "Admit one frozen hypothesis and full existing week before custody",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -m research_core_v4.laboratory.spread_reversion_development admit"
        },
        {
          "name": "Compile actual CSharp and verify independent artificial causal cases before market data",
          "run": "dotnet build research_core_v4/laboratory/csharp/spread_reversion/MxmSpreadReversion.csproj -c Release\npython3 -m unittest research_core_v4.laboratory.test_spread_reversion research_core_v4.laboratory.test_spread_reversion_development -v\npython3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock\npython3 -m research_core_v4.laboratory.durable_gbpusd_week37_chronology --out \"${RUNNER_TEMP}/mxm-spread/original\"\ncp research_core_v4/laboratory/week_chronology_reception.py research_core_v4/laboratory/usd_pair_native_reception.py research_core_v4/laboratory/usd_pair_alignment.py research_core_v4/laboratory/spread_reversion_cold.py .sealed-chronology-source/research_core_v4/laboratory/"
        },
        {
          "name": "Authenticate existing complete GBPUSD history only in pinned native custody",
          "env": {
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          },
          "run": "umask 077\ncd .sealed-chronology-source\npython3 -m research_core_v4.laboratory.usd_pair_native_reception export GBPUSD \"${RUNNER_TEMP}/mxm-spread/original/capture.mxmenc\" \"${RUNNER_TEMP}/mxm-spread/gbp.ndjson\""
        },
        {
          "name": "Run one model without key and reconcile every decision episode and unresolved case; encrypt all economics",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "umask 077\ndotnet run --project research_core_v4/laboratory/csharp/spread_reversion/MxmSpreadReversion.csproj -c Release --no-build -- \"${RUNNER_TEMP}/mxm-spread/gbp.ndjson\" \"${RUNNER_TEMP}/mxm-spread/csharp.json\"\npython3 -m research_core_v4.laboratory.spread_reversion_development result \"${RUNNER_TEMP}/mxm-spread\""
        },
        {
          "name": "Separate custody process reads back exact encrypted economic result without running a model",
          "env": {
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          },
          "run": "umask 077\ncd .sealed-chronology-source\npython3 -m research_core_v4.laboratory.spread_reversion_cold"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "spread-reversion-development-${{ github.run_id }}",
            "path": "verification/spread-reversion-development/receipt.json\nverification/spread-reversion-development/full-result.mxmenc\nverification/spread-reversion-development/evaluator.dll\nverification/spread-reversion-development/cold.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
