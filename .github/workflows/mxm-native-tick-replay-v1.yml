name: MXM authentic historical technical native tick replay ONLY
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/native_tick_replay_v1/EXECUTION_V1.json]
permissions:
  contents: write
jobs:
  authentic-chronological-parity-no-broker-no-deployment:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          dotnet build research_core_v4/native_tick_replay_v1/csharp/Replay.csproj -c Release --nologo
          dotnet build research_core_v4/native_tick_replay_v1/csharp/NativeCompatible.csproj -c Release --nologo
          python3 -m pip install protobuf==5.29.5 numpy==2.3.5 cryptography==46.0.4
      - name: Existing encrypted authentic pages; chronological replay and private parity evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: timeout --signal=TERM 780 python3 -m research_core_v4.native_tick_replay_v1.runner_v1
