name: MXM existing encrypted progress receipt delivery
on:
  push:
    branches: [mxm-full-frontier-readback-20261014-v1]
    paths: [research_core_v4/full_native_frontier_checkpoint_20261014_v1/DELIVERY_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-full-frontier-cipher-delivery-20261014-v1
  cancel-in-progress: false
jobs:
  cipher_delivery:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Preserve existing encrypted receipt for recipient verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m research_core_v4.full_native_frontier_checkpoint_20261014_v1.delivery_v1
