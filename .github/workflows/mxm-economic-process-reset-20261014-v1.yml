name: MXM quantified economic frontier and causal hypothesis qualification
on:
  push:
    branches: [mxm-economic-process-reset-20261014-v1]
    paths: [research_core_v4/economic_process_reset_20261014_v1/AUTHORITY_V1.json]
permissions: {contents: write}
concurrency:
  group: mxm-independent-economic-process-reset-20261014-v1
  cancel-in-progress: false
jobs:
  economic:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - run: python3 -m unittest -v research_core_v4.economic_process_reset_20261014_v1.test_frontier
      - run: dotnet build research_core_v4/economic_process_reset_20261014_v1/csharp/Native.csproj -c Release --nologo
      - run: dotnet build research_core_v4/economic_process_reset_20261014_v1/csharp/Contract.csproj -c Release --nologo
      - name: Native scheduler multi-symbol and aggregate hedged risk contract
        run: |
          dotnet research_core_v4/economic_process_reset_20261014_v1/csharp/bin/Release/net8.0/Contract.dll research_core_v4/economic_process_reset_20261014_v1/csharp/native-contract-result.json
      - name: Quantify minimum ticket cost risk frequency before conditional pilot enrollment
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m research_core_v4.economic_process_reset_20261014_v1.runner
      - name: Preserve encrypted economic publication outbox on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-economic-owner-outbox-${{ github.run_id }}
          path: ${{ runner.temp }}/mxm-encrypted-outbox/*.mxmenc
          if-no-files-found: ignore
          retention-days: 30
