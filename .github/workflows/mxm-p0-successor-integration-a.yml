name: MXM P0 successor A native isolated integration NO GO
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/p0_successor_a_20261017/**
      - .github/workflows/mxm-p0-successor-integration-a.yml
permissions: {}
jobs:
  new-integration-only:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.actor_id == '322088485' && github.run_attempt == 1 && github.sha == github.event.after
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 1}
      - name: New integration; only isolated synthetic ref, never App credentials
        run: python3 -m research_core_v4.p0_successor_a_20261017.integration
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mxm-p0-successor-a-${{ github.sha }}
          path: verification/successor-a/
          if-no-files-found: error
          retention-days: 90
