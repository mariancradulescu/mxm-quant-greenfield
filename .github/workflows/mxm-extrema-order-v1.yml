name: MXM one new authentic M5 extrema-order DEVELOPMENT
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/extrema_order_v1/EXECUTION_V1.json]
permissions:
  contents: write
jobs:
  frozen-one-use-authentic-extrema-time-order-only:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5
      - name: Verify old 100 authentic encrypted shards and execute one new exact only
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
        run: |
          ulimit -v 2097152
          ulimit -t 1200
          timeout --signal=TERM 1500 python3 -m research_core_v4.extrema_order_v1.runner_v1
