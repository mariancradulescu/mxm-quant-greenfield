name: MXM completed dynamic exit private accounting readback V1
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/dynamic_exit_diagnostic_v1/FINAL_READBACK_EXECUTION_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-dynamic-exit-final-readback-v1
  cancel-in-progress: false
jobs:
  saved-accounting-readback:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Read existing encrypted accounts without broker or model calls
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m research_core_v4.dynamic_exit_diagnostic_v1.readback_v1
