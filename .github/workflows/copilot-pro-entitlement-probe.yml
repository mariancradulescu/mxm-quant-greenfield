name: MXM Deprecated Copilot Pro Entitlement Probe

# Historical one-shot diagnostic only. Direct provider probes and research-branch
# mutations are disabled; the canonical serialized Supervisor owns both.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/copilot-pro-entitlement-probe.yml"

permissions:
  contents: read

concurrency:
  group: mxm-read-only-copilot-entitlement-probe
  cancel-in-progress: true

jobs:
  deprecated-read-only:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Refuse duplicate provider or branch-writer activity
        run: |
          echo "Deprecated diagnostic: no provider call and no research-branch mutation are authorized here."
          echo "Use the canonical serialized Autonomous Research Runtime V2 Supervisor for legitimate continuation."
