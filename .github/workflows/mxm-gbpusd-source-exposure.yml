{
  "name": "MXM one existing GBPUSD source exposure census",
  "on": {
    "push": {
      "branches": [
        "mxm-remediation-p0-p4-20261015-v1"
      ],
      "paths": [
        ".github/workflows/mxm-gbpusd-source-exposure.yml"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "mxm-integrated-laboratory",
    "cancel-in-progress": false
  },
  "jobs": {
    "gbpusd-source-exposure": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "environment": "mxm-r3-custody-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "d2fae5641b759b1c8c24161d83d62d39e104eafd",
            "path": ".sealed-chronology-source",
            "persist-credentials": false
          }
        },
        {
          "name": "Admit one registered source-only question before custody access",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -m research_core_v4.laboratory.gbpusd_source_exposure admit"
        },
        {
          "name": "Restore exact existing GBPUSD bytes and native decoder extension",
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock\npython3 -m unittest research_core_v4.laboratory.test_gbpusd_source_exposure research_core_v4.laboratory.test_source_exposure_capacity -v\npython3 -m research_core_v4.laboratory.durable_gbpusd_week37_chronology --out \"${RUNNER_TEMP}/mxm-gbp-source/original\"\ncp research_core_v4/laboratory/week_chronology_reception.py research_core_v4/laboratory/usd_pair_native_reception.py research_core_v4/laboratory/usd_pair_alignment.py .sealed-chronology-source/research_core_v4/laboratory/"
        },
        {
          "name": "Reauthenticate only existing GBPUSD original inside native custody",
          "env": {
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          },
          "run": "umask 077\ncd .sealed-chronology-source\npython3 -m research_core_v4.laboratory.usd_pair_native_reception export GBPUSD \"${RUNNER_TEMP}/mxm-gbp-source/original/capture.mxmenc\" \"${RUNNER_TEMP}/mxm-gbp-source/gbp.ndjson\""
        },
        {
          "name": "Assess all original source groups under unchanged five-minute contract",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "umask 077\npython3 -m research_core_v4.laboratory.gbpusd_source_exposure assess \"${RUNNER_TEMP}/mxm-gbp-source/gbp.ndjson\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "gbpusd-source-exposure-${{ github.run_id }}",
            "path": "verification/gbpusd-source-exposure/receipt.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
