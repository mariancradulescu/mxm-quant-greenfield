name: MASTER1576 Qualification V2 Synthetic Exact Head Offline Validation
on:
  push:
    branches: [performance-research-v3-20260922]
    paths:
      - research_core_v4/master1576_screen_v2.py
      - research_core_v4/master1576_screen_v2_preflight.py
      - research_core_v4/state/MASTER1576_POST_SHALLOW_OUTCOME_BLIND_DEEP_HISTORICAL_M5_QUALIFICATION_PROTOCOL_V2.json
      - research_core_v4/state/MASTER1576_QUALIFICATION_V2_SYNTHETIC_PREFLIGHT_RESULT_V1.json
      - research_core_v4/state/V4_STATE.json
      - adaptive_competition/state/ADAPTIVE_COMPETITION_CURRENT_STATE.json
      - adaptive_competition/state/ADAPTIVE_COMPETITION_AUTHORITY_V1.json
      - tests/test_master1576_screen_v2.py
      - .github/workflows/master1576-screen-v2-synthetic-offline.yml
permissions:
  contents: read
jobs:
  exact-head-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove synthetic-only route and no private injection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/master1576-screen-v2-synthetic-offline.yml').read_text()
          assert ('secrets'+'.') not in p
          assert 'workflow_dispatch' not in p
          assert '--arm' not in p
          PY
      - name: Execute deterministic structural and cryptographic synthetic preflight
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m research_core_v4.master1576_screen_v2_preflight --output /tmp/MASTER1576_V2_SYNTHETIC_PREFLIGHT.json
      - name: Print exact frozen hashes
        run: |
          git rev-parse HEAD
          sha256sum research_core_v4/state/MASTER1576_POST_SHALLOW_OUTCOME_BLIND_DEEP_HISTORICAL_M5_QUALIFICATION_PROTOCOL_V2.json research_core_v4/master1576_screen_v2.py
