name: MASTER1576 Qualification V2 Authorized One Time Real Structural Screen
on:
  push:
    branches: [performance-research-v3-20260922]
    paths:
      - research_core_v4/state/MASTER1576_QUALIFICATION_V2_REAL_SCREEN_AUTHORIZATION_V1.json
permissions:
  contents: write
concurrency:
  group: master1576-qualification-v2-real-screen
  cancel-in-progress: false
jobs:
  authorized-structural-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate durable authorization and claim attempt before private access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python -m research_core_v4.master1576_screen_v2_real_launcher_v1 presecret --receipt "$RUNNER_TEMP/master1576-presecret.json"
      - name: Execute frozen structural worker through temporary ARM adapter
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
        run: |
          umask 077
          python -m research_core_v4.master1576_screen_v2_real_launcher_v1 execute --receipt "$RUNNER_TEMP/master1576-presecret.json" --completed-receipt "$RUNNER_TEMP/master1576-completed.json"
      - name: Atomically publish only complete frozen structural result
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research_core_v4.master1576_screen_v2_real_launcher_v1 publish --receipt "$RUNNER_TEMP/master1576-presecret.json" --completed-receipt "$RUNNER_TEMP/master1576-completed.json"
      - name: Remove local result and private control receipts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/master1576-presecret.json" "$RUNNER_TEMP/master1576-completed.json"
          rm -f research_core_v4/state/MASTER1576_QUALIFICATION_V2_REAL_STRUCTURAL_SCREEN_RESULT_V1.json research_core_v4/state/MASTER1576_QUALIFICATION_V2_REAL_STRUCTURAL_SCREEN_RESULT_V1.json.attempt-lock research_core_v4/state/MASTER1576_QUALIFICATION_V2_REAL_STRUCTURAL_SCREEN_RESULT_V1.json.tmp
