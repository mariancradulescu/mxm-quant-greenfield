name: MXM scientific program V6 investigation
run-name: MXM V6 ${{ inputs.task || 'CARRY_TEMPORAL_AUTHORITY' }}
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [research_core_v4/autonomous_laboratory_20261019_v6/EXECUTE_V6.json]
  workflow_dispatch:
    inputs:
      task:
        description: Registered scientific task only
        type: choice
        options: [CARRY_TEMPORAL_AUTHORITY, MINIMUM_TICKET_CAPITAL_SCALE]
        required: true
        default: CARRY_TEMPORAL_AUTHORITY
      parent_oid:
        description: Exact durable scientific evidence commit
        type: string
        required: false
permissions: {contents: read, actions: read}
concurrency:
  group: mxm-scientific-program-v6
  cancel-in-progress: false
jobs:
  investigation:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref_name == 'mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c77892376874a675f83bbc8fd6800918820ecb2a
          persist-credentials: false
      - run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: New controls, once before the first investigation
        if: github.event_name == 'push'
        run: python3 -m unittest research_core_v4.autonomous_laboratory_20261019_v6.test_core -v
      - name: Execute one admitted scientific question from durable state
        run: python3 -m research_core_v4.autonomous_laboratory_20261019_v6.runtime "$V6_TASK"
        env:
          GH_TOKEN: ${{ github.token }}
          V6_TASK: ${{ inputs.task || 'CARRY_TEMPORAL_AUTHORITY' }}
          V6_PARENT_OID: ${{ inputs.parent_oid }}
          V6_SOURCE_SHA: c77892376874a675f83bbc8fd6800918820ecb2a
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-scientific-v6-${{ github.run_id }}
          path: verification/autonomous-laboratory-v6/
          if-no-files-found: error
  durable-archive:
    needs: investigation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    outputs:
      next_task: ${{ steps.archive.outputs.next_task }}
      evidence_oid: ${{ steps.archive.outputs.evidence_oid }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c77892376874a675f83bbc8fd6800918820ecb2a
          persist-credentials: false
      - run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mxm-scientific-v6-${{ github.run_id }}
          path: verification/science-input/
      - id: archive
        name: Atomic encrypted documentation archive, no OWNER or App key
        run: python3 -m research_core_v4.autonomous_laboratory_20261019_v6.publish
        env:
          GH_TOKEN: ${{ github.token }}
          V6_SOURCE_SHA: c77892376874a675f83bbc8fd6800918820ecb2a
  scientific-handoff:
    needs: durable-archive
    if: needs.durable-archive.outputs.next_task != 'STOP'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read, actions: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c77892376874a675f83bbc8fd6800918820ecb2a
          persist-credentials: false
      - run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Dispatch only the registered successor selected by the economic verdict
        run: python3 -m research_core_v4.autonomous_laboratory_20261019_v6.handoff
        env:
          GH_TOKEN: ${{ github.token }}
          V6_SOURCE_SHA: c77892376874a675f83bbc8fd6800918820ecb2a
          V6_NEXT_TASK: ${{ needs.durable-archive.outputs.next_task }}
          V6_EVIDENCE_OID: ${{ needs.durable-archive.outputs.evidence_oid }}
