{
  "name": "MXM R3 existing App ACL read-only diagnostic",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {},
  "concurrency": {
    "group": "mxm-integrated-laboratory",
    "cancel-in-progress": false
  },
  "jobs": {
    "app-control-diagnostic": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/main' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "environment": "mxm-p0-successor-issuer-v1",
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "36668adfdb6d0cf433965ad573376434063652d6",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock"
        },
        {
          "name": "Read actual App ACL response; mint/use/revoke once; no publication",
          "run": "python3 - <<'PY'\nimport json,os,subprocess,urllib.error\nfrom research_core_v4.laboratory.common import need\nfrom research_core_v4.p0_successor_a_20261017.issuer import _app_token,http,REPO\nfrom research_core_v4.laboratory.operational_acceptance import verify_effective_controls\nneed(os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_REF']=='refs/heads/main' and os.environ['GITHUB_RUN_ATTEMPT']=='1' and os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' and os.environ['GITHUB_JOB']=='app-control-diagnostic','APP_DIAGNOSTIC_CONTEXT')\nneed(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='36668adfdb6d0cf433965ad573376434063652d6','APP_DIAGNOSTIC_SOURCE')\nneed(not any(os.environ.get(k) for k in ('MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM','R3_CUSTODY_PRIVATE_KEY_PEM','CTRADER_ACCESS_TOKEN','R3_CTRADER_ACCESS_TOKEN')),'APP_DIAGNOSTIC_NO_CUSTODY_OR_BROKER')\nkey=os.environ.pop('SUCCESSOR_APP_PRIVATE_KEY')\nwith _app_token(key) as token:\n    key=None\n    for branch in ('mxm-r3-integrated-source-20261021','mxm-o04-integrated-laboratory-evidence'):\n        status,rules=http('/repos/'+REPO+'/rules/branches/'+branch,token)\n        print('MXM_APP_EFFECTIVE_RULES '+json.dumps({'branch':branch,'http_status':status,'rules':rules},sort_keys=True),flush=True)\n    for ident in (25521657,25522027,25461373):\n        print('MXM_APP_ACL_REQUEST ruleset='+str(ident),flush=True)\n        try: status,policy=http('/repos/'+REPO+'/rulesets/'+str(ident),token)\n        except urllib.error.HTTPError as error:\n            print('MXM_APP_ACL_ERROR '+json.dumps({'ruleset_id':ident,'http_status':error.code}),flush=True)\n            continue\n        print('MXM_APP_ACL_DIAGNOSTIC '+json.dumps({'run_id':int(os.environ['GITHUB_RUN_ID']),'ruleset_id':ident,'http_status':status,'keys':sorted(policy),'policy':{k:policy[k] for k in ('id','enforcement','conditions','rules','updated_at','bypass_actors') if k in policy},'writes':0,'orders':0},sort_keys=True),flush=True)\nprint('MXM_APP_DIAGNOSTIC_TOKEN_REVOKED writes=0 orders=0 economic_outcomes=0',flush=True)\nPY",
          "env": {
            "SUCCESSOR_APP_PRIVATE_KEY": "${{ secrets.SUCCESSOR_APP_PRIVATE_KEY }}"
          }
        }
      ]
    }
  }
}
