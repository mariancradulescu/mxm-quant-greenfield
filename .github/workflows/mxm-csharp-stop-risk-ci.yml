name: MXM CSharp account-wide stop-risk admission no-secret CI
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/native_tick_replay_v1/csharp/**
      - .github/workflows/mxm-csharp-stop-risk-ci.yml
permissions: {contents: read}
jobs:
  validate-account-stop-risk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Compile actual Cloud-compatible CSharp product and deterministic reference
        run: |
          dotnet build research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release
          dotnet build research_core_v4/native_tick_replay_v1/csharp/MxmReferenceBot.csproj -c Release
          test -s research_core_v4/native_tick_replay_v1/csharp/bin/Release/net6.0/native_tick_replay_v1.algo
      - name: Validate same EUR stop-risk law on artificial threshold, existing risk, friction and no-stop cases
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --stop-risk-fixture
          python3 - <<'PY'
          import pathlib
          source=pathlib.Path('research_core_v4/native_tick_replay_v1/csharp/MxmReferenceProductBot.cs').read_text()
          helper=pathlib.Path('research_core_v4/native_tick_replay_v1/csharp/MxmStopRiskAdmission.cs').read_text()
          sim=pathlib.Path('research_core_v4/native_tick_replay_v1/csharp/EconomicReference.cs').read_text()
          assert 'instrument.AmountRisked(units,stopPips)' in source
          assert 'double stopPips=StopLossPips,pipSize=instrument.PipSize,tickSize=instrument.TickSize' in source
          assert 'StopLossPips!=stopPips' in source
          assert 'Positions.FindAll(Label)' in source
          assert 'active.StopLoss.HasValue' in source
          assert 'active.Symbol.AmountRisked(active.VolumeInUnits,distancePips)' in source
          assert 'MxmStopRiskGeometry.TryDistance(' in source
          assert '(decimal)active.Symbol.Bid,(decimal)active.Symbol.Ask' in source
          assert 'Math.Abs(active.EntryPrice-active.StopLoss.Value)' not in source
          geometry=pathlib.Path('research_core_v4/native_tick_replay_v1/csharp/MxmStopRiskGeometry.cs').read_text()
          assert 'bid-stop:stop-ask' in geometry
          assert 'REJECT_STOP_TOUCHED_OR_PASSED_ACK_UNRESOLVED' in geometry
          assert 'MxmStopRiskAdmission.Check(' in source and 'MxmStopRiskAdmission.Check(' in sim
          assert 'EnableDemoTrading && !Account.IsLive' in source
          assert 'DefaultValue=2.0' in source and 'EstimatedRoundTripFrictionReserveEur' in source
          assert 'ADMIT_STOP_RISK_ESTIMATE_ONLY' in helper and 'REJECT_AGGREGATE_STOP_RISK_EXCESS' in helper
          assert 'stop_risk_rejections' in sim and 'maxEstimatedStopRiskFraction=0m' in sim
          assert 'ExecuteMarketOrder(' in source and source.index('MxmStopRiskAdmission.Check(')<source.index('ExecuteMarketOrder(')
          print('MXM_ACCOUNT_WIDE_STOP_RISK_DEMO_ONLY_NO_SECRET_PASS')
          PY
      - name: Run predeclared six-cell stop-risk capacity matrix on artificial prices only
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --risk-capacity-fixture unused verification/stop-risk-capacity-artificial
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('verification/stop-risk-capacity-artificial/stop-risk-capacity.json').read_text())
          assert x['classification']=='ARTIFICIAL_STOP_RISK_CAPACITY_ONLY' and x['original_run_id']==0
          assert x['model_leaves']==6 and x['source_authentication_must_be_bound_externally']
          assert {z['max_estimated_stop_risk_fraction'] for z in x['capacities']}=={0.005,0.01,0.02}
          assert {z['assumed_cost_reserve_eur'] for z in x['capacities']}=={0.2,1.0}
          assert all(z['modeled_entries']==z['modeled_exits'] and
                     z['stop_risk_rejections']>=0 for z in x['capacities'])
          assert all(z['modeled_entries']==0 for z in x['capacities'] if z['max_estimated_stop_risk_fraction']==0.005)
          assert any(z['modeled_entries']>0 for z in x['capacities'] if z['max_estimated_stop_risk_fraction']==0.02)
          assert not x['selected_candidate'] and not x['independent_scientific_trial'] and x['actual_broker_orders']==0
          print('MXM_FINITE_RISK_CAPACITY_ARTIFICIAL_NEGATIVE_AND_POSITIVE_GATE_PASS')
          PY
