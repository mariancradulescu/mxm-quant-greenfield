name: MXM owner authentic quote and distinct transition frontier
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/owner_frontier_v1/OWNER_BOUNDED_RESEARCH_V1.json]
permissions:
  contents: write
jobs:
  distinct-prequential-transition-information:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5
      - name: One owner-authorized new information comparison with encrypted output
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
        run: |
          ulimit -v 2097152
          ulimit -t 1200
          timeout --signal=TERM 1500 python3 -m research_core_v4.owner_frontier_v1.execute_transition_v1
  authentic-historical-view-quotes:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5
      - name: Existing VIEW credential and historical quote acquisition only
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
        run: |
          ulimit -v 2097152
          ulimit -t 600
          timeout --signal=TERM 900 python3 -m research_core_v4.owner_frontier_v1.execute_historical_quotes_v1
