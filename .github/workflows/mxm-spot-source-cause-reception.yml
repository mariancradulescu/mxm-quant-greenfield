{
  "name": "MXM original spot source causes and CSharp input parity",
  "on": {
    "push": {
      "branches": [
        "mxm-remediation-p0-p4-20261015-v1"
      ],
      "paths": [
        ".github/workflows/mxm-spot-source-cause-reception.yml"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "mxm-integrated-laboratory",
    "cancel-in-progress": false
  },
  "jobs": {
    "spot-source-causes": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 12,
      "environment": "mxm-r3-custody-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "d2fae5641b759b1c8c24161d83d62d39e104eafd",
            "path": ".cause-native",
            "persist-credentials": false
          }
        },
        {
          "name": "Admit one original-source readback before custody access",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -m research_core_v4.laboratory.spot_source_cause_reception admit"
        },
        {
          "name": "Compile actual shared CSharp geometry and restore original ciphertext without key",
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock\ndotnet build research_core_v4/laboratory/csharp/spot_source/MxmSpotSource.csproj -c Release\npython3 -m unittest research_core_v4.laboratory.test_spot_source_causes research_core_v4.laboratory.test_spot_source_cause_reception -v\npython3 -m research_core_v4.laboratory.durable_spot_observation --out \"${RUNNER_TEMP}/mxm-source-causes/original\"\ncp research_core_v4/laboratory/spot_source_cause_reception.py research_core_v4/laboratory/spot_source_causes.py research_core_v4/laboratory/durable_spot_observation.py research_core_v4/laboratory/spot_observation_reception.py research_core_v4/laboratory/spot_observation_profile.py .cause-native/research_core_v4/laboratory/"
        },
        {
          "name": "Authenticate original source and export all receipt events only in native custody",
          "env": {
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          },
          "run": "umask 077\ncd .cause-native\npython3 -m research_core_v4.laboratory.spot_source_cause_reception export \"${RUNNER_TEMP}/mxm-source-causes/original/capture.mxmenc\" \"${RUNNER_TEMP}/mxm-source-causes/events.ndjson\""
        },
        {
          "name": "Classify actual source in CSharp and independently reconcile every original disposition",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "umask 077\ndotnet run --project research_core_v4/laboratory/csharp/spot_source/MxmSpotSource.csproj -c Release --no-build -- \"${RUNNER_TEMP}/mxm-source-causes/events.ndjson\" \"${RUNNER_TEMP}/mxm-source-causes/csharp.json\"\npython3 -m research_core_v4.laboratory.spot_source_cause_reception finalize \"${RUNNER_TEMP}/mxm-source-causes\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "spot-source-causes-${{ github.run_id }}",
            "path": "verification/spot-source-causes/receipt.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
