name: MXM once-only genuine H1 session-inventory DEVELOPMENT economics
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-session-inventory-economic-20261029.yml
      - research_core_v4/laboratory/session_open_inventory_20261029.py
      - research_core_v4/laboratory/SESSION_OPEN_INVENTORY_20261029_V1.json
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-session-inventory-economic-20261029.yml
permissions: {contents: read, actions: read}
concurrency:
  group: mxm-integrated-laboratory
  cancel-in-progress: false
jobs:
  outcome-blind-preflight:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Fixed source-free original-cost, causal synthetic and future-poison proof
        run: |
          set -eu
          python3 -m research_core_v4.laboratory.session_open_inventory_20261029 selftest
  genuine-h1-economics:
    needs: outcome-blind-preflight
    if: github.event_name == 'push' && github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify one original integration and no previous economic execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/git/ref/heads/mxm-remediation-p0-p4-20261015-v1 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/git/ref/heads/mxm-o04-accepted-owner-1807-v1 --jq .object.sha)" = "a830c132521bd4348454653f713e04f6107484fe"
          python3 - <<'PY'
          import json,os,subprocess
          base='repos/mariancradulescu/mxm-quant-greenfield/'
          def get(x):return json.loads(subprocess.check_output(['gh','api',base+x],text=True))
          current=int(os.environ['GITHUB_RUN_ID'])
          runs=get('actions/workflows/mxm-session-inventory-economic-20261029.yml/runs?per_page=100')
          assert runs['total_count']==len(runs['workflow_runs']) and runs['total_count']<=100,'UNBOUNDED_HISTORY'
          rs=runs['workflow_runs']
          push=[x for x in rs if x['event']=='push']
          assert len(push)==1 and push[0]['id']==current and push[0]['head_sha']==os.environ['GITHUB_SHA'] and push[0]['run_attempt']==1,'NOT_UNIQUE_FIRST_ECONOMIC_PUSH'
          commit=get('commits/'+os.environ['GITHUB_SHA'])
          assert len(commit['parents'])==2,'REQUIRE_MERGED_PREOUTCOME_REVIEW'
          pr_sha=commit['parents'][1]['sha']
          assert any(x['event']=='pull_request' and x['head_sha']==pr_sha and x['conclusion']=='success' for x in rs),'NO_SUCCESSFUL_PRE_ECONOMIC_PR'
          print('MXM_NEW_SESSION_ONE_SHOT_ECONOMIC_ADMISSION',current,pr_sha)
          PY
      - name: Install existing pinned research dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Authenticate original immutable Pepperstone H1 and execute ONE never-before-seen session inventory hypothesis
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.session_open_inventory_20261029 run
      - name: Independently decrypt and verify complete first-execution journal WITHOUT economics or H1 rerun
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.session_open_inventory_20261029 cold
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-session-inventory-first-original-${{ github.run_id }}
          path: |
            verification/session-inventory-20261029/receipt.json
            verification/session-inventory-20261029/private.mxmenc
            verification/session-inventory-20261029/cold.json
          if-no-files-found: error
          retention-days: 90
