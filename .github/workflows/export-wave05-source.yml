name: Export Wave05 Source
on:
  push:
    branches:
      - tmp-wave05-source-export-20260923

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ad483d7c874e86d30a5a99ce3447e5fae1f2c15
          fetch-depth: 1
      - name: Verify base source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8ad483d7c874e86d30a5a99ce3447e5fae1f2c15"
          test "$(sha256sum m7/competition_performance_v3_wave05_c029_c030_evaluator.py | awk '{print $1}')" = "cb465b5950b47edbc6d1b734d7b38b45904f84cb5affae17b3bba9a16d022c04"
          test "$(git hash-object m7/competition_performance_v3_wave05_c029_c030_evaluator.py)" = "d0917e74f89fbd36880f11a06f864b63558bf5b5"
          test "$(git hash-object research_v3/wave05_execute.py)" = "013a4b322e5f792ebb1ff2f8fb4fc00efd166c64"
          test "$(git hash-object discovery/candidates/V2-C029.json)" = "d8d4cb7349fa7c38aabf303c7bfc0f59934c6458"
          test "$(git hash-object discovery/candidates/V2-C030.json)" = "12a8a62dccca922a309d3def99d21453ff164c55"
          sha256sum m7/competition_performance_v3_wave05_c029_c030_evaluator.py
          git hash-object m7/competition_performance_v3_wave05_c029_c030_evaluator.py
          git hash-object research_v3/wave05_execute.py
          git hash-object discovery/candidates/V2-C029.json
          git hash-object discovery/candidates/V2-C030.json
      - name: Build byte-exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/m7 export/research_v3 export/discovery/candidates
          cp m7/competition_performance_v3_wave05_c029_c030_evaluator.py export/m7/
          cp research_v3/wave05_execute.py export/research_v3/
          cp research_v3/WAVE_05_PRE_OUTCOME_FREEZE_V1.json export/research_v3/
          cp research_v3/WAVE_05_EXECUTION_AUTHORIZATION_V1.json export/research_v3/
          cp discovery/candidates/V2-C029.json export/discovery/candidates/
          cp discovery/candidates/V2-C030.json export/discovery/candidates/
          printf '%s\n' "8ad483d7c874e86d30a5a99ce3447e5fae1f2c15" > export/AUTHORIZED_SOURCE_HEAD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MXM_WAVE05_AUTHORIZED_SOURCE
          path: export/
          if-no-files-found: error
