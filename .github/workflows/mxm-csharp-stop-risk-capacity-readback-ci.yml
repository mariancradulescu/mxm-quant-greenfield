name: MXM EUR200 original BIDASK risk-capacity public receipt CI
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - docs/economic-development/20261022/STOP_RISK_CAPACITY_BIDASK_READBACK_V1.json
      - .github/workflows/mxm-csharp-stop-risk-capacity-readback-ci.yml
      - research_core_v4/native_tick_replay_v1/csharp/verify_stop_risk_capacity_receipt.py
      - research_core_v4/native_tick_replay_v1/csharp/test_stop_risk_capacity_receipt.py
permissions: {contents: read}
jobs:
  exact-native-source-and-no-promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify exact six predeclared nonoutcome risk cells and no order claim
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_core_v4/native_tick_replay_v1/csharp')
          prior=json.loads((root/'STOP_RISK_CAPACITY_DIAGNOSTIC_V1.json').read_text())
          a=json.loads(Path('docs/economic-development/20261022/STOP_RISK_CAPACITY_BIDASK_READBACK_V1.json').read_text())
          assert a['schema']=='mxm.csharp.account-risk-capacity-original-pepperstone-readback.v1'
          assert a['execution_workflow_run']==39810418021
          assert a['experiment_source_run']==prior['exact_previous_source_run']==39660692230
          assert a['source_head_sha']=='1485d7e23aed709455b626a9ef72dace63c6010d'
          assert a['quote_cipher_sha256']=='f1d828d94b304e2af1f310701f92dcb31db935a8db7fc3f8772087adf5499346'
          assert a['encrypted_private_result_sha256']=='a1313519c3f58216586b989d97e1c0c7c688ca059d81a5771d6d6e24574afd8b'
          assert (a['original_bid_events'],a['original_ask_events'],a['original_quote_events'])==(14003,14209,28212)
          assert len(a['risk_cells'])==prior['fixed_matrix']['dependent_cells']==6
          assert {v['risk_fraction'] for v in a['risk_cells']}==set(prior['fixed_matrix']['max_estimated_stop_risk_fractions'])
          assert {v['roundtrip_cost_reserve_eur'] for v in a['risk_cells']}==set(prior['fixed_matrix']['estimated_roundtrip_friction_reserve_eur'])
          assert all(v['modeled_entries']==0 and v['hypothetical_final_equity_eur']==200 for v in a['risk_cells'] if v['risk_fraction']==0.005)
          assert all(v['modeled_entries']==7 and v['hypothetical_final_equity_eur']<200 for v in a['risk_cells'] if v['risk_fraction']==0.02)
          assert not a['hard21'] and a['live_orders']==a['broker_requests']==0
          assert not a['canonical_V2_trial_ledger_modified'] and not a['owner_checkpoint_modified']
          assert not a['bidask_are_broker_fills'] and not a['scenario_units_are_broker_certified']
          assert a['research_disposition']=='NO_PROMOTION_NO_EXECUTABLE_EDGE'
          print('MXM_EXPOSED_STOP_RISK_CAPACITY_DURABLE_READBACK_PASS')
          PY
      - name: Independently reject mutated risk-capacity receipts and fake HARD21/promotions
        run: |
          python3 research_core_v4/native_tick_replay_v1/csharp/verify_stop_risk_capacity_receipt.py
          python3 research_core_v4/native_tick_replay_v1/csharp/test_stop_risk_capacity_receipt.py -v
