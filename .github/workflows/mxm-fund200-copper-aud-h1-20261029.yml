name: MXM authentic copper to AUDUSD one EUR200 CSharp economic trial
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-fund200-copper-aud-h1-20261029.yml
      - research_core_v4/laboratory/funded_copper_aud_20261029.py
      - research_core_v4/laboratory/FUNDED_COPPER_AUD_LEAD_20261029_V1.json
      - research_core_v4/laboratory/csharp/funded_copper_aud/**
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-fund200-copper-aud-h1-20261029.yml
permissions: {contents: read, actions: read}
concurrency:
  group: mxm-integrated-laboratory
  cancel-in-progress: false
jobs:
  account-preflight:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Compile actual unmodified EUR200 CSharp account and validate artificial native minimum-ticket cases
        run: |
          set -eu
          dotnet build research_core_v4/laboratory/csharp/funded_copper_aud/MxmFundedCopperAud.csproj -c Release
          python3 -m research_core_v4.laboratory.funded_copper_aud_20261029 selftest
  first-authentic-economic-account:
    needs: account-preflight
    if: github.event_name == 'push' && github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Admit exactly one official post-review genuine EUR200 economic attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/git/ref/heads/mxm-remediation-p0-p4-20261015-v1 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/git/ref/heads/mxm-o04-accepted-owner-1807-v1 --jq .object.sha)" = "a830c132521bd4348454653f713e04f6107484fe"
          python3 - <<'PY'
          import json,os,subprocess
          repo='repos/mariancradulescu/mxm-quant-greenfield/'
          def g(s):return json.loads(subprocess.check_output(['gh','api',repo+s],text=True))
          v=g('actions/workflows/mxm-fund200-copper-aud-h1-20261029.yml/runs?per_page=100')
          assert v['total_count']==len(v['workflow_runs']) and v['total_count']<=100,'NO_UNBOUNDED_ATTEMPT_HISTORY'
          runs=v['workflow_runs'];live=[x for x in runs if x['event']=='push']
          current=int(os.environ['GITHUB_RUN_ID'])
          # Strict first-execution inventory: all previously observed push runs are pinned.
          parser_only={40915812883,40915861611,40916285477,40916462130,40916814748,
                       40916933626,40917206500,40918284020,40918445002}
          previous_preflight_only=40919534406
          expected_prior=parser_only|{previous_preflight_only}
          actual_prior={x['id'] for x in live if x['id']!=current}
          assert actual_prior==expected_prior,'UNKNOWN_OR_MISSING_PREVIOUS_PUSH'
          assert sum(x['id']==current and x['head_sha']==os.environ['GITHUB_SHA'] and x['run_attempt']==1 for x in live)==1,'NOT_UNIQUE_FIRST_AUTHENTIC_RUN'
          for x in live:
              if x['id']==current:continue
              result=g('actions/runs/'+str(x['id']))
              jobs=g('actions/runs/'+str(x['id'])+'/jobs')
              assert result['conclusion']=='failure' and result['run_attempt']==1,'EARLIER_EXECUTION_NOT_SAFE'
              if x['id'] in parser_only:
                  assert jobs['total_count']==0 and not jobs['jobs'],'PARSER_RUN_EXECUTED_JOB'
              else:
                  assert x['id']==previous_preflight_only and len(jobs['jobs'])==2 and jobs['total_count']==2,'UNEXPECTED_JOB_HISTORY'
                  by_name={j['name']:j for j in jobs['jobs']}
                  assert by_name['account-preflight']['conclusion']=='success','PREVIOUS_SYNTHETIC_GATE'
                  economic=by_name['first-authentic-economic-account']
                  steps={s['name']:s['conclusion'] for s in economic['steps']}
                  assert steps.get('Admit exactly one official post-review genuine EUR200 economic attempt')=='failure','NOT_PREMODEL_STOP'
                  assert steps.get('Authenticate original Pepperstone H1 and execute one EUR200 CSharp minimum-volume account')=='skipped','PREVIOUS_ECONOMIC_MODEL_ALREADY_RAN'
                  assert steps.get('Cold read original encrypted actual funded account result without economic replay')=='skipped','PREVIOUS_RESULT_ALREADY_RAN'
          print('EXACT_PRIOR_EXECUTION_INVENTORY_PRESERVED_NO_ECONOMIC_MODEL_YET')
          parents=g('commits/'+os.environ['GITHUB_SHA'])['parents']
          assert len(parents)==2,'REQUIRE_REVIEW_MERGE'
          # New workflow is not always registered for PR events before it reaches the official branch.
          # Verify the two EXISTING protected PR workflows on the exact reviewed head.
          prs=g('actions/runs?event=pull_request&per_page=100')
          assert prs['total_count']>=len(prs['workflow_runs']) and 0<len(prs['workflow_runs'])<=100,'PR_CI_PAGE'
          passed={x['name'] for x in prs['workflow_runs'] if x['event']=='pull_request' and x['head_sha']==parents[1]['sha'] and x['conclusion']=='success'}
          assert {'MXM R3 protected technical installation CI','MXM CSharp Pepperstone protected gateway CI'}.issubset(passed),'REQUIRE_TWO_ORIGINAL_PROTECTED_CI'
          print('MXM_ONE_ORIGINAL_FUNDED200_ATTEMPT_ADMITTED',os.environ['GITHUB_RUN_ID'])
          PY
      - name: Install only existing pinned dependencies and native CSharp account binary
        run: |
          set -eu
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          dotnet build research_core_v4/laboratory/csharp/funded_copper_aud/MxmFundedCopperAud.csproj -c Release
      - name: Authenticate original Pepperstone H1 and execute one EUR200 CSharp minimum-volume account
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.funded_copper_aud_20261029 run
      - name: Cold read original encrypted actual funded account result without economic replay
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.funded_copper_aud_20261029 cold
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-fund200-copper-aud-first-${{ github.run_id }}
          path: |
            verification/funded-copper-aud-20261029/receipt.json
            verification/funded-copper-aud-20261029/private.mxmenc
            verification/funded-copper-aud-20261029/cold.json
          if-no-files-found: error
          retention-days: 90
