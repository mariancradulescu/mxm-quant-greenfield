name: MXM preserved native quote reuse
run-name: MXM PRESERVED NATIVE QUOTE REUSE 8b6e24096192ca285f494520692a0b2a6f222afe
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [research_programs/reconciliation/EXECUTE_PRESERVED_NATIVE_QUOTE_REUSE.json]
permissions: {contents: read, actions: read}
concurrency:
  group: mxm-integrated-laboratory
  cancel-in-progress: false
jobs:
  reader:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref_name == 'mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 8b6e24096192ca285f494520692a0b2a6f222afe, persist-credentials: false}
      - run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Check exact identity and time-window reuse contracts
        run: python3 -m unittest research_core_v4.laboratory.test_native_quote_reuse.ReuseContract -v
      - name: Read pinned native raw checkpoints without economic-result assets or broker calls
        run: python3 -m research_core_v4.laboratory.native_quote_reuse worker
        env:
          GH_TOKEN: ${{ github.token }}
          PREGATE_SOURCE_SHA: 8b6e24096192ca285f494520692a0b2a6f222afe
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-preserved-native-quote-reuse-${{ github.run_id }}
          path: verification/native-quote-reuse/
          if-no-files-found: error
  durable-reuse:
    needs: reader
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 8b6e24096192ca285f494520692a0b2a6f222afe, persist-credentials: false}
      - run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mxm-preserved-native-quote-reuse-${{ github.run_id }}
          path: verification/reuse-input/
      - name: Append encrypted reuse evidence without changing checkpoint16
        run: python3 -m research_core_v4.laboratory.native_quote_reuse publish
        env:
          NATIVE_READER_RESULT: ${{ needs.reader.result }}
          GH_TOKEN: ${{ github.token }}
          PREGATE_SOURCE_SHA: 8b6e24096192ca285f494520692a0b2a6f222afe
