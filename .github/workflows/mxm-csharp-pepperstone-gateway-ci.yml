name: MXM CSharp Pepperstone protected gateway CI
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
permissions: {contents: read}
jobs:
  shared-catalogue-regression:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Checkout immutable authentic-native decoder and R7 integration source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d2fae5641b759b1c8c24161d83d62d39e104eafd
          path: .sealed-chronology-source
          persist-credentials: false
      - name: Bind immutable decoder and run its existing regression suite
        run: |
          test "$(git -C .sealed-chronology-source rev-parse HEAD)" = d2fae5641b759b1c8c24161d83d62d39e104eafd
          python3 -m pip install --only-binary=:all: --require-hashes -r .sealed-chronology-source/research_core_v4/remediation_p0_p4_20261015/requirements.lock
          (cd .sealed-chronology-source && python3 - <<'PY'
          import pathlib,unittest
          names=sorted(str(p.with_suffix('')).replace('/','.') for p in pathlib.Path('research_core_v4/laboratory').glob('test_*.py'))
          names+=['tests.test_continuous_account_replay_v2']
          r=unittest.TextTestRunner(verbosity=1).run(unittest.defaultTestLoader.loadTestsFromNames(names))
          raise SystemExit(not r.wasSuccessful())
          PY
          )
      - name: Validate bounded full ISO week VIEW extension over the original immutable decoder
        run: |
          cp research_core_v4/laboratory/week_chronology_reception.py .sealed-chronology-source/research_core_v4/laboratory/
          cp research_core_v4/laboratory/test_week_chronology_reception.py .sealed-chronology-source/research_core_v4/laboratory/
          (cd .sealed-chronology-source && python3 -m unittest research_core_v4.laboratory.test_chronology_reception research_core_v4.laboratory.test_week_chronology_reception -v)
          cp research_core_v4/laboratory/test_week35_chronology_profile.py .sealed-chronology-source/research_core_v4/laboratory/
          (cd .sealed-chronology-source && python3 -m unittest research_core_v4.laboratory.test_week35_chronology_profile -v)
          cp research_core_v4/laboratory/test_gbpusd_week37_chronology_profile.py .sealed-chronology-source/research_core_v4/laboratory/
          (cd .sealed-chronology-source && python3 -m unittest research_core_v4.laboratory.test_gbpusd_week37_chronology_profile -v)
      - name: Validate both ACTUAL cold bridge installation closures without any custody key
        run: |
          python3 -m unittest research_core_v4.laboratory.test_cold_bridge_consumer_closure -v
          python3 -m research_core_v4.laboratory.cold_bridge_consumer_closure .sealed-chronology-source
      - name: Offline original encrypted archive restoration and corruption/provenance negatives
        run: |
          python3 -m unittest research_core_v4.laboratory.test_durable_native_chronology research_core_v4.laboratory.test_durable_week_chronology research_core_v4.laboratory.test_durable_week35_chronology -v
          python3 -m unittest research_core_v4.laboratory.test_durable_gbpusd_week37_chronology -v
          python3 -m research_core_v4.laboratory.durable_gbpusd_week37_chronology --out verification/durable-gbpusd-week37
          python3 -m research_core_v4.laboratory.durable_week_chronology --out verification/week-chronology
          python3 -m research_core_v4.laboratory.durable_native_chronology --out verification/r3-chronology
      - name: Test full-week source identity and negative custody-access invariants, no key
        run: |
          cp research_core_v4/laboratory/week_chronology_reception.py .sealed-chronology-source/research_core_v4/laboratory/
          cp research_core_v4/laboratory/week_chronology_csharp_bridge.py .sealed-chronology-source/research_core_v4/laboratory/
          cp research_core_v4/laboratory/captured_symbol_terms.py .sealed-chronology-source/research_core_v4/laboratory/
          cp research_core_v4/laboratory/test_week_chronology_csharp_bridge.py .sealed-chronology-source/research_core_v4/laboratory/
          (cd .sealed-chronology-source && python3 -m unittest research_core_v4.laboratory.test_week_chronology_csharp_bridge -v)
          cp research_core_v4/laboratory/week35_chronology_csharp_bridge.py .sealed-chronology-source/research_core_v4/laboratory/
          cp research_core_v4/laboratory/test_week35_chronology_csharp_bridge.py .sealed-chronology-source/research_core_v4/laboratory/
          (cd .sealed-chronology-source && LAB_CHRONOLOGY_PROFILE=W35 python3 -m unittest research_core_v4.laboratory.test_week35_chronology_csharp_bridge -v)
          python3 -m unittest research_core_v4.laboratory.test_terminal_open_stop_completeness -v
          python3 -m unittest research_core_v4.laboratory.test_week35_breakout_development research_core_v4.laboratory.test_week35_remaining_families_development research_core_v4.laboratory.test_week35_online_ar1_development -v
          python3 -m research_core_v4.laboratory.verify_week35_breakout_result
          python3 -m research_core_v4.laboratory.verify_week35_remaining_result
          python3 -m research_core_v4.laboratory.verify_week35_online_ar1_result
          python3 -m unittest research_core_v4.laboratory.test_continuous_account_recovery -v
          python3 -m research_core_v4.laboratory.verify_continuous_account_recovery
      - name: Verify unchanged-week gross/commission/mark attribution under no-key accounting fixtures
        run: python3 -m unittest research_core_v4.laboratory.test_csharp_week_account_attribution research_core_v4.laboratory.test_csharp_week_source_routing -v
      - name: Decode actual protobuf symbol shapes; missing defaults, cents and precise fee units
        run: python3 -m unittest research_core_v4.laboratory.test_captured_symbol_terms -v
      - name: Compile and reconcile unqualified UTC seasonality against independent artificial-hour arrays
        run: |
          dotnet run --project research_core_v4/laboratory/csharp/seasonality/MxmSeasonalityDevelopment.csproj -c Release -- --selftest
          python3 -m unittest research_core_v4.laboratory.test_seasonality_development -v
          python3 -m research_core_v4.laboratory.verify_seasonality_result
      - name: Compile one delayed-target path-state learner and independently verify all artificial target/forecast ledgers
        run: |
          dotnet run --project research_core_v4/laboratory/csharp/pathstate/MxmPathStateDevelopment.csproj -c Release -- --selftest
          python3 -m unittest research_core_v4.laboratory.test_pathstate_development research_core_v4.laboratory.test_pathstate_result -v
          python3 -m research_core_v4.laboratory.verify_pathstate_result
      - name: Verify preserved native vendor metadata and reject false operational promotion without running the CLI
        run: |
          python3 -m unittest research_core_v4.laboratory.test_native_cli_evidence research_core_v4.laboratory.test_ctrader_cli_metadata -v
          python3 -m research_core_v4.laboratory.verify_native_cli_metadata
          python3 -m unittest research_core_v4.laboratory.test_confirmed_entry_ledger_evidence -v
          python3 -m research_core_v4.laboratory.verify_confirmed_entry_ledger_result
          python3 -m unittest research_core_v4.laboratory.test_correlated_entry_recovery_evidence -v
          python3 -m research_core_v4.laboratory.verify_correlated_entry_recovery
      - name: Compile shared CSharp strategy, simulator and actual cTrader .algo
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmCompressionDevelopment.csproj -c Release -- --selftest
          python3 -m unittest research_core_v4.laboratory.test_compression_development -v
          python3 -m research_core_v4.laboratory.verify_compression_result
          dotnet build research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release
          dotnet build research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioAccountReplayFixture.csproj -c Release
          dotnet build research_core_v4/native_tick_replay_v1/csharp/MxmReferenceBot.csproj -c Release
          test -s research_core_v4/native_tick_replay_v1/csharp/bin/Release/net6.0/native_tick_replay_v1.algo
      - name: Real machine-side account paths on two known artificial regimes; provenance never promoted
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --fixture unused verification/csharp-reference
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --model-fixture unused verification/csharp-modeled-fixture
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --zero-spread-fixture unused verification/csharp-locked-quote
          python3 - <<'PY'
          import json
          from decimal import Decimal as D
          z=json.load(open('verification/csharp-locked-quote/reference-report.json'))
          assert z['classification']=='SYNTHETIC_MATHEMATICAL_ONLY'
          assert z['zero_spread_accepted_snapshots']>0 and z['crossed_snapshots']==0 and z['invalid_quote_snapshots']==0
          assert z['economic_entries']==z['economic_exits']>=1 and z['initial_equity_eur']==200
          a=json.load(open('verification/csharp-reference/reference-report.json'))
          b=json.load(open('verification/csharp-modeled-fixture/reference-report.json'))
          assert a['classification']=='SYNTHETIC_MATHEMATICAL_ONLY'
          assert b['classification']=='ARTIFICIAL_SCENARIO_COST_FX_TEST_ONLY'
          assert a['economic_entries']==a['economic_exits']==b['economic_entries']==b['economic_exits']==7
          for x in (a,b):
              assert x['initial_equity_eur']==200 and not x['authenticated_market_corpus'] and not x['cTrader_native_backtest']
              assert not x['pepperstone_historical_fills_proven'] and not x['economic_identity_opened']
              gross=sum(D(str(z['gross_price_pnl_eur'])) for z in x['ledger'] if z['kind']=='EXIT')
              net=D('200')+gross-D('0.2')*x['economic_entries']
              assert abs(net-D(str(x['final_equity_eur'])))<D('.00001')
              assert not x['hard21'] and x['entries_per_iso_week']=={'2025-W02':7}
          assert a['final_equity_eur']==201.27 and b['final_equity_eur']==200.90
          print('MXM_CSHARP_EXEC_GATE_PASS_REAL_BINARY_SYNTHETIC_QUOTES_ONLY')
          PY
      - name: Reconcile EVERY trade, equity mark and execution friction without charging slippage twice
        run: |
          python3 - <<'PY'
          import json
          from decimal import Decimal as D
          for file in ('verification/csharp-reference/reference-report.json','verification/csharp-modeled-fixture/reference-report.json'):
              r=json.load(open(file))
              params=r['modeled_assumptions']
              fx=D(str(params['fx_eur_per_usd']))
              slip=D(str(params['slippage_price_units']))
              extra=D(str(params['extra_spread_price_units']))/2
              fee=D(str(params['commission_eur_per_side']))
              cash=D('200')
              ledger=r['ledger']
              for z in ledger:
                  p=lambda k:D(str(z[k]))
                  assert abs(p('slippage_eur')-D('1000')*slip*fx)<D('.000002'),(file,z)
                  assert abs(p('additional_spread_scenario_eur')-D('1000')*extra*fx)<D('.000002')
                  assert abs(p('charged_commission_eur')-fee)<D('.000002')
                  if z['kind']=='ENTRY':
                      expect=p('quoted_ask')+slip+extra if z['direction']==1 else p('quoted_bid')-slip-extra
                      cash-=fee
                  else:
                      expect=p('quoted_bid')-slip-extra if z['direction']==1 else p('quoted_ask')+slip+extra
                      cash+=p('gross_price_pnl_eur')-fee
                  assert abs(p('price')-expect)<D('.000002')
                  assert abs(p('balance_eur')-cash)<D('.000025')
              assert abs(D(str(r['final_equity_eur']))-cash)<D('.000025')
              costsum=sum(D(str(z['charged_commission_eur']))+D(str(z['slippage_eur']))+
                          D(str(z['additional_spread_scenario_eur'])) for z in ledger)
              assert abs(costsum-D(str(r['charged_cost_eur'])))<D('.000035')
              for mark in r['equity']:
                  balance=D(str(mark['balance_eur']))
                  pos=mark['position_direction']
                  mtm=balance if pos==0 else balance+D(pos)*D('1000')*(
                      D(str(mark['marked_bid' if pos==1 else 'marked_ask']))-
                      D(str(mark['position_open_price'])))*D(str(mark['quote_conversion_eur_per_usd']))
                  assert abs(D(str(mark['equity_eur']))-mtm)<D('.000025')
              assert r['full_iso_weeks_evaluated']==0 and r['hard21'] is False
              print('MXM_RECONCILED_ACCOUNT_AND_CASH',file,len(ledger),len(r['equity']))
          PY
      - name: Run four shared CSharp regime families across three bar granularities and three hypothetical cost scenarios
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --research-fixture unused verification/csharp-research-fixture
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from decimal import Decimal
          m=json.load(open('verification/csharp-research-fixture/research.json'))
          assert m['classification']=='ARTIFICIAL_QUOTES_COST_MATRIX_ONLY'
          assert m['model_count']==216 and m['full_iso_weeks']==0 and m['no_independent_trial_or_advantage']
          assert len({z['family'] for z in m['models']})==4
          assert {z['timeframe_minutes'] for z in m['models']}=={1,5,15}
          assert {z['modeled_stop_loss_pips'] for z in m['models']}=={0,12}
          g=defaultdict(dict)
          for z in m['models']:
              assert z['initial_equity_eur']==200 and z['entries']==z['exits'] and not z['hard21']
              assert abs(Decimal(str(z['net_pnl_eur']))-
                         (Decimal(str(z['final_equity_eur']))-Decimal(200)))<Decimal('.000002')
              # At the initial EUR200 equity, unaffordable assumed margins
              # must never create fictitious fills. Later equity is lower after loss.
              if z['margin_eur']>200*z['max_margin_fraction_of_free_margin']:
                  assert z['entries']==z['exits']==0 and z['final_equity_eur']==200
              assert z['margin_headroom_rejections']>=0
              g[(z['family'],z['timeframe_minutes'],z['modeled_stop_loss_pips'],z['max_margin_fraction_of_free_margin'])][z['cost_case']]=(Decimal(str(z['net_pnl_eur'])),z['entries'])
          assert len(g)==72 and all({'LOW_UNVERIFIED','BASE_UNVERIFIED','STRESS_UNVERIFIED'}==set(v) for v in g.values())
          # Cost monotonicity is meaningful only for identical executed trade
          # counts. A refused order has no P&L and is not a profitable strategy.
          assert all(v['LOW_UNVERIFIED'][0]>=v['BASE_UNVERIFIED'][0]>=v['STRESS_UNVERIFIED'][0]
                     for v in g.values() if len({x[1] for x in v.values()})==1)
          assert {z['max_margin_fraction_of_free_margin'] for z in m['models']}=={0.4,0.6,0.8}
          assert any(z['margin_headroom_rejections']>0 for z in m['models'] if z['margin_eur']>200*z['max_margin_fraction_of_free_margin'])
          assert any(z['entries']>0 for z in m['models'] if z['margin_eur']==90 and z['max_margin_fraction_of_free_margin']==0.6)
          assert any(z['entries']>0 for z in m['models'] if z['margin_eur']==150 and z['max_margin_fraction_of_free_margin']==0.8)
          print('MXM_CSHARP_RESEARCH_MATRIX_ARTIFICIAL_ONLY',
                json.dumps({'models':m['model_count'],'families':4,'timeframes':[1,5,15],'cost_cases':3,'stop_modes':[0,12],'margin_fractions':[0.4,0.6,0.8]}))
          PY
      - name: Check cTrader and offline cold-start equivalence at strategy boundary
        run: |
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('research_core_v4/native_tick_replay_v1/csharp/MxmReferenceProductBot.cs').read_text()
          assert 'protected override void OnBar()' in p
          assert 'series.ClosePrices.Last(0)' in p
          assert 'series.ClosePrices[i]' not in p
          assert 'StopLossPips' in p and 'MaxMarginFraction' in p and 'MxmDecisionKernel(mode)' in p
          assert 'orderProtection.Reconcile(placed.IsSuccessful,placed.Position?.Id,' in p
          assert 'if(protection.Halt)' in p and 'LatchProtectionHalt();' in p
          assert 'orderProtection.HaltUnknown();' in p
          q=pathlib.Path('research_core_v4/native_tick_replay_v1/csharp/EconomicReference.cs').read_text()
          assert 'STOP_QUOTE_MODEL' in q and 'MODELED' not in p
          assert 'modeled_stop_loss_pips' in q and 'slippage_eur=Round(PriceUnits*Slippage*Fx)' in q
          assert 'MxmCapitalAdmission.Check(realized,realized,margin,commission,' in q and 'margin_headroom_rejections' in q
          assert 'MxmCapitalAdmission.Check' in p and 'Positions.FindAll(Label).Length' in p
          print('MXM_CSHARP_COLD_START_AND_STOP_SCENARIO_STRUCTURAL_PARITY')
          PY
      - name: Verify gateway never carries secrets in pull request jobs
        run: |
          python3 - <<'PY'
          import pathlib
          w=pathlib.Path('.github/workflows/mxm-csharp-authentic-cold.yml').read_text()
          assert 'environment: mxm-r3-custody-v1' in w
          assert "refs/heads/mxm-remediation-p0-p4-20261015-v1" in w
          assert 'push:' in w and 'pull_request:' not in w and 'pull_request_target:' not in w
          assert 'd2fae5641b759b1c8c24161d83d62d39e104eafd' in w
          assert 'secrets.R3_CUSTODY_PRIVATE_KEY_PEM' in w
          print('GATEWAY_PROTECTED_EXEC_ONLY_NO_PR_KEY')
          PY
