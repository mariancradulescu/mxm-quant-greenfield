{
  "name": "MXM W35 complete ISO week VIEW chronology acquisition",
  "on": {
    "push": {
      "branches": [
        "mxm-remediation-p0-p4-20261015-v1"
      ],
      "paths": [
        ".github/workflows/mxm-week35-chronology-reception.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {},
  "concurrency": {
    "group": "mxm-integrated-laboratory",
    "cancel-in-progress": false
  },
  "jobs": {
    "chronology-collect": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "environment": "mxm-r3-pepperstone-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "d2fae5641b759b1c8c24161d83d62d39e104eafd",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "b54ee59548846ad8013b25965dbe4bcb19d4a978",
            "path": ".week-code",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock"
        },
        {
          "run": "cp .week-code/research_core_v4/laboratory/week_chronology_reception.py research_core_v4/laboratory/week_chronology_reception.py"
        },
        {
          "run": "python3 -m research_core_v4.laboratory.week_chronology_reception chronology-collect",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "LAB_CHRONOLOGY_SOURCE": "b54ee59548846ad8013b25965dbe4bcb19d4a978",
            "R3_CTRADER_CLIENT_ID": "${{ secrets.R3_CTRADER_CLIENT_ID }}",
            "R3_CTRADER_CLIENT_SECRET": "${{ secrets.R3_CTRADER_CLIENT_SECRET }}",
            "R3_CTRADER_ACCESS_TOKEN": "${{ secrets.R3_CTRADER_ACCESS_TOKEN }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "week-chronology-${{ github.run_id }}",
            "path": "verification/week35-chronology/capture.mxmenc\nverification/week35-chronology/producer.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ],
      "env": {
        "LAB_CHRONOLOGY_PROFILE": "W35"
      },
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1"
    },
    "chronology-cold": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "environment": "mxm-r3-custody-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "d2fae5641b759b1c8c24161d83d62d39e104eafd",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "b54ee59548846ad8013b25965dbe4bcb19d4a978",
            "path": ".week-code",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock"
        },
        {
          "run": "cp .week-code/research_core_v4/laboratory/week_chronology_reception.py research_core_v4/laboratory/week_chronology_reception.py"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "week-chronology-${{ github.run_id }}",
            "path": "verification/week35-chronology"
          }
        },
        {
          "run": "python3 -m research_core_v4.laboratory.week_chronology_reception chronology-cold",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "LAB_CHRONOLOGY_SOURCE": "b54ee59548846ad8013b25965dbe4bcb19d4a978",
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "week-chronology-cold-${{ github.run_id }}",
            "path": "verification/week35-chronology/cold.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ],
      "env": {
        "LAB_CHRONOLOGY_PROFILE": "W35"
      },
      "needs": "chronology-collect",
      "if": "always()"
    }
  }
}

