{
  "name": "MXM R3 conserved checkpoint20 private readback",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {},
  "env": {
    "CHECKPOINT_SOURCE_SHA": "2fc953234d88d3ab0a1b4607cac2cd3d41d65273"
  },
  "concurrency": {
    "group": "mxm-r3-checkpoint20-readback",
    "cancel-in-progress": false
  },
  "jobs": {
    "checkpoint20-readback": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "environment": "mxm-r3-custody-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "2fc953234d88d3ab0a1b4607cac2cd3d41d65273",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock"
        },
        {
          "name": "Conserved checkpoint20: produce",
          "run": "python3 -m research_core_v4.laboratory.checkpoint20_readback produce",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "R3_CUSTODY_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "mxm-r3-checkpoint20-produce-${{ github.run_id }}",
            "path": "verification/checkpoint20-readback",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    },
    "independent-cold-readback": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "environment": "mxm-r3-custody-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "2fc953234d88d3ab0a1b4607cac2cd3d41d65273",
            "persist-credentials": false
          }
        },
        {
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "mxm-r3-checkpoint20-produce-${{ github.run_id }}",
            "path": "verification/checkpoint20-readback"
          }
        },
        {
          "name": "Conserved checkpoint20: cold",
          "run": "python3 -m research_core_v4.laboratory.checkpoint20_readback cold",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "R3_CUSTODY_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "mxm-r3-checkpoint20-cold-${{ github.run_id }}",
            "path": "verification/checkpoint20-readback",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ],
      "needs": [
        "checkpoint20-readback"
      ]
    }
  }
}
