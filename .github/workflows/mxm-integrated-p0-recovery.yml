name: MXM integrated P0 ordinary recovery
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_run:
    workflows: [MXM integrated P0 technical recovery]
    types: [completed]
  workflow_dispatch:
permissions: {}
concurrency:
  group: mxm-integrated-laboratory
  cancel-in-progress: false
jobs:
  ordinary-recovery:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions: {contents: write, actions: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 541bfe0e7d1eea060aa38d9e1e46a6639b7db13b, persist-credentials: false}
      - run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Recover only proven pre-exposure failure or continue a saved admitted successor
        run: python3 -m research_core_v4.laboratory.integrated observer
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_SOURCE_SHA: 541bfe0e7d1eea060aa38d9e1e46a6639b7db13b
          LAB_INTEGRATED_PROTOCOL: v2
