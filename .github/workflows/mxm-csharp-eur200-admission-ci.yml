name: MXM CSharp shared EUR200 admission no-secret CI
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/native_tick_replay_v1/csharp/**
      - research_core_v4/laboratory/csharp_native_portfolio_independent_mark.py
      - research_core_v4/laboratory/captured_cost_scenario_checks.py
      - .github/workflows/mxm-csharp-eur200-admission-ci.yml
permissions: {contents: read}
jobs:
  exact-common-capital-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Compile CSharp simulator and original real cTrader product with shared admission
        run: |
          dotnet build research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release
          dotnet build research_core_v4/native_tick_replay_v1/csharp/MxmReferenceBot.csproj -c Release
          test -s research_core_v4/native_tick_replay_v1/csharp/bin/Release/net8.0/native_tick_replay_v1.algo
      - name: Read actual net8 algo metadata in pinned vendor cTrader CLI without credentials or networking
        run: |
          python3 -m unittest research_core_v4.laboratory.test_ctrader_cli_metadata -v
          curl --fail --silent --show-error --location --connect-timeout 20 --max-time 150 --max-filesize 120000000 https://getctrader.spotware.com/cli/homebrew/ctrader-cli-5.9.0-linux-x64.tar.gz --output "${RUNNER_TEMP}/mxm-ctrader-cli.tar.gz"
          python3 -m research_core_v4.laboratory.install_pinned_ctrader_cli "${RUNNER_TEMP}/mxm-ctrader-cli.tar.gz" "${RUNNER_TEMP}/mxm-pinned-cli"
          python3 -m research_core_v4.laboratory.ctrader_cli_metadata "${RUNNER_TEMP}/mxm-pinned-cli/ctrader-cli" research_core_v4/native_tick_replay_v1/csharp/bin/Release/net8.0/native_tick_replay_v1.algo verification/ctrader-cli-metadata
      - name: Retain actual product package and original offline native CLI metadata proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ctrader-cli-offline-metadata-${{ github.run_id }}
          path: |
            verification/ctrader-cli-metadata
            research_core_v4/native_tick_replay_v1/csharp/bin/Release/net8.0/native_tick_replay_v1.algo
            research_core_v4/native_tick_replay_v1/csharp/bin/Release/net8.0/MxmReferenceBot.dll
          if-no-files-found: error
          retention-days: 90
      - name: Kill prepared and submitted entry workers; cold-process recovery must never replay unknown requests
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmEntryCheckpointFixture.csproj -c Release
          python3 - <<'PYGUARD'
          import json
          from pathlib import Path
          bot=Path('research_core_v4/native_tick_replay_v1/csharp/MxmReferenceProductBot.cs').read_text()
          start=bot[bot.index('protected override void OnStart'):bot.index('protected override void OnBar')]
          assert start.index('entryCheckpoint.Initialize()')<start.index('series.BarClosed+=')
          assert 'Application.EnvironmentType!=cAlgo.API.EnvironmentType.Desktop' in start
          apply=bot[bot.index('void ApplyPortfolioDecision'):bot.index('string? ReadEntryCheckpoint')]
          assert apply.index('entryCheckpoint.Prepare(')<apply.index('MxmAccountIsolation.Check(')<apply.index('MxmCapitalAdmission.Check(')
          assert apply.index('entryCheckpoint.MarkSubmitted()')<apply.index('brokerAttempted=true')<apply.index('ExecuteMarketOrder(')
          assert apply.index('orderProtection.Reconcile(')<apply.index('else if(!protection.Accepted)')<apply.index('entryCheckpoint.CompleteReconciled()')
          assert 'finalClock>=currentOpenTime.AddMinutes(BarMinutes)' in apply
          assert '!brokerAttempted && !orderProtection.Halted' in apply
          assert 'LocalStorage.Flush(LocalStorageScope.Type)' in bot and 'LocalStorage.Reload(LocalStorageScope.Type)' in bot
          assert 'protected override void OnException(Exception exception)' in bot
          assert 'entryStorageFault=true;entryCheckpoint?.Halt();orderProtection.HaltUnknown();' in bot
          assert 'entryCheckpoint?.Halt(); // Never clear' in bot
          proof=json.loads(Path('verification/entry-checkpoint/proof.json').read_text())
          assert proof['hard_kills']==4 and proof['new_os_processes']==8 and proof['checks']>=40
          assert all(x['resubmissions']==0 for x in proof['cases'])
          assert not proof['native_ctrader_execution'] and not proof['native_storage_durability_proven']
          assert proof['broker_orders']==proof['new_scientific_trials']==0
          print('MXM_NATIVE_ADAPTER_CHECKPOINT_BEFORE_BROKER_AND_FAULT_WIRING_PASS_NATIVE_STORAGE_RECEPTION_OPEN')
          PYGUARD
      - name: Retain artificial process-recovery proof without market data or secrets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: entry-checkpoint-artificial-${{ github.run_id }}
          path: verification/entry-checkpoint/proof.json
          if-no-files-found: error
          retention-days: 90
      - name: Validate one serial multi-symbol CSharp portfolio on two artificial streams
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioFixture.csproj -c Release
          python3 - <<'PY'
          from pathlib import Path
          src=Path('research_core_v4/native_tick_replay_v1/csharp/MxmReferenceProductBot.cs').read_text()
          assert 'PortfolioSymbols.Split' in src and 'new MxmPortfolioSequencer(resolved)' in src
          assert 'series.BarClosed+=OnPortfolioBarClosed' in src
          assert 'protected override void OnBar() { }' in src
          assert 'series.ClosePrices.Last(0)' in src
          assert 'instrument.Tick+=OnPortfolioTick' in src
          assert 'instrument.Tick-=OnPortfolioTick' in src
          assert 'ApplyPortfolioDecision(args.Symbol,args.SymbolName' in src
          bars=src[src.index('void OnPortfolioBarClosed'):src.index('void OnPortfolioTick')]
          ticks=src[src.index('void OnPortfolioTick'):src.index('void ApplyPortfolioDecision')]
          assert 'ApplyPortfolioDecision(' not in bars and '.Publish(' in bars
          assert 'kernel.Reset();causalIntents[instrumentName].Clear()' in bars
          assert ticks.index('queue.TryConsume(')<ticks.index('ApplyPortfolioDecision(')
          assert 'new MxmCausalIntent()' in src
          assert 'Positions.FindAll(Label)' in src
          assert 'foreach(var accountPosition in Positions)' in src
          assert 'foreach(var brokerPendingOrder in PendingOrders)' in src
          assert 'MxmAccountIsolation.Check(' in src
          assert src.index('MxmAccountIsolation.Check(')<src.index('ExecuteMarketOrder(')
          gate=(Path('research_core_v4/native_tick_replay_v1/csharp')/'MxmAccountIsolation.cs').read_text()
          assert 'REJECT_FOREIGN_ACCOUNT_POSITION' in gate
          assert 'REJECT_ACCOUNT_PENDING_ORDER' in gate
          assert 'EnableDemoTrading && !Account.IsLive' in src
          assert 'Portfolio Symbols (comma separated)",DefaultValue=""' in src
          print('MXM_ONE_BOT_MULTISYMBOL_ACCOUNT_GATE_SYNTHETIC_NO_CLOUD_LOCK_CLAIM_PASS')
          PY
      - name: Reproduce old broker-stop intent defect and exercise reconciled product fence without broker orders
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmBrokerIntentFenceFixture.csproj -c Release
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('research_core_v4/native_tick_replay_v1/csharp')
          bot=(p/'MxmReferenceProductBot.cs').read_text()
          assert 'Positions.Closed+=OnBrokerPositionClosed' in bot
          assert 'Positions.Closed-=OnBrokerPositionClosed' in bot
          closed=bot[bot.index('void OnBrokerPositionClosed'):bot.index('protected override void OnStop')]
          assert closed.index('args.Position.Label!=Label')<closed.index('fence.Closed(')
          assert 'brokerIntentFences.TryGetValue(args.Position.SymbolName' in closed
          assert 'args.Reason==PositionCloseReason.Closed' in closed
          ticks=bot[bot.index('void OnPortfolioTick'):bot.index('void ApplyPortfolioDecision')]
          assert ticks.index('fence.Observe(')<ticks.index('fence.Capture()')<ticks.index('queue.TryConsume(')
          apply=bot[bot.index('void ApplyPortfolioDecision'):]
          assert apply.count('fence.IsCurrent(')==2
          assert apply.index('fence.BeginReversal(')<apply.index('var result=ClosePosition(current)')<apply.index('fence.FinishReversal(')
          assert apply.rindex('fence.IsCurrent(')<apply.index('ExecuteMarketOrder(')
          assert 'result.Position?.Id' in apply and 'lease=continuation!' in apply
          bars=bot[bot.index('void OnPortfolioBarClosed'):bot.index('void OnPortfolioTick')]
          assert bars.index('fence.Observe(')<bars.index('.Publish(')<bars.index('fence.CanPublish(')
          r=json.loads(Path('verification/broker-intent-fence/synthetic-contract.json').read_text())
          assert r['checks']>=40 and r['interleavings']>=3
          assert r['old_product_counterexample_reproduced']
          assert r['postfill_protection_contract_passed']
          assert r['postfill_identity_stop_halt_defensive_retry_tested']
          assert 'orderProtection.Reconcile(placed.IsSuccessful,placed.Position?.Id,' in bot
          assert 'Timer.Start(TimeSpan.FromSeconds(5))' in bot
          assert 'orderProtection.DefensiveCloseId(ProtectionBook())' in bot
          assert 'MXM_RECOVERED_POSITION_PROTECTION_SAFE_STOP_' in bot
          for callback in (bars,ticks):
              assert callback.index('if(orderProtection.Halted)return;')<callback.index('try {')
          assert not r['native_ctrader_callbacks_observed'] and not r['hard21']
          assert r['broker_orders']==r['scientific_trials']==0
          print('MXM_REAL_PRODUCT_BROKER_CLOSE_WIRING_AND_LEASE_ADMISSION_CHECK_PASS_NATIVE_RECEIPT_STILL_REQUIRED')
          PY
      - name: Replay two instruments through one CSharp EUR200 BIDASK marked account with independent Decimal verification
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioAccountReplayFixture.csproj -c Release
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal as D
          import json
          p=Path('verification/csharp-multisymbol-single-account/artificial-replay.json')
          s=json.loads(p.read_text(),parse_float=D)
          assert s['classification']=='ARTIFICIAL_OR_UNCERTIFIED_QUOTES_SINGLE_ACCOUNT_CAUSAL_DEVELOPMENT_ONLY'
          assert s['initial_capital_eur']==200 and s['final_cash_eur']==D('199.8')
          ledger=s['ledger']
          assert len(ledger)==2 and all(z['kind']=='ENTRY' for z in ledger)
          assert len({z['symbol'] for z in ledger})==2
          # Independent Python ledger: one continuous cash account, never a
          # fresh EUR200 account per symbol. Both commissions are applied once.
          cash=D(200)-sum((z['commission_eur'] for z in ledger),D(0))
          assert cash==s['final_cash_eur']
          longs={x['symbol']:x for x in ledger if x['direction']==1}
          shorts={x['symbol']:x for x in ledger if x['direction']==-1}
          assert set(longs)=={'EURUSD'} and set(shorts)=={'GBPUSD'}
          # Last TWO independent synthetic quotes at i=7:
          liquidation=(D('1.1013')-longs['EURUSD']['price'])*longs['EURUSD']['units']
          liquidation+=(shorts['GBPUSD']['price']-D('1.1987'))*shorts['GBPUSD']['units']
          eq=cash+liquidation
          used=D(70)*2
          assert eq==s['marked_equity_eur']==D('200.2')
          assert used==s['used_margin_eur']==140
          assert eq-used==s['free_margin_eur']==D('60.2')
          assert s['entries_by_iso_week']=={'2026-W35':2}
          assert s['complete_iso_utc_weeks']==0
          assert not s['hard21_proven'] and not s['broker_fills_proven'] and not s['costs_broker_verified']
          assert s['accepted_entries']==2 and s['open_positions']==2
          print('MXM_TWO_SYMBOL_ONE_EUR200_CSHARP_PYTHON_INDEPENDENT_MTM_PARITY_SYNTHETIC_PASS_NO_HARD21')
          stop=json.loads(Path('verification/csharp-multisymbol-single-account/lifecycle-replay.json').read_text(),parse_float=D)
          cash=D(200);book={}
          for row in stop['ledger']:
              symbol=row['symbol'];fee=row['commission_eur']
              if row['kind']=='ENTRY':
                  assert symbol not in book
                  book[symbol]=row;cash-=fee
              else:
                  entry=book.pop(symbol)
                  expected=D('1.09798') if entry['direction']==1 else D('1.20222')
                  assert row['price']==expected and row['reason']=='OBSERVED_QUOTE_STOP'
                  gross=(expected-entry['price'])*entry['units']*entry['direction']
                  assert row['gross_eur']==gross
                  cash+=gross-fee
              assert row['cash_eur']==cash
          assert not book and cash==D('193.12')==stop['final_cash_eur']==stop['marked_equity_eur']
          assert stop['used_margin_eur']==0 and stop['free_margin_eur']==cash
          assert stop['accepted_entries']==stop['executed_exits']==2
          assert not stop['broker_fills_proven'] and not stop['hard21_proven']
          print('MXM_INDEPENDENT_DECIMAL_TWO_SIDED_GAP_STOP_CASH_AND_RELEASED_MARGIN_PASS')
          PY
      - name: Replay bounded artificial BIDASK native-envelope shape through same CSharp EUR200 engine
        run: |
          python3 - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          from json import dumps
          start=int(datetime(2026,8,24,12,tzinfo=timezone.utc).timestamp()*1000)
          p=Path('verification/mxm-artificial-native-quotes.ndjson')
          p.parent.mkdir(parents=True,exist_ok=True)
          with p.open('w') as output:
              for i in range(10):
                  bid=110000+i*20
                  for offset in (0,1000):
                      for side,raw in (('bid',bid),('ask',bid+10)):
                          output.write(dumps({'t':start+i*300000+(i%3)*113+offset,'side':side,'raw':raw})+'\n')
          PY
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release -- --artificial-fixture verification/mxm-artificial-native-quotes.ndjson verification/mxm-portfolio-native-fixture
          python3 - <<'PY'
          import json
          from pathlib import Path
          from decimal import Decimal as D
          p=Path('verification/mxm-portfolio-native-fixture/portfolio-exposed-quote-readback.json')
          r=json.loads(p.read_text(),parse_float=D)
          assert r['classification']=='ARTIFICIAL_QUOTE_STREAM_ONLY'
          assert r['original_native_run_id']==0 and r['synthetic_quote_events_injected']==40
          assert r['quote_events']==40 and r['grouped_atomic_usable_snapshots']==20
          assert r['completed_bar_decision_events']==9 and r['actual_symbols']==1
          assert not r['historical_broker_fills_proven'] and not r['hard21_proven']
          a=r['account'];assert a['initial_capital_eur']==200
          assert a['accepted_entries']>=1 and a['complete_iso_utc_weeks']==0
          assert a['open_positions']==1 and a['executed_exits']==0
          entries=[z for z in a['ledger'] if z['kind']=='ENTRY']
          assert len(entries)==a['accepted_entries']==1
          entry=entries[0]
          cash=D(200)-sum(z['commission_eur'] for z in entries)
          assert cash==a['final_cash_eur']
          last_bid=D('1.1018');last_ask=D('1.1019')
          assert entry['direction'] in (-1,1)
          mtm=cash+(last_bid-entry['price'] if entry['direction']==1
                    else entry['price']-last_ask)*entry['units']/D('1.10')
          print('INDEPENDENT_MTM_COMPARE',{'direction':entry['direction'],
            'entry':str(entry['price']),'equity_python':str(mtm),
            'equity_csharp':str(a['marked_equity_eur']),
            'difference':str(mtm-a['marked_equity_eur'])})
          assert abs(mtm-a['marked_equity_eur'])<D('0.000001')
          assert a['used_margin_eur']==50
          assert abs(a['free_margin_eur']-(a['marked_equity_eur']-D(50)))<D('0.000001')
          assert not a['hard21_proven'] and not a['broker_fills_proven']
          print('MXM_ARTIFICIAL_NATIVE_QUOTE_SHAPE_CAUSAL_CSHARP_INDEPENDENT_MTM_PASS')
          PY
          python3 -m research_core_v4.laboratory.csharp_native_portfolio_independent_mark verification/mxm-artificial-native-quotes.ndjson verification/mxm-portfolio-native-fixture/portfolio-exposed-quote-readback.json --out verification/mxm-portfolio-native-fixture/independent-mark.json
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal as D
          import json
          from research_core_v4.laboratory.csharp_native_portfolio_independent_mark import independent_terminal_mark,MarkParityError
          tick=Path('verification/mxm-artificial-native-quotes.ndjson')
          original=json.loads(Path('verification/mxm-portfolio-native-fixture/portfolio-exposed-quote-readback.json').read_text(),parse_float=D)
          receipt=json.loads(Path('verification/mxm-portfolio-native-fixture/independent-mark.json').read_text())
          assert receipt['ledger_entry_count']==1 and receipt['ledger_exit_count']==0
          assert receipt['open_positions']==1 and receipt['full_iso_weeks_verified']==0 and not receipt['hard21']
          assert D(receipt['cash_abs_difference_eur'])<=D('0.000001')
          assert D(receipt['equity_abs_difference_eur'])<=D('0.000001')
          original['account']['marked_equity_eur']+=D(1)
          try:independent_terminal_mark(tick,original)
          except MarkParityError as e:assert 'TERMINAL_LIQUIDATION_MTM' in str(e)
          else:raise AssertionError('tampered marked equity accepted')
          original['account']['marked_equity_eur']-=D(1)
          original['account']['ledger'][0]['price']+=D('0.001')
          try:independent_terminal_mark(tick,original)
          except MarkParityError as e:assert 'WRONG_SIDE_OF_SPREAD_ENTRY' in str(e)
          else:raise AssertionError('tampered executable-side fill accepted')
          print('MXM_PYTHON_INDEPENDENT_NATIVE_PORTFOLIO_TERMINAL_MTM_NEGATIVES_PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('verification/mxm-artificial-native-quotes.ndjson')
          rows=p.read_text().splitlines()
          raw=json.loads(rows[0]);raw['side']='future'
          rows[0]=json.dumps(raw)
          Path('verification/mxm-invalid-native-quotes.ndjson').write_text('\n'.join(rows)+'\n')
          PY
          if dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release --no-build -- --artificial-fixture verification/mxm-invalid-native-quotes.ndjson verification/mxm-portfolio-invalid; then
            echo 'Invalid native quote stream accepted'; exit 1
          fi
      - name: Execute actual CSharp captured-component and quote-side FX scenario on artificial native shape
        run: |
          python3 -m research_core_v4.laboratory.captured_cost_scenario_checks prepare verification/captured-cost-fixture
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release --no-build -- --artificial-captured-terms-fixture verification/captured-cost-fixture/quotes.ndjson verification/captured-cost-fixture/out verification/captured-cost-fixture/terms.json
          python3 -m research_core_v4.laboratory.captured_cost_scenario_checks verify verification/captured-cost-fixture
      - name: Execute account-global cap, dynamic equity, reserve and margin fraction negatives
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --capital-fixture
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --fixture unused verification/csharp-capital-parity
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_core_v4/native_tick_replay_v1/csharp')
          bot=(p/'MxmReferenceProductBot.cs').read_text()
          sim=(p/'EconomicReference.cs').read_text()
          policy=(p/'MxmCapitalAdmission.cs').read_text()
          assert 'Positions.FindAll(Label).Length' in bot
          assert 'MxmCapitalAdmission.Check' in bot and 'MxmCapitalAdmission.Check' in sim
          assert 'MaxMxmAccountPositions' in bot and 'MinimumFreeMarginReserveEur' in bot
          assert 'EnableDemoTrading && !Account.IsLive' in bot
          assert 'REJECT_ACCOUNT_POSITION_CAP' in policy
          assert 'REJECT_FREE_MARGIN_RESERVE' in policy
          assert 'REJECT_MARGIN_FRACTION' in policy
          assert 'actual_cbot_has_nonatomic_account_snapshot=true' in sim
          v=json.loads(Path('verification/csharp-capital-parity/reference-report.json').read_text())
          assert v['economic_entries']==v['economic_exits']==7
          assert v['final_equity_eur']==201.27
          assert v['modeled_assumptions']['minimum_free_margin_reserve_eur']==0
          assert v['modeled_assumptions']['max_model_owned_positions']==1
          assert v['capital_reserve_rejections']>=0
          assert not v['pepperstone_historical_fills_proven'] and not v['economic_identity_opened']
          print('MXM_SHARED_EUR200_ACCOUNT_GATE_REFERENCE_AND_DEMO_PRODUCT_PASS')
          PY
