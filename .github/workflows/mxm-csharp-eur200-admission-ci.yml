name: MXM CSharp shared EUR200 admission no-secret CI
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/native_tick_replay_v1/csharp/**
      - .github/workflows/mxm-csharp-eur200-admission-ci.yml
permissions: {contents: read}
jobs:
  exact-common-capital-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Compile CSharp simulator and original real cTrader product with shared admission
        run: |
          dotnet build research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release
          dotnet build research_core_v4/native_tick_replay_v1/csharp/MxmReferenceBot.csproj -c Release
          test -s research_core_v4/native_tick_replay_v1/csharp/bin/Release/net6.0/native_tick_replay_v1.algo
      - name: Validate one serial multi-symbol CSharp portfolio on two artificial streams
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioFixture.csproj -c Release
          python3 - <<'PY'
          from pathlib import Path
          src=Path('research_core_v4/native_tick_replay_v1/csharp/MxmReferenceProductBot.cs').read_text()
          assert 'PortfolioSymbols.Split' in src and 'new MxmPortfolioSequencer(resolved)' in src
          assert 'series.BarClosed+=OnPortfolioBarClosed' in src
          assert 'protected override void OnBar() { }' in src
          assert 'series.ClosePrices.Last(0)' in src
          assert 'ApplyPortfolioDecision(instrument,instrumentName' in src
          assert 'Positions.FindAll(Label)' in src
          assert 'foreach(var accountPosition in Positions)' in src
          assert 'foreach(var brokerPendingOrder in PendingOrders)' in src
          assert 'MxmAccountIsolation.Check(' in src
          assert src.index('MxmAccountIsolation.Check(')<src.index('ExecuteMarketOrder(')
          gate=(Path('research_core_v4/native_tick_replay_v1/csharp')/'MxmAccountIsolation.cs').read_text()
          assert 'REJECT_FOREIGN_ACCOUNT_POSITION' in gate
          assert 'REJECT_ACCOUNT_PENDING_ORDER' in gate
          assert 'EnableDemoTrading && !Account.IsLive' in src
          assert 'Portfolio Symbols (comma separated)",DefaultValue=""' in src
          print('MXM_ONE_BOT_MULTISYMBOL_ACCOUNT_GATE_SYNTHETIC_NO_CLOUD_LOCK_CLAIM_PASS')
          PY
      - name: Replay two instruments through one CSharp EUR200 BIDASK marked account with independent Decimal verification
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioAccountReplayFixture.csproj -c Release
          python3 - <<'PY'
          from pathlib import Path
          from decimal import Decimal as D
          import json
          p=Path('verification/csharp-multisymbol-single-account/artificial-replay.json')
          s=json.loads(p.read_text(),parse_float=D)
          assert s['classification']=='ARTIFICIAL_OR_UNCERTIFIED_QUOTES_SINGLE_ACCOUNT_CAUSAL_DEVELOPMENT_ONLY'
          assert s['initial_capital_eur']==200 and s['final_cash_eur']==D('199.8')
          ledger=s['ledger']
          assert len(ledger)==2 and all(z['kind']=='ENTRY' for z in ledger)
          assert len({z['symbol'] for z in ledger})==2
          # Independent Python ledger: one continuous cash account, never a
          # fresh EUR200 account per symbol. Both commissions are applied once.
          cash=D(200)-sum((z['commission_eur'] for z in ledger),D(0))
          assert cash==s['final_cash_eur']
          longs={x['symbol']:x for x in ledger if x['direction']==1}
          shorts={x['symbol']:x for x in ledger if x['direction']==-1}
          assert set(longs)=={'EURUSD'} and set(shorts)=={'GBPUSD'}
          # Last TWO independent synthetic quotes at i=7:
          liquidation=(D('1.1013')-longs['EURUSD']['price'])*longs['EURUSD']['units']
          liquidation+=(shorts['GBPUSD']['price']-D('1.1987'))*shorts['GBPUSD']['units']
          eq=cash+liquidation
          used=D(70)*2
          assert eq==s['marked_equity_eur']==D('200.2')
          assert used==s['used_margin_eur']==140
          assert eq-used==s['free_margin_eur']==D('60.2')
          assert s['entries_by_iso_week']=={'2026-W35':2}
          assert s['complete_iso_utc_weeks']==0
          assert not s['hard21_proven'] and not s['broker_fills_proven'] and not s['costs_broker_verified']
          assert s['accepted_entries']==2 and s['open_positions']==2
          print('MXM_TWO_SYMBOL_ONE_EUR200_CSHARP_PYTHON_INDEPENDENT_MTM_PARITY_SYNTHETIC_PASS_NO_HARD21')
          PY
      - name: Replay bounded artificial BIDASK native-envelope shape through same CSharp EUR200 engine
        run: |
          python3 - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          from json import dumps
          start=int(datetime(2026,8,24,12,tzinfo=timezone.utc).timestamp()*1000)
          p=Path('verification/mxm-artificial-native-quotes.ndjson')
          p.parent.mkdir(parents=True,exist_ok=True)
          with p.open('w') as output:
              for i in range(10):
                  bid=110000+i*20
                  for offset in (0,1000):
                      for side,raw in (('bid',bid),('ask',bid+10)):
                          output.write(dumps({'t':start+i*300000+offset,'side':side,'raw':raw})+'\n')
          PY
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release -- --artificial-fixture verification/mxm-artificial-native-quotes.ndjson verification/mxm-portfolio-native-fixture
          python3 - <<'PY'
          import json
          from pathlib import Path
          from decimal import Decimal as D
          p=Path('verification/mxm-portfolio-native-fixture/portfolio-exposed-quote-readback.json')
          r=json.loads(p.read_text(),parse_float=D)
          assert r['classification']=='ARTIFICIAL_QUOTE_STREAM_ONLY'
          assert r['original_native_run_id']==0 and r['synthetic_quote_events_injected']==40
          assert r['quote_events']==40 and r['grouped_atomic_usable_snapshots']==20
          assert r['completed_bar_decision_events']==9 and r['actual_symbols']==1
          assert not r['historical_broker_fills_proven'] and not r['hard21_proven']
          a=r['account'];assert a['initial_capital_eur']==200
          assert a['accepted_entries']>=1 and a['complete_iso_utc_weeks']==0
          assert a['open_positions']==1 and a['executed_exits']==0
          entries=[z for z in a['ledger'] if z['kind']=='ENTRY']
          assert len(entries)==a['accepted_entries']==1
          entry=entries[0]
          cash=D(200)-sum(z['commission_eur'] for z in entries)
          assert cash==a['final_cash_eur']
          last_bid=D('1.1018')
          mtm=cash+(last_bid-entry['price'])*entry['units']/D('1.10')
          assert abs(mtm-a['marked_equity_eur'])<D('0.000001')
          assert a['used_margin_eur']==50 and a['free_margin_eur']==a['marked_equity_eur']-50
          assert not a['hard21_proven'] and not a['broker_fills_proven']
          print('MXM_ARTIFICIAL_NATIVE_QUOTE_SHAPE_CAUSAL_CSHARP_INDEPENDENT_MTM_PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('verification/mxm-artificial-native-quotes.ndjson')
          rows=p.read_text().splitlines()
          raw=json.loads(rows[0]);raw['side']='future'
          rows[0]=json.dumps(raw)
          Path('verification/mxm-invalid-native-quotes.ndjson').write_text('\n'.join(rows)+'\n')
          PY
          if dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release --no-build -- --artificial-fixture verification/mxm-invalid-native-quotes.ndjson verification/mxm-portfolio-invalid; then
            echo 'Invalid native quote stream accepted'; exit 1
          fi
      - name: Execute account-global cap, dynamic equity, reserve and margin fraction negatives
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --capital-fixture
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --fixture unused verification/csharp-capital-parity
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_core_v4/native_tick_replay_v1/csharp')
          bot=(p/'MxmReferenceProductBot.cs').read_text()
          sim=(p/'EconomicReference.cs').read_text()
          policy=(p/'MxmCapitalAdmission.cs').read_text()
          assert 'Positions.FindAll(Label).Length' in bot
          assert 'MxmCapitalAdmission.Check' in bot and 'MxmCapitalAdmission.Check' in sim
          assert 'MaxMxmAccountPositions' in bot and 'MinimumFreeMarginReserveEur' in bot
          assert 'EnableDemoTrading && !Account.IsLive' in bot
          assert 'REJECT_ACCOUNT_POSITION_CAP' in policy
          assert 'REJECT_FREE_MARGIN_RESERVE' in policy
          assert 'REJECT_MARGIN_FRACTION' in policy
          assert 'actual_cbot_has_nonatomic_account_snapshot=true' in sim
          v=json.loads(Path('verification/csharp-capital-parity/reference-report.json').read_text())
          assert v['economic_entries']==v['economic_exits']==7
          assert v['final_equity_eur']==201.27
          assert v['modeled_assumptions']['minimum_free_margin_reserve_eur']==0
          assert v['modeled_assumptions']['max_model_owned_positions']==1
          assert v['capital_reserve_rejections']>=0
          assert not v['pepperstone_historical_fills_proven'] and not v['economic_identity_opened']
          print('MXM_SHARED_EUR200_ACCOUNT_GATE_REFERENCE_AND_DEMO_PRODUCT_PASS')
          PY
