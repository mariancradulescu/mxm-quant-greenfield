name: MXM B-E annual authenticated JPY factor original M5 EUR200 native CSharp
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/laboratory/mxm_be_jpy_consensus_annual_funded_20261101.py
      - research_core_v4/laboratory/MXM_BE_JPY_CONSENSUS_ANNUAL_FUNDED_20261101.json
      - .github/workflows/mxm-be-jpy-consensus-annual-20261101.yml
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [.github/workflows/mxm-be-jpy-consensus-annual-20261101.yml]
permissions: {contents: read, actions: read}
concurrency: {group: mxm-be-jpy-annual-frozen-first-20261101, cancel-in-progress: false}
jobs:
  source-blind-causal-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing pinned dependencies; frozen source-blind causal checks
        run: |
          set -eu
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          python3 -m research_core_v4.laboratory.mxm_be_jpy_consensus_annual_funded_20261101 selftest
          python3 - <<'PY'
          import json,pathlib
          from research_core_v4.laboratory.mxm_be_jpy_consensus_annual_funded_20261101 import read_spec
          x=read_spec()
          assert x['orders']==0 and x['cloud'] is False and x['source']['new_broker_requests']==0
          assert x['risk']['initial_eur']==200 and x['target']['instruments']==['AUDJPY']
          assert x['cost_scenario']['history_spreads_observed'] is False
          print('MXM_JPY_FROZEN_EXISTING_CSHARP_PROGRAMME_PINS_SOURCE_BLIND_PASS')
          PY
      - name: Compile original shared native CSharp capital and receipt tests
        run: |
          set -eu
          dotnet build research_core_v4/laboratory/csharp/portfolio_policy/MxmPortfolioPolicy.csproj -c Release
          dotnet build research_core_v4/laboratory/csharp/shared_account/MxmSharedAccount.csproj -c Release
          python3 -m unittest research_core_v4.laboratory.test_portfolio_programme -v
  one-original-annual-csharp-funded:
    needs: source-blind-causal-geometry
    if: github.event_name == 'push' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Compile exactly existing native EUR200 account with old regression
        run: |
          set -eu
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          dotnet build research_core_v4/laboratory/csharp/shared_account/MxmSharedAccount.csproj -c Release
      - name: One reviewed FIRST-ONLY original attempt guard before private source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m research_core_v4.laboratory.mxm_be_jpy_consensus_annual_funded_20261101 admit
      - name: Authentic annual Pepperstone tape, frozen causal JPY decisions, and CSharp EUR200
        id: research
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.mxm_be_jpy_consensus_annual_funded_20261101 run
      - name: Cold read private original, three fixed cash scenarios and independent ledger
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.mxm_be_jpy_consensus_annual_funded_20261101 cold
      - name: Custody original result and public aggregate, no raw price publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-be-jpy-annual-first-${{ github.run_id }}
          path: verification/mxm-be-jpy-consensus-annual-20261101/
          if-no-files-found: warn
          retention-days: 90
