name: Strict Preoutcome V2 Selection Functional and Structural Discriminator Offline Validation
on:
  push:
    branches: [performance-research-v3-20260922]
    paths:
      - research_core_v4/state/STRICT_PREOUTCOME_V2_*V1.json
      - research_core_v4/strict_selection_functional_v1.py
      - research_core_v4/strict_selection_functional_preflight_v1.py
      - research_core_v4/master1576_current_state_guard_v4.py
      - tests/test_strict_selection_functional_v1.py
      - .github/workflows/strict-selection-functional-offline.yml
permissions:
  contents: read
jobs:
  selection-functional-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head partial order admissibility firewall and minimal discriminator checks
        run: python -m research_core_v4.strict_selection_functional_preflight_v1
