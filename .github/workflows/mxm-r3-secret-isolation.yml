{
  "name": "MXM R3 finite credential isolation; no economic execution",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {},
  "concurrency": {
    "group": "mxm-r3-secret-isolation",
    "cancel-in-progress": false
  },
  "env": {
    "ISOLATION_SOURCE_SHA": "e5add220235b14678a96972c2a7afb237d31a972"
  },
  "jobs": {
    "isolation-copy": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 8,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "e5add220235b14678a96972c2a7afb237d31a972",
            "persist-credentials": false
          }
        },
        {
          "name": "Finite native secret isolation: copy",
          "run": "python3 -m research_core_v4.laboratory.secret_isolation copy",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "SUCCESSOR_APP_PRIVATE_KEY": "${{ secrets.SUCCESSOR_APP_PRIVATE_KEY }}",
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}",
            "CTRADER_CLIENT_ID": "${{ secrets.CTRADER_CLIENT_ID }}",
            "CTRADER_CLIENT_SECRET": "${{ secrets.CTRADER_CLIENT_SECRET }}",
            "CTRADER_ACCESS_TOKEN": "${{ secrets.CTRADER_ACCESS_TOKEN }}",
            "CTRADER_REFRESH_TOKEN": "${{ secrets.CTRADER_REFRESH_TOKEN }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "mxm-r3-isolation-copy-${{ github.run_id }}",
            "path": "isolation-copy.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ],
      "environment": "mxm-p0-successor-issuer-v1"
    },
    "verify-custody": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 8,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "e5add220235b14678a96972c2a7afb237d31a972",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "mxm-r3-isolation-copy-${{ github.run_id }}",
            "path": "receipts"
          }
        },
        {
          "name": "Finite native secret isolation: custody",
          "run": "python3 -m research_core_v4.laboratory.secret_isolation custody",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "R3_CUSTODY_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "mxm-r3-isolation-custody-${{ github.run_id }}",
            "path": "isolation-custody.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ],
      "environment": "mxm-r3-custody-v1",
      "needs": [
        "isolation-copy"
      ]
    },
    "verify-pepperstone": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 8,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "e5add220235b14678a96972c2a7afb237d31a972",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "mxm-r3-isolation-copy-${{ github.run_id }}",
            "path": "receipts"
          }
        },
        {
          "name": "Finite native secret isolation: pepperstone",
          "run": "python3 -m research_core_v4.laboratory.secret_isolation pepperstone",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "R3_CTRADER_CLIENT_ID": "${{ secrets.R3_CTRADER_CLIENT_ID }}",
            "R3_CTRADER_CLIENT_SECRET": "${{ secrets.R3_CTRADER_CLIENT_SECRET }}",
            "R3_CTRADER_ACCESS_TOKEN": "${{ secrets.R3_CTRADER_ACCESS_TOKEN }}",
            "R3_CTRADER_REFRESH_TOKEN": "${{ secrets.R3_CTRADER_REFRESH_TOKEN }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "mxm-r3-isolation-pepperstone-${{ github.run_id }}",
            "path": "isolation-pepperstone.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ],
      "environment": "mxm-r3-pepperstone-v1",
      "needs": [
        "isolation-copy"
      ]
    },
    "isolation-cleanup": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 8,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "e5add220235b14678a96972c2a7afb237d31a972",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "mxm-r3-isolation-copy-${{ github.run_id }}",
            "path": "receipts"
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "mxm-r3-isolation-custody-${{ github.run_id }}",
            "path": "receipts"
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "mxm-r3-isolation-pepperstone-${{ github.run_id }}",
            "path": "receipts"
          }
        },
        {
          "name": "Finite native secret isolation: cleanup",
          "run": "python3 -m research_core_v4.laboratory.secret_isolation cleanup",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "SUCCESSOR_APP_PRIVATE_KEY": "${{ secrets.SUCCESSOR_APP_PRIVATE_KEY }}"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "mxm-r3-isolation-cleanup-${{ github.run_id }}",
            "path": "isolation-cleanup.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ],
      "environment": "mxm-p0-successor-issuer-v1",
      "needs": [
        "isolation-copy",
        "verify-custody",
        "verify-pepperstone"
      ]
    }
  }
}
