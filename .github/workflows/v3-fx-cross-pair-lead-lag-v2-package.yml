name: V3 FX cross-pair lead-lag V2 historical diagnostic package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-research-v3-20260922
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Android-safe protobuf
        run: |
          python -m pip install --only-binary=:all: --no-deps -r tools/requirements-m6-capture.txt
      - name: Compile V2 collector
        run: |
          python -m py_compile V3_FX_CROSS_PAIR_QUOTE_LEAD_LAG_PILOT_RUN.py research_core_v3/fx_cross_pair_quote_lead_lag_capture.py research_core_v3/pydroid_fx_cross_pair_quote_lead_lag_launcher.py tools/build_fx_cross_pair_quote_lead_lag_v2_package.py
      - name: Verify frozen authorities
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python -c "from pathlib import Path; from research_core_v3.fx_cross_pair_quote_lead_lag_capture import offline_preflight; g=offline_preflight(Path('.')); assert g['primary_tests']==72 and g['relationships']==6 and g['symbols']==4 and g['base_side_requests_before_pagination']==624 and g['diagnostic_horizon_seconds']==900; print('LEAD_LAG_V2_PREFLIGHT_PASS',g)"
      - name: Build deterministic package without mutating canonical state
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/build_fx_cross_pair_quote_lead_lag_v2_package.py
          sha256sum dist/MXM_V3_FX_CROSS_PAIR_QUOTE_LEAD_LAG_PILOT_PACKAGE_V2_DIAGNOSTIC.zip
      - name: Assert historical canonical authority was not rewritten
        run: |
          git diff --exit-code -- research_core_v3/state/FX_CROSS_PAIR_QUOTE_LEAD_LAG_PACKAGE_AUTHORITY_V2.json
      - name: Upload historical validation package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_V3_FX_CROSS_PAIR_QUOTE_LEAD_LAG_PILOT_PACKAGE_V2_DIAGNOSTIC
          path: dist/MXM_V3_FX_CROSS_PAIR_QUOTE_LEAD_LAG_PILOT_PACKAGE_V2_DIAGNOSTIC.zip
          if-no-files-found: error
          retention-days: 30
