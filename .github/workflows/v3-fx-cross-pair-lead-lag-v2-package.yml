name: V3 FX cross-pair lead-lag V2 diagnostic package
on:
  push:
    branches: [performance-research-v3-20260922]
    paths:
      - '.github/workflows/v3-fx-cross-pair-lead-lag-v2-package.yml'
      - 'V3_FX_CROSS_PAIR_QUOTE_LEAD_LAG_PILOT_RUN.py'
      - 'research_core_v3/fx_cross_pair_quote_lead_lag_capture.py'
      - 'research_core_v3/pydroid_fx_cross_pair_quote_lead_lag_launcher.py'
      - 'research_core_v3/state/FX_CROSS_PAIR_QUOTE_LEAD_LAG_ACQUISITION_PLAN_V2.json'
      - 'research_core_v3/state/FX_CROSS_PAIR_QUOTE_LEAD_LAG_PATH_OBSERVABILITY_FREEZE_V1.json'
      - 'research_core_v3/state/FX_CROSS_PAIR_QUOTE_LEAD_LAG_DEVELOPMENT_DESIGN_V1.json'
      - 'research_core_v3/state/FX_CROSS_PAIR_QUOTE_LEAD_LAG_PREOUTCOME_AUDIT_V1.json'
      - 'tools/build_fx_cross_pair_quote_lead_lag_v2_package.py'
      - 'README_FX_CROSS_PAIR_QUOTE_LEAD_LAG_V2.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-research-v3-20260922
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Android-safe protobuf
        run: python -m pip install --only-binary=:all: --no-deps -r tools/requirements-m6-capture.txt
      - name: Compile V2 collector
        run: |
          python -m py_compile V3_FX_CROSS_PAIR_QUOTE_LEAD_LAG_PILOT_RUN.py research_core_v3/fx_cross_pair_quote_lead_lag_capture.py research_core_v3/pydroid_fx_cross_pair_quote_lead_lag_launcher.py tools/build_fx_cross_pair_quote_lead_lag_v2_package.py
      - name: Verify frozen primary science and diagnostic bindings
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from pathlib import Path
          from research_core_v3.fx_cross_pair_quote_lead_lag_capture import offline_preflight
          g=offline_preflight(Path("."))
          assert g["primary_tests"] == 72, g
          assert g["relationships"] == 6, g
          assert g["symbols"] == 4, g
          assert g["base_side_requests_before_pagination"] == 624, g
          assert g["diagnostic_horizon_seconds"] == 900, g
          print("LEAD_LAG_V2_PREFLIGHT_PASS", g)
          PY
      - name: Build deterministic authoritative package
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/build_fx_cross_pair_quote_lead_lag_v2_package.py
          sha256sum dist/MXM_V3_FX_CROSS_PAIR_QUOTE_LEAD_LAG_PILOT_PACKAGE_V2_DIAGNOSTIC.zip
      - name: Persist V2 package authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_core_v3/state/FX_CROSS_PAIR_QUOTE_LEAD_LAG_PACKAGE_AUTHORITY_V2.json
          if git diff --cached --quiet; then
            echo "Authority already current"
          else
            git commit -m "Authorize diagnostic-observable FX lead-lag V2 package [skip ci]"
            git push origin HEAD:performance-research-v3-20260922
          fi
      - name: Upload authoritative V2 package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_V3_FX_CROSS_PAIR_QUOTE_LEAD_LAG_PILOT_PACKAGE_V2_DIAGNOSTIC
          path: dist/MXM_V3_FX_CROSS_PAIR_QUOTE_LEAD_LAG_PILOT_PACKAGE_V2_DIAGNOSTIC.zip
          if-no-files-found: error
          retention-days: 30
