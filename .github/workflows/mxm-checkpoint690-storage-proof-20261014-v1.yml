name: MXM checkpoint 690 storage failure forensic recovery
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [.github/workflows/mxm-checkpoint690-storage-proof-20261014-v1.yml]
permissions:
  contents: write
concurrency:
  group: mxm-repaired-native-frontier-single-writer-20261014-v2
  cancel-in-progress: false
jobs:
  storage_proof:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Recover OWNER state and classify storage limits without broker requests
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python3 - <<'PY'
          import os,json,pathlib,tempfile,gzip,urllib.request,urllib.error,datetime
          from research_core_v4.full_native_frontier_20261014_v1 import runner_v1 as v1
          from research_core_v4.critical_frontier_repair_20261014_v2 import storage_v2 as storage,archive_v2 as ar
          from research_core_v4.critical_frontier_repair_20261014_v2.preserve_stop_v2 import api
          E=v1.E;need=v1.need
          def quota():
           req=urllib.request.Request('https://api.github.com/rate_limit',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
           with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)['resources']['core']
          head=os.environ['GITHUB_SHA'];need(os.environ['GITHUB_RUN_ATTEMPT']=='1','NO_RERUN')
          need(os.environ['GITHUB_WORKFLOW_REF']==E.w.old.REPO+'/.github/workflows/mxm-checkpoint690-storage-proof-20261014-v1.yml@refs/heads/'+E.w.old.BRANCH,'WORKFLOW_SCOPE')
          E.a.ancestor('fbf765703c35919ad820a722c1cd15d6d48a03bb',head)
          for authpath in (v1.P+'EXECUTION_V1.json','research_core_v4/critical_frontier_repair_20261014_v2/REPAIR_AUTHORITY_V2.json'):
           for path,sha in json.loads((E.a.ROOT/authpath).read_text())['bindings'].items():need(E.w.old.filehash(path)==sha,'FROZEN_SOURCE')
          need(api('actions/runs/38580426196')['status']=='completed','PREVIOUS_NOT_TERMINAL')
          initial_quota=quota();print(json.dumps({'phase':'STORAGE_QUOTA_BEFORE','core':initial_quota,'broker_requests':0}),flush=True)
          with tempfile.TemporaryDirectory(prefix='mxm690-storage-',dir=os.environ['RUNNER_TEMP']) as td:
           tmp=pathlib.Path(td);key,fp=E.w.old._private_key_from_secret(tmp);need(fp==E.w.old.FP,'OWNER_KEY')
           store=storage.RotatingStore(head,key,E.a.ROOT/E.w.old.PUBLIC_KEY,tmp);anchor=json.loads(store.anchor['body'])
           need(anchor['generation']==690 and anchor['identities_evaluated']==61,'ANCHOR_CHANGED')
           need(anchor['current_journal']['ciphertext_sha256']=='5d1d6c9eb124ac39dc115e5d79b820fcbc377d7a04d5ad0ab4f33c13e741e6fe','ANCHOR_CIPHER')
           db=ar.dbopen(tmp/'verify.sqlite');storage.track(db);state=storage.restore(db,store)
           orphan=api('releases/assets/640721363');need(orphan['digest']=='sha256:9841af588da4aa721f6acb36a6a8433b62b3d60cd4f0a73de5b8096bc16fe6c4','ORPHAN_HASH')
           blob=E.w.old.download(orphan['browser_download_url'],orphan['size']);need(E.a.sha(blob)==orphan['digest'].split(':')[1],'ORPHAN_READBACK')
           packed=E.w.old.crypto.decrypt_package(blob,private_key=key,expected_public_spki_sha256=fp,temp_parent=tmp);raw=gzip.decompress(packed);uncommitted=E.w.old.crypto.strict_json(raw);need(v1.encode(uncommitted)==raw,'ORPHAN_CANONICAL')
           print(json.dumps({'phase':'VERIFIED_OWNER_RECOVERY','generation':690,'uncommitted_generation':uncommitted['generation'],'pending_uncommitted':len(uncommitted.get('pending_requests',[])),'requests_anchor':state['requests'],'requests_uncommitted':uncommitted['requests'],'core_after_restore':quota(),'broker_requests':0}),flush=True)
           # Preserve a private, hash-bound orphan locator and request fence. Never
           # expose private raw state or automatically treat its pending windows as complete.
           proof={'schema':'mxm.checkpoint690.storage.forensic.v1','source_head':head,'run_id':int(os.environ['GITHUB_RUN_ID']),'anchor':anchor,'generation':690,'identity_cursor':state['identity_cursor'],'bars':db.execute('SELECT count(*) FROM bar').fetchone()[0],'ticks':db.execute('SELECT count(*) FROM tick').fetchone()[0],'coverage_states':ar.proof_table(db),'orphan_manifest':{'asset_id':orphan['id'],'ciphertext_sha256':E.a.sha(blob),'gzip_sha256':E.a.sha(packed),'canonical_sha256':E.a.sha(raw),'generation':uncommitted['generation'],'requests':uncommitted['requests'],'pending_requests':uncommitted.get('pending_requests',[]),'errors':uncommitted['errors'][-3:]},'initial_core_quota':initial_quota,'current_core_quota':quota(),'physical_historical_upload_cause':'NOT_RECORDED_BY_OLD_GENERIC_ERROR;DO_NOT_INVENT_HTTP_STATUS','broker_requests':0,'pilot_executed':False,'HARD21':False,'alpha_certified':False}
           out=v1.FrontierStore(head,key,E.a.ROOT/E.w.old.PUBLIC_KEY,tmp,'real');out.release=api('releases','POST',{'tag_name':'mxm690-storage-recovery-'+os.environ['GITHUB_RUN_ID'],'target_commitish':head,'name':'MXM OWNER checkpoint 690 storage proof','prerelease':True,'body':json.dumps({'state':'OWNER_STORAGE_PROOF_PENDING'})})
           try:
            meta=out.encrypted(json.loads(v1.encode(proof)),'checkpoint690-owner-storage-proof.mxmenc')
           except Exception as exc:
            print(json.dumps({'phase':'CURRENT_STORAGE_PROBE_FAILED','exception_class':type(exc).__name__,'safe_cause':str(exc) if str(exc).replace('_','').isalnum() else 'UNCLASSIFIED','core':quota(),'broker_requests':0}),flush=True);raise
           safe={'state':'CURRENT_OWNER_STORAGE_AND_READBACK_PASS','source_head':head,'run_id':int(os.environ['GITHUB_RUN_ID']),'generation':690,'identities':61,'remaining':1501,'orphan_generation':uncommitted['generation'],'orphan_pending':len(uncommitted.get('pending_requests',[])),'requests_match':uncommitted['requests']==state['requests'],'initial_core_quota':initial_quota,'final_core_quota':quota(),'primary':meta,'OWNER_READBACK_SUCCESS':True,'historical_upload_http_cause':'UNIDENTIFIED_OLD_GENERIC_ERROR','broker_requests':0,'pilot_executed':False,'HARD21':False}
           api('releases/'+str(out.release['id']),'PATCH',{'body':json.dumps(safe,sort_keys=True)});print(json.dumps(safe,sort_keys=True),flush=True)
          PY
