name: MXM existing Pepperstone native numeric recovery exact source repair V3
on:
  push:
    branches: [performance-research-v3-20260922]
    paths:
      - research_core_v4/pepperstone_continuity_numeric_v1/EXECUTION_V3.json
permissions:
  contents: write
concurrency:
  group: mxm-native-saved-recovery-20261012-v3
  cancel-in-progress: false
jobs:
  private-saved-native-recovery:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned dependencies
        run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Preflight no-broker numerical accounting
        run: |
          python3 -m py_compile research_core_v4/pepperstone_continuity_numeric_v1/runner_v3.py
          python3 -m research_core_v4.pepperstone_continuity_numeric_v1.runner_v1 --selftest
          python3 -m research_core_v4.pepperstone_continuity_numeric_v1.runner_v2 --selftest
      - name: One-use saved authentic native ciphertext economic reduction
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 3145728
          timeout --signal=TERM 2350 python3 -m research_core_v4.pepperstone_continuity_numeric_v1.runner_v3
