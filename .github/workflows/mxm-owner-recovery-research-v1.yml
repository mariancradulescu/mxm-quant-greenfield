name: MXM owner recovery and distinct variance information
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/owner_recovery_v1/OWNER_RECOVERY_EXECUTION_V1.json]
permissions:
  contents: write
jobs:
  authenticate-completed-results-no-scientific-replay:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5
      - name: Existing ciphertext authentication and private aggregate readback only
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
        run: |
          ulimit -v 2097152
          timeout --signal=TERM 720 python3 -m research_core_v4.owner_recovery_v1.readback_v1
  new-realized-variance-joint-moment-information:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5
      - name: One frozen new DEVELOPMENT comparison on unchanged 100 shards
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
        run: |
          ulimit -v 2097152
          ulimit -t 1200
          timeout --signal=TERM 1500 python3 -m research_core_v4.owner_recovery_v1.execute_variance_v1
