name: V4 Exact Geometry Calibration V2
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: ["research_core_v4/**","tests/test_research_core_v4_*.py",".github/workflows/v4-exact-geometry-calibration-v2.yml",".github/workflows/v4-greenfield-recovery-v4.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11.16"}
      - run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r research_core_v4/runtime/numeric-requirements-v1.txt
      - run: python -m py_compile research_core_v4/frozen_v2_semantics.py research_core_v4/response_evaluator_v3.py research_core_v4/exact_geometry_calibration_v3.py research_core_v4/development_execution_runner_v1.py research_core_v4/crash_recovery_control_v3.py
      - name: Verify recovered V3 calibration artifact
        run: |
          python - <<'PY'
          import hashlib,json
          p="research_core_v4/state/EXACT_SUPPORT_GEOMETRY_CALIBRATION_FULL_V3.json"; raw=open(p,"rb").read(); h=hashlib.sha256(raw).hexdigest(); assert h=="fae10bd4817efb1a20426e2ae35171aa62bd924456c104c4d0aa1d07aec0eb05"; x=json.loads(raw); assert not x["market_responses_used"] and x["support_rows"]==3753 and x["permutations"]==1023 and x["seed"]==20261002
          PY
      - name: Exact-head calibration smoke
        run: |
          python research_core_v4/exact_geometry_calibration_v3.py --support-root research_core_v4/support_v2 --smoke --output /tmp/g.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/g.json")); assert not x["market_responses_used"] and x["support_rows"]==3753 and x["P"]==127 and x["selector_tiecheck"]==2 and x["full_arm_weighting_parity"]["abs_diff"]<1e-12 and 0<=x["negative"]["global_any"]<.10 and x["positive"]["active_context"]>x["negative"]["active_context"]
          PY
      - run: python -m unittest tests.test_research_core_v4_execution_binding.ExecutionBindingTests.test_live_authority_v3_bindings_match_production_support_v2_preoutcome
      - run: python research_core_v4/asymmetric_recovery_v4_gate.py --audit
