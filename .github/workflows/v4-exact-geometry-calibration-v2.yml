name: V4 Exact Geometry Calibration V2

on:
  push:
    branches:
      - performance-research-v3-20260922
    paths:
      - "research_core_v4/exact_geometry_calibration_v2.py"
      - "research_core_v4/response_evaluator_v3.py"
      - "research_core_v4/frozen_v2_semantics.py"
      - "research_core_v4/state/EXACT_GEOMETRY_CALIBRATION_V2_REQUEST.json"
      - ".github/workflows/v4-exact-geometry-calibration-v2.yml"

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Compile aligned production and calibration code
        run: python -m py_compile research_core_v4/frozen_v2_semantics.py research_core_v4/response_evaluator_v3.py research_core_v4/exact_geometry_calibration_v2.py
      - name: Run full outcome-blind exact-support calibration
        run: |
          python research_core_v4/exact_geometry_calibration_v2.py --full --output /tmp/exact_geometry_v2.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/exact_geometry_v2.json"))
          assert x["market_responses_used"] is False
          assert x["support_rows"] == 3791
          assert x["permutations"] == 1023
          assert x["seed"] == 20261002
          assert x["selector_exact_tiecheck"]["pass"] is True
          assert x["full_arm_weighting_parity"]["abs_diff"] < 1e-12
          for name,v in x["negative_controls"].items():
              assert v["global_any"] < .07, (name,v)
          print("V4_EXACT_GEOMETRY_V2_FULL_PASS")
          print("CALIBRATION_SUMMARY_JSON="+json.dumps({
            "negative_controls":x["negative_controls"],
            "selector_exact_tiecheck":x["selector_exact_tiecheck"],
            "full_arm_weighting_parity":x["full_arm_weighting_parity"],
            "standardized_mde":x["standardized_mde"],
            "state_specific_power":x["state_specific_power"],
            "effect_grid_standardized":x["effect_grid_standardized"]
          },sort_keys=True,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V4_EXACT_GEOMETRY_CALIBRATION_V2
          path: /tmp/exact_geometry_v2.json
          if-no-files-found: error
          retention-days: 30
