name: MXM checkpoint 512 verified recovery and finite resume
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/checkpoint_512_resume_20261014_v1/AUTHORITY_V1.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: mxm-repaired-native-frontier-single-writer-20261014-v2
  cancel-in-progress: false
jobs:
  verified_resume:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: OWNER cold readback, orphan raw receipt recovery and one-use continuation
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m research_core_v4.checkpoint_512_resume_20261014_v1.resume_v1
