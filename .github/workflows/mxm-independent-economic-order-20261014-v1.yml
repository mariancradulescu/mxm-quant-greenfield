name: MXM independent native economic temporal-order pilot
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/final_recovery_20261014_v1/AUTHORITY_V1.json]
permissions: {contents: write}
concurrency:
  group: mxm-independent-economic-order-20261014-v1
  cancel-in-progress: false
jobs:
  economic:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - run: dotnet build research_core_v4/final_recovery_20261014_v1/csharp/Replay.csproj -c Release --nologo
      - run: dotnet build research_core_v4/final_recovery_20261014_v1/csharp/Native.csproj -c Release --nologo
      - name: Immutable accepted snapshot, frozen cohort, authentic paired native cost pilot
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m research_core_v4.final_recovery_20261014_v1.economic
      - name: Preserve encrypted publication outbox on storage failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-owner-encrypted-outbox-${{ github.run_id }}-${{ github.job }}
          path: ${{ runner.temp }}/mxm-encrypted-outbox/*.mxmenc
          if-no-files-found: ignore
          retention-days: 30
