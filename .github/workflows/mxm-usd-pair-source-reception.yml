{
  "name": "MXM native EURUSD GBPUSD strict-prior source reception",
  "on": {
    "push": {
      "branches": [
        "mxm-remediation-p0-p4-20261015-v1"
      ],
      "paths": [
        ".github/workflows/mxm-usd-pair-source-reception.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {},
  "concurrency": {
    "group": "mxm-integrated-laboratory",
    "cancel-in-progress": false
  },
  "jobs": {
    "usd-pair-source": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "environment": "mxm-r3-custody-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "d2fae5641b759b1c8c24161d83d62d39e104eafd",
            "path": ".sealed-chronology-source",
            "persist-credentials": false
          }
        },
        {
          "name": "Admit exact one-shot engineering scope before custody access",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -m research_core_v4.laboratory.usd_pair_native_reception admit"
        },
        {
          "name": "Restore exact preserved sources and install original wire-decoder extension",
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock\npython3 -m research_core_v4.laboratory.durable_week_chronology --out \"${RUNNER_TEMP}/mxm-usd-pair/eur-source\"\npython3 -m research_core_v4.laboratory.durable_gbpusd_week37_chronology --out \"${RUNNER_TEMP}/mxm-usd-pair/gbp-source\"\ncp research_core_v4/laboratory/week_chronology_reception.py research_core_v4/laboratory/usd_pair_native_reception.py research_core_v4/laboratory/usd_pair_alignment.py .sealed-chronology-source/research_core_v4/laboratory/"
        },
        {
          "name": "Verify and decode exact originals only inside existing custody",
          "env": {
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          },
          "run": "umask 077\ncd .sealed-chronology-source\npython3 -m research_core_v4.laboratory.usd_pair_native_reception export EURUSD \"${RUNNER_TEMP}/mxm-usd-pair/eur-source/capture.mxmenc\" \"${RUNNER_TEMP}/mxm-usd-pair/eur.ndjson\"\npython3 -m research_core_v4.laboratory.usd_pair_native_reception export GBPUSD \"${RUNNER_TEMP}/mxm-usd-pair/gbp-source/capture.mxmenc\" \"${RUNNER_TEMP}/mxm-usd-pair/gbp.ndjson\""
        },
        {
          "name": "Execute actual bounded CSharp source alignment and independent full-array verification",
          "run": "mkdir -p verification/usd-pair-source\ndotnet run --project research_core_v4/laboratory/csharp/usd_pair/MxmUsdPairAlignment.csproj -c Release -- \"${RUNNER_TEMP}/mxm-usd-pair/eur.ndjson\" \"${RUNNER_TEMP}/mxm-usd-pair/gbp.ndjson\" \"${RUNNER_TEMP}/mxm-usd-pair/csharp.json\"\npython3 -m research_core_v4.laboratory.usd_pair_alignment \"${RUNNER_TEMP}/mxm-usd-pair/eur.ndjson\" \"${RUNNER_TEMP}/mxm-usd-pair/gbp.ndjson\" \"${RUNNER_TEMP}/mxm-usd-pair/csharp.json\" \"${RUNNER_TEMP}/mxm-usd-pair/independent.json\""
        },
        {
          "name": "Bind native source and publish only bounded public reception facts",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -m research_core_v4.laboratory.usd_pair_native_reception finalize \"${RUNNER_TEMP}/mxm-usd-pair\" verification/usd-pair-source/receipt.json"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "usd-pair-native-public-reception-${{ github.run_id }}",
            "path": "verification/usd-pair-source/receipt.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
