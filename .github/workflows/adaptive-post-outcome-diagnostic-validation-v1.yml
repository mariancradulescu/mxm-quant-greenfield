name: Adaptive V1 post-outcome diagnostic and auth guard validation
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: ['adaptive_competition/**', '.github/workflows/adaptive-post-outcome-diagnostic-validation-v1.yml']
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: {OPENBLAS_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.16.3 protobuf==5.29.5
      - run: python -m adaptive_competition.test_post_outcome_v1
