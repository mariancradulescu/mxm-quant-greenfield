name: MXM one bounded cause-preserving native continuation
on:
  push:
    branches: [mxm-root-cause-resume-20261014-v1]
    paths: [research_core_v4/root_cause_economic_20261014_v1/RESUME_AUTHORITY_V1.json]
permissions: {contents: write}
concurrency: {group: mxm-repaired-native-frontier-single-writer-20261014-v2, cancel-in-progress: false}
jobs:
  bounded_resume:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - run: python3 -m research_core_v4.root_cause_economic_20261014_v1.recovery
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: mxm-bounded-resume-owner-outbox-${{ github.run_id }}
          path: ${{ runner.temp }}/mxm-encrypted-outbox/*.mxmenc
          if-no-files-found: ignore
