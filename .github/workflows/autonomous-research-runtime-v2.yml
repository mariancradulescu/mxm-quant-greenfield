name: Autonomous Research Runtime V2 Supervisor
# Canonical peer-cohort deterministic contract and full-frontier continuation; wake lifecycle-aware Epoch38 implementation retry: 20260928

on:
  workflow_dispatch:
    inputs:
      mode:
        type: string
        required: false
      predecessor_ci_head:
        type: string
        required: false
      predecessor_ci_conclusion:
        type: string
        required: false
      predecessor_ci_run_id:
        type: string
        required: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autonomous-research-runtime-v2.yml"

permissions:
  contents: write
  actions: write
  copilot-requests: write

concurrency:
  group: mxm-research-writer-performance-research-v3-20260922
  cancel-in-progress: false

env:
  TARGET_BRANCH: performance-research-v3-20260922
  MXM_RUNTIME_TARGET_BRANCH: performance-research-v3-20260922
  PYTHONUNBUFFERED: "1"
  MXM_RECONCILE_VALIDATION_COMMAND: "python -m unittest -q tests.test_autonomous_runtime_v2 tests.test_execution_router_v1 tests.test_deterministic_operation_executor_v1"
  MXM_PREDECESSOR_CI_HEAD: ${{ inputs.predecessor_ci_head }}
  MXM_PREDECESSOR_CI_CONCLUSION: ${{ inputs.predecessor_ci_conclusion }}
  MXM_PREDECESSOR_CI_RUN_ID: ${{ inputs.predecessor_ci_run_id }}

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout canonical research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure durable commit identity
        run: |
          git config user.name "mxm-runtime-v2[bot]"
          git config user.email "mxm-runtime-v2@users.noreply.github.com"

      - name: Regenerate non-authoritative derived views
        run: |
          python - <<'PY'
          from research_v3.evidence_epoch import refresh_derived_views
          print(refresh_derived_views("."))
          PY

      - name: Minimal fast-path validation
        run: >
          python -m unittest -v
          tests.test_execution_router_v1
          tests.test_deterministic_operation_executor_v1
          tests.test_cross_sectional_peer_cohort_index
          tests.test_research_evidence_epoch
          tests.test_active_research_projection
          tests.test_research_fast_path
          tests.test_general_ai_autonomy_loop
          tests.test_discovery_methodology_control
          tests.test_general_ai_reasoning_provider
          tests.test_general_ai_implementation_executor
          tests.test_causal_ml_predictive_state_epoch31_screen
          tests.test_relative_value_epoch32_pair_structure
          tests.test_epoch34_composite_causal_ml_regime_screen
          tests.test_epoch34_deterministic_operation
          tests.test_regime_context_data_sufficiency_audit
          tests.test_epoch38_deterministic_readiness_operation
          tests.test_mean_reversion_cohort_power_design

      - name: Bind tested exact research head for pending REGIME implementation acceptance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          tested="$(git rev-parse HEAD)"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${tested}"
          echo "MXM_PREDECESSOR_CI_HEAD=${tested}" >> "$GITHUB_ENV"
          echo "MXM_PREDECESSOR_CI_CONCLUSION=success" >> "$GITHUB_ENV"
          echo "MXM_PREDECESSOR_CI_RUN_ID=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Verify current external semantic fallback route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_v3.general_ai_autonomy_loop import _provider_unavailable
          from research_v3.general_ai_reasoning_provider import build_reasoning_request
          root=Path(".").resolve()
          ext_path=root/"research_v3/ai_director/EXTERNAL_GENERAL_AI_PROPOSAL_V1.json"
          if not ext_path.is_file():
              print(json.dumps({"external_present": False}, sort_keys=True))
              raise SystemExit(0)
          ext=json.loads(ext_path.read_text())
          if (ext.get("provider") or {}).get("kind")!="EXTERNAL_CHATGPT_GENERAL_REASONING":
              print(json.dumps({"external_present": True, "external_kind": (ext.get("provider") or {}).get("kind")}, sort_keys=True))
              raise SystemExit(0)
          state=json.loads((root/"research_v3/runtime_v2_acceptance/NEXT_AUTONOMOUS_STATE.json").read_text())
          req=build_reasoning_request(root)
          binding=ext.get("evidence_binding") or {}
          blocked=_provider_unavailable(root,state,"GENERAL_AI_REASONING")
          diag={
              "external_present": True,
              "external_request_id": binding.get("reasoning_request_id"),
              "current_request_id": req.get("request_id"),
              "external_epoch": binding.get("evidence_epoch_seen"),
              "current_epoch": req.get("evidence_epoch_seen"),
              "blocked": blocked is not None,
              "blocked_status": (blocked or {}).get("status"),
          }
          print(json.dumps(diag, sort_keys=True))
          if binding.get("reasoning_request_id")==req.get("request_id") and binding.get("evidence_epoch_seen")==req.get("evidence_epoch_seen") and blocked is not None:
              raise SystemExit("current external proposal is incorrectly blocked by provider recovery state")
          PY

      - name: Install Copilot CLI once for genuine semantic work reached in this run
        run: npm install -g @github/copilot

      - name: Run self-continuing minimal research engine
        id: continuation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          MXM_COPILOT_MODEL: auto
          MXM_COPILOT_IMPLEMENTATION_MODEL: auto
        shell: bash
        run: |
          set -euo pipefail
          final_status=""
          initial_fingerprint="$(python - <<'PY'
          import json
          from pathlib import Path
          from research_v3.general_ai_autonomy_loop import _material_state_signature, _blocked_scopes
          from research_v3.general_ai_director_bridge import NEXT_STATE_REL
          state=json.loads(Path(NEXT_STATE_REL).read_text())
          print(_material_state_signature(state)+':'+','.join(_blocked_scopes(Path('.'))))
          PY
          )"
          for batch in 1 2 3; do
            log="/tmp/mxm-minimal-runtime-${batch}.json"
            python -m research_v3.general_ai_autonomy_loop continue               --root .               --git-checkpoint               --git-push               --max-cycles 12 | tee "${log}"
            final_status="$(python - "${log}" <<'PY'
          import json,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text()
          starts=[i for i,c in enumerate(raw) if c=="{"]
          payload=None
          for i in reversed(starts):
              try:
                  candidate=json.loads(raw[i:])
              except Exception:
                  continue
              if isinstance(candidate,dict) and "status" in candidate:
                  payload=candidate
                  break
          if payload is None:
              raise SystemExit("No runtime result object found")
          print(payload["status"])
          PY
            )"
            echo "batch=${batch} status=${final_status}"
            case "${final_status}" in
              BOUNDED_CONTINUATION_CHECKPOINT)
                continue
                ;;
              PROVIDER_RETRY_REQUIRED)
                retry_sleep="$(python - <<'PY'
          import json, math
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path("research_v3/ai_director/PROVIDER_RECOVERY_STATE.json")
          doc=json.loads(p.read_text()) if p.is_file() else {}
          due=doc.get("next_retry_after_utc")
          if not due:
              print(0)
          else:
              target=datetime.fromisoformat(due.replace("Z","+00:00"))
              remaining=max(0.0,(target-datetime.now(timezone.utc)).total_seconds())
              print(int(math.ceil(remaining)))
          PY
                )"
                if [[ "${retry_sleep}" -gt 0 ]]; then
                  echo "Recoverable provider failure; holding the canonical writer until the persisted retry deadline (${retry_sleep}s) without another provider call."
                  sleep "${retry_sleep}"
                fi
                echo "Retry deadline reached; retrying the same semantic request within the finite machine-owned request budget."
                continue
                ;;
              PROVIDER_RETRY_BUDGET_EXHAUSTED|PROVIDER_UNAVAILABLE)
                echo "Provider continuation is durably bounded for the current semantic request."
                break
                ;;
              PENDING_EXACT_HEAD_GREEN)
                gh workflow run research-fast-path-validation.yml --ref main \
                  -f required_head="$(git rev-parse HEAD)"
                break
                ;;
              PENDING_ACCEPTED_CAPTURE_BYTES)
                echo "Accepted broker capture bytes must be materialized at the recorded hashes; no provider retry."
                break
                ;;
              ADDITIONAL_AUTHORITY_REQUIRED)
                echo "Research held at explicit missing authority; no provider retry."
                break
                ;;
              QUIESCENT_NO_ACTION)
                python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("research_v3/runtime_v2_acceptance/NEXT_AUTONOMOUS_STATE.json").read_text())
          if state.get("next_action"):
              raise SystemExit("Unrouted canonical next_action: "+str(state["next_action"]))
          PY
                break
                ;;
              *)
                break
                ;;
            esac
          done
          if [[ "${final_status}" == "BOUNDED_CONTINUATION_CHECKPOINT" ]]; then
            successor="$(python - "${initial_fingerprint}" <<'PY'
          import sys,json
          from pathlib import Path
          from research_v3.general_ai_autonomy_loop import _material_state_signature,_blocked_scopes
          from research_v3.general_ai_reasoning_provider import build_reasoning_request
          from research_v3.general_ai_director_bridge import NEXT_STATE_REL
          from research_v3.runtime_v2_primitives import load_json
          state=load_json(Path('.')/NEXT_STATE_REL,{}) or {}
          signature=_material_state_signature(state)+':'+','.join(_blocked_scopes(Path('.')))
          blocked=state.get('user_action_required') or state.get('external_data_required') or state.get('external_gate') or state.get('external_data_gate') or state.get('status')=='MATERIAL_INTEGRITY_FAILURE'
          request=load_json(Path('research_v3/ai_director/ADDITIONAL_AUTHORITY_REQUEST_V1.json'),{}) or {}
          same_request=request.get('status')=='ADDITIONAL_AUTHORITY_REQUIRED' and request.get('evidence_epoch')==state.get('current_research_evidence_epoch') and request.get('request_id')==build_reasoning_request('.')['request_id']
          print('yes' if signature!=sys.argv[1] and not blocked and not same_request else 'no')
          PY
            )"
            if [[ "${successor}" == "yes" ]]; then
              gh workflow run autonomous-research-runtime-v2.yml --ref main
            fi
          fi
          echo "final_status=${final_status}" >> "${GITHUB_OUTPUT}"

      - name: Preserve paid provider work on branch persistence failure
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/mxm-provider-recovery
          git rev-parse HEAD > /tmp/mxm-provider-recovery/failed-local-head.txt
          git format-patch -1 --stdout HEAD > /tmp/mxm-provider-recovery/generated.patch || true
          cp research_v3/ai_director/IMPLEMENTATION_RESPONSE.json /tmp/mxm-provider-recovery/implementation-response.json || true
          cp research_v3/ai_director/PROVIDER_USAGE_V1.json /tmp/mxm-provider-recovery/provider-usage.json || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mxm-provider-persistence-recovery-${{ github.run_id }}
          path: /tmp/mxm-provider-recovery/
          if-no-files-found: ignore

      - name: Refresh derived views after durable progress
        run: |
          python - <<'PY'
          from research_v3.evidence_epoch import refresh_derived_views
          print(refresh_derived_views("."))
          PY

      - name: Post-transition fast validation
        run: >
          python -m unittest -v
          tests.test_execution_router_v1
          tests.test_deterministic_operation_executor_v1
          tests.test_cross_sectional_peer_cohort_index
          tests.test_research_evidence_epoch
          tests.test_active_research_projection
          tests.test_research_fast_path
          tests.test_general_ai_autonomy_loop
          tests.test_discovery_methodology_control
          tests.test_general_ai_reasoning_provider
          tests.test_general_ai_implementation_executor
          tests.test_causal_ml_predictive_state_epoch31_screen
          tests.test_relative_value_epoch32_pair_structure
          tests.test_epoch34_composite_causal_ml_regime_screen
          tests.test_epoch34_deterministic_operation
          tests.test_regime_context_data_sufficiency_audit
          tests.test_epoch38_deterministic_readiness_operation
          tests.test_mean_reversion_cohort_power_design

      - name: Report durable frontier
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("research_v3/runtime_v2_acceptance/NEXT_AUTONOMOUS_STATE.json").read_text())
          usage=json.loads(Path("research_v3/ai_director/PROVIDER_USAGE_V1.json").read_text())
          print(json.dumps({
              "runtime_status":"${{ steps.continuation.outputs.final_status }}",
              "canonical_status":state.get("status"),
              "next_action":state.get("next_action"),
              "evidence_epoch":state.get("current_research_evidence_epoch"),
              "accounting":state.get("accounting"),
              "provider_invocations":usage.get("provider_invocations"),
              "successful_reasoning_invocations":usage.get("successful_reasoning_invocations"),
              "successful_implementation_invocations":usage.get("successful_implementation_invocations"),
          },sort_keys=True,indent=2))
          PY
