name: pre-m6-integrity02
on:
  push:
    branches: [pre-m6-integrity02-stage-20260917]
  workflow_dispatch:
jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full repository unittest suite
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py' -v
