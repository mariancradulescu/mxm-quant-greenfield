name: MXM MASTER1576 diverse wave integrated fabricated preflight
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/diverse_mechanism_wave_v1/SYNTHETIC_LAUNCH_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-master1576-diverse-wave-fabricated-v1
  cancel-in-progress: false
jobs:
  actual-new-kernels-and-existing-encrypted-delivery:
    if: github.ref == 'refs/heads/performance-research-v3-20260922' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5
      - name: Single fabricated campaign claim and exact source freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from research_core_v4.diverse_mechanism_wave_v1 import authority_v1 as a
          from research_core_v4.numeric_development_v2 import machine_v2 as v2
          head=os.environ['GITHUB_SHA'];v2.runtime(head);a.unavailable_acceptance_preflight()
          source=a.git('log','-1','--format=%H',head,'--',a.BINDINGS).decode().strip()
          arm=a.candidate(source,a.read(a.BINDINGS)['bindings'],'synthetic');a.validate_candidate(head,arm,'synthetic')
          launch=a.read(a.PREFIX+'SYNTHETIC_LAUNCH_V1.json')
          a.need(launch=={'schema':'mxm.diverse.wave.synthetic.launch.v1','mode':'FABRICATED_ONLY','source_head':source,'design_sha256':a.DESIGN_SHA,'binding_manifest_sha256':a.digest(a.BINDINGS),'fixture_packages':2,'family_comparisons':6,'attempts':1,'real_authorized':False},'SYNTHETIC_LAUNCH_DRIFT')
          name='tags/mxm-diverse-wave-synthetic-launch-'+source
          a.need(not a.old.api('git/matching-refs/'+name),'SYNTHETIC_CAMPAIGN_ALREADY_CLAIMED')
          a.old.api('git/refs',{'ref':'refs/'+name,'sha':head})
          print('PASS_EXACT_FABRICATED_SOURCE_ONLY_NO_REAL_PRIVATE_KEY')
          PY
      - name: New scientific and adapter boundaries only
        run: python3 -m unittest research_core_v4.diverse_mechanism_wave_v1.test_wave_v1 -v
      - name: Two fabricated packages through actual encrypted checkpoint and final delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ulimit -v 8388608
          timeout --signal=TERM 1000 python3 -m research_core_v4.diverse_mechanism_wave_v1.worker_v1 --mode synthetic
