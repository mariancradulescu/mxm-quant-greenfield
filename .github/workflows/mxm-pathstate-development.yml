{
  "name": "MXM finite delayed-target price-path-state DEVELOPMENT",
  "on": {
    "push": {
      "branches": [
        "mxm-remediation-p0-p4-20261015-v1"
      ],
      "paths": [
        ".github/workflows/mxm-pathstate-development.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {},
  "concurrency": {
    "group": "mxm-integrated-laboratory",
    "cancel-in-progress": false
  },
  "jobs": {
    "pathstate-development": {
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1",
      "environment": "mxm-r3-custody-v1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Admit exact precommit before custody access",
          "run": "python3 -m research_core_v4.laboratory.pathstate_development admit"
        },
        {
          "name": "Build exact C# and check independent artificial causal episodes",
          "run": "dotnet run --project research_core_v4/laboratory/csharp/pathstate/MxmPathStateDevelopment.csproj -c Release -- --selftest\npython3 -m unittest research_core_v4.laboratory.test_pathstate_development -v\npython3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock"
        },
        {
          "name": "Read exact existing corpus; evaluate one C# model and independently reconcile all ordinal signal, forecast, target and episode ledgers",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          },
          "run": "python3 -m research_core_v4.laboratory.pathstate_development verification/pathstate-development"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "pathstate-development-${{ github.run_id }}",
            "path": "verification/pathstate-development/receipt.json\nverification/pathstate-development/full-result.mxmenc",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
