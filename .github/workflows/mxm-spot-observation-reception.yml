{
  "name": "MXM prospective triad source admission and complete private economic journal",
  "on": {
    "push": {
      "branches": [
        "mxm-remediation-p0-p4-20261015-v1"
      ],
      "paths": [
        ".github/workflows/mxm-spot-observation-reception.yml"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "mxm-integrated-laboratory",
    "cancel-in-progress": false
  },
  "jobs": {
    "spot-collect": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "environment": "mxm-r3-pepperstone-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "d2fae5641b759b1c8c24161d83d62d39e104eafd",
            "path": ".spot-native",
            "persist-credentials": false
          }
        },
        {
          "name": "Admit exact finite source scope before any secret access",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -m research_core_v4.laboratory.quote_triangle_development admit"
        },
        {
          "name": "Verify source-only contract and install exact extension into existing decoder",
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock\ndotnet build research_core_v4/laboratory/csharp/quote_triangle/MxmQuoteTriangle.csproj -c Release\npython3 -m unittest research_core_v4.laboratory.test_quote_triangle -v\npython3 -m research_core_v4.laboratory.quote_triangle_development install"
        },
        {
          "name": "Finite VIEW source collection",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "R3_CTRADER_CLIENT_ID": "${{ secrets.R3_CTRADER_CLIENT_ID }}",
            "R3_CTRADER_CLIENT_SECRET": "${{ secrets.R3_CTRADER_CLIENT_SECRET }}",
            "R3_CTRADER_ACCESS_TOKEN": "${{ secrets.R3_CTRADER_ACCESS_TOKEN }}"
          },
          "run": "umask 077\ncd .spot-native\npython3 -m research_core_v4.laboratory.quote_triangle_development spot-collect"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "quote-triad-source-${{ github.run_id }}",
            "path": "verification/quote-triangle/capture.mxmenc\nverification/quote-triangle/producer.json",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ],
      "if": "github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1"
    },
    "spot-cold": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "environment": "mxm-r3-custody-v1",
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "d2fae5641b759b1c8c24161d83d62d39e104eafd",
            "path": ".spot-native",
            "persist-credentials": false
          }
        },
        {
          "name": "Admit exact finite source scope before any secret access",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -m research_core_v4.laboratory.quote_triangle_development admit"
        },
        {
          "name": "Verify source-only contract and install exact extension into existing decoder",
          "run": "python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock\ndotnet build research_core_v4/laboratory/csharp/quote_triangle/MxmQuoteTriangle.csproj -c Release\npython3 -m unittest research_core_v4.laboratory.test_quote_triangle -v\npython3 -m research_core_v4.laboratory.quote_triangle_development install"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "quote-triad-source-${{ github.run_id }}",
            "path": "verification/quote-triangle"
          }
        },
        {
          "name": "Independent native ciphertext and wire readback",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}"
          },
          "run": "umask 077\ncd .spot-native\npython3 -m research_core_v4.laboratory.quote_triangle_development export"
        },
        {
          "name": "Source admission before identity; evaluate once in CSharp and preserve individual ledger encrypted",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "umask 077\npython3 -m research_core_v4.laboratory.quote_triangle_development evaluate"
        },
        {
          "name": "Read original complete encrypted result in a separate custody process without model replay",
          "env": {
            "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM": "${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}",
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "umask 077\ncd .spot-native\npython3 -m research_core_v4.laboratory.quote_triangle_development cold"
        },
        {
          "name": "Retain original result bytes without decryption or repeated economics",
          "run": "python3 -m research_core_v4.laboratory.quote_triangle_development preserve"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "quote-triad-result-${{ github.run_id }}",
            "path": "verification/quote-triangle/receipt.json\nverification/quote-triangle/result.mxmenc\nverification/quote-triangle/evaluator.dll\nverification/quote-triangle/cold.json\nverification/quote-triangle/runtime-original.zip",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ],
      "needs": "spot-collect",
      "if": "always()"
    }
  }
}
