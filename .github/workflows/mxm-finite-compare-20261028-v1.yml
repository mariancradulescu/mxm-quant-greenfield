name: MXM finite three-mechanism authentic comparative DEVELOPMENT
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-finite-compare-20261028-v1.yml
      - research_core_v4/laboratory/finite_comparative_20261028_v1.py
      - research_core_v4/laboratory/FINITE_H1_COMPARATIVE_20261028_V1.json
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-finite-compare-20261028-v1.yml
permissions: {contents: read, actions: read}
concurrency:
  group: mxm-integrated-laboratory
  cancel-in-progress: false
jobs:
  pre-outcome:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate frozen programme before custody access
        run: |
          python3 -m research_core_v4.laboratory.finite_comparative_20261028_v1 --selftest
          python3 -c 'from research_core_v4.laboratory.finite_comparative_20261028_v1 import validate; validate()'
  economic-discovery:
    needs: pre-outcome
    if: github.event_name == 'push' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1 && github.repository == 'mariancradulescu/mxm-quant-greenfield'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify exact official HEAD, authority refs and one finite push invocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/git/ref/heads/mxm-remediation-p0-p4-20261015-v1 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/git/ref/heads/mxm-o04-active-v1 --jq .object.sha)" = "07d1ddbe0b83753bbf189770af1911623fef8d6f"
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/git/ref/heads/mxm-o04-accepted-owner-1807-v1 --jq .object.sha)" = "a830c132521bd4348454653f713e04f6107484fe"
          # The exact predecessor was rejected by YAML parser before creating any job.
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/actions/runs/40736989235 --jq .conclusion)" = "failure"
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/actions/runs/40736989235/jobs --jq .total_count)" = "0"
          # One non-started parser-failure plus exactly one current official push.
          test "$(gh api 'repos/mariancradulescu/mxm-quant-greenfield/actions/workflows/mxm-finite-compare-20261028-v1.yml/runs?event=push&branch=mxm-remediation-p0-p4-20261015-v1&per_page=100' --jq .total_count)" = "2"
      - name: Install existing exact locked dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Execute three fixed authentic causal Stage A screening mechanisms in existing custody
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.finite_comparative_20261028_v1 --run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-finite-three-mechanism-stage-a-${{ github.run_id }}
          path: verification/finite-compare-20261028/receipt.json
          if-no-files-found: error
          retention-days: 90
