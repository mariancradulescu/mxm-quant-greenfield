name: MXM finite three-mechanism authentic comparative DEVELOPMENT
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-finite-compare-20261028-v1.yml
      - research_core_v4/laboratory/finite_comparative_20261028_v1.py
      - research_core_v4/laboratory/FINITE_H1_COMPARATIVE_20261028_V1.json
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-finite-compare-20261028-v1.yml
permissions: {contents: read, actions: read}
concurrency:
  group: mxm-integrated-laboratory
  cancel-in-progress: false
jobs:
  pre-outcome:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate frozen programme before custody access
        run: |
          python3 -m research_core_v4.laboratory.finite_comparative_20261028_v1 --selftest
          python3 -c 'from research_core_v4.laboratory.finite_comparative_20261028_v1 import validate; validate()'
  economic-discovery:
    needs: pre-outcome
    if: github.event_name == 'push' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1 && github.repository == 'mariancradulescu/mxm-quant-greenfield'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify exact official HEAD, authority refs and one finite push invocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/git/ref/heads/mxm-remediation-p0-p4-20261015-v1 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/git/ref/heads/mxm-o04-active-v1 --jq .object.sha)" = "07d1ddbe0b83753bbf189770af1911623fef8d6f"
          test "$(gh api repos/mariancradulescu/mxm-quant-greenfield/git/ref/heads/mxm-o04-accepted-owner-1807-v1 --jq .object.sha)" = "a830c132521bd4348454653f713e04f6107484fe"
          # All previous attempts are exact bounded pre-economics technical failures.
          # Never re-execute after any model step has started, including ambiguous failure.
          python3 - <<'PY'
          import json,os,subprocess
          repo="mariancradulescu/mxm-quant-greenfield"
          def api(path):
              return json.loads(subprocess.check_output(["gh","api","repos/"+repo+"/"+path],text=True))
          def must(condition,code):
              if not condition:raise RuntimeError("COMPARE_FAIL_CLOSED_"+code)
          current=int(os.environ["GITHUB_RUN_ID"])
          path="actions/workflows/mxm-finite-compare-20261028-v1.yml/runs?event=push&branch=mxm-remediation-p0-p4-20261015-v1&per_page=100"
          response=api(path);runs=response["workflow_runs"]
          expected={40736989235,40737524654,40738420079,current}
          must(response["total_count"]==len(runs)==4 and {x["id"] for x in runs}==expected,"EXACT_ATTEMPT_SET")
          by={x["id"]:x for x in runs}
          must(by[current]["head_sha"]==os.environ["GITHUB_SHA"] and by[current]["run_attempt"]==1,"CURRENT_ID")
          for prior in (40736989235,40737524654):
              r=by[prior]
              must(r["head_sha"]=="1e53bdfd31231ea7d51d4807d0ab62e520db1b00" and r["conclusion"]=="failure","PARSER_PREDECESSOR")
              must(api("actions/runs/"+str(prior)+"/jobs")["total_count"]==0,"PARSER_ZERO_JOBS")
          prior=by[40738420079]
          must(prior["head_sha"]=="0387ebd1225d0994b418c02ec7039232519ca8f0" and prior["conclusion"]=="failure","ADMISSION_PREDECESSOR")
          jobs=api("actions/runs/40738420079/jobs")["jobs"]
          must(len(jobs)==2,"ADMISSION_JOB_COUNT")
          economic=[x for x in jobs if x["name"]=="economic-discovery"]
          must(len(economic)==1 and economic[0]["conclusion"]=="failure","ADMISSION_STOP")
          steps={x["name"]:x["conclusion"] for x in economic[0]["steps"]}
          must(steps.get("Verify exact official HEAD, authority refs and one finite push invocation")=="failure","GATE_BEFORE_CUSTODY")
          must(steps.get("Execute three fixed authentic causal Stage A screening mechanisms in existing custody")=="skipped","ZERO_ECONOMIC_MODELS")
          print("MXM_EXACT_PREOUTCOME_FAILURES_VALIDATED_NO_MODEL_REEXECUTION")
          PY
      - name: Install existing exact locked dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Execute three fixed authentic causal Stage A screening mechanisms in existing custody
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.finite_comparative_20261028_v1 --run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-finite-three-mechanism-stage-a-${{ github.run_id }}
          path: verification/finite-compare-20261028/receipt.json
          if-no-files-found: error
          retention-days: 90
