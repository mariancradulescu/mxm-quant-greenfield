name: MXM O04.2 wrong workload custody denial canary only
on:
  push:
    branches: [mxm-o04-stage-custody-negative-v1]
permissions: {}
jobs:
  wrong_workload:
    environment: mxm-o04-staging-issuer
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Must never start; no key is referenced even if policy fails
        run: |
          python3 - <<'PY'
          import os
          print('UNAUTHORIZED_ENVIRONMENT_JOB_STARTED')
          print('synthetic_canary_visible='+str(bool(os.environ.get('CANARY'))))
          raise SystemExit(90)
          PY
        env:
          CANARY: ${{ secrets.O04_CUSTODY_CANARY }}
