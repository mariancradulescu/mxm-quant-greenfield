name: MXM encrypted laboratory archive integrity
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [docs/laboratory-completion/20261019/VERIFY_ARCHIVE_ONCE.json]
permissions: {contents: read}
jobs:
  verify-encrypted-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 67dbe37b2913581f90e119fee16b32f36e8daaed
          persist-credentials: false
      - run: |
          python3 - <<'PY'
          import json,pathlib,hashlib,zipfile,io
          root=pathlib.Path('.');base=root/'docs/laboratory-completion/20261019'
          manifest=json.loads((base/'RECOVERY_ARCHIVE_PARTS.json').read_text())
          parts=[]
          for row in manifest['parts']:
              blob=(root/row['path']).read_bytes()
              assert len(blob)==row['length']
              assert hashlib.sha256(blob).hexdigest()==row['sha256']
              assert hashlib.sha1(b'blob '+str(len(blob)).encode()+b'\0'+blob).hexdigest()==row['git_blob_sha']
              parts.append(blob)
          archive=b''.join(parts)
          assert len(archive)==manifest['size'] and hashlib.sha256(archive).hexdigest()==manifest['sha256']
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert set(z.namelist())=={'recovery-receipt.json','recovery.mxmenc'}
              receipt=json.loads(z.read('recovery-receipt.json'))
              assert hashlib.sha256(z.read('recovery.mxmenc')).hexdigest()==receipt['encrypted_sha256']
          print(json.dumps({'schema':'mxm.encrypted-archive-persistence-integrity.v1','state':'GIT_CHECKOUT_ALL_PARTS_REASSEMBLED_AND_VERIFIED','source_sha':'67dbe37b2913581f90e119fee16b32f36e8daaed','archive_sha256':manifest['sha256'],'parts':len(parts),'secret_used':False,'private_decryption':False,'scientific_replay':False}))
          PY
