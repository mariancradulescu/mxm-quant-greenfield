name: V4 Recovery Governance and Runtime Audit
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: ["research_core_v4/**","tests/test_research_core_v4_*.py",".github/workflows/v4-recovery-v2-audit.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python -m py_compile research_core_v4/crash_recovery_control_v3.py research_core_v4/greenfield_runtime_benchmark_v1.py
      - run: python -m research_core_v4.crash_recovery_control_v3
      - run: python -m unittest tests.test_research_core_v4_recovery_v3
      - name: Verify persisted runtime and identity evidence
        run: |
          python - <<'PY'
          import json
          b=json.load(open("research_core_v4/state/V4_GREENFIELD_REFERENCE_RUNTIME_BENCHMARK_RESULT_V1.json")); e=json.load(open("research_core_v4/state/V4_GREENFIELD_EXECUTION_SEMANTIC_EQUIVALENCE_V1.json")); s=json.load(open("research_core_v4/state/V4_STATE.json"))
          assert b["status"]=="PASS_REFERENCE_SOURCE_RUNTIME_WITH_SAFE_MARGIN" and b["evidence_boundary"]["synthetic_only"] and not b["evidence_boundary"]["real_market_response_values_used"] and b["full_synthetic_result"]["event_count"]==118262 and b["measured_margin_multiple_vs_available_limit"]>10
          assert e["status"]=="PASS_EXACT_REFERENCE_BYTE_IDENTITY_NO_REIMPLEMENTATION" and e["execution_implementation"]["identity_with_reference"]
          assert s["recovery_v3_preparation"]["accepted_canonical_result_count"]==0 and not s["recovery_v3_preparation"]["real_execution_authorized"]
          PY
