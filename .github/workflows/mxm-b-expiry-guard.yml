name: MXM B exact bootstrap expiry guard
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/b_expiry_guard_20261019/**
      - .github/workflows/mxm-b-expiry-guard.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: mxm-b-exact-bootstrap-expiry-guard
  cancel-in-progress: false
jobs:
  expiry-guard:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read, actions: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1cdce14da623b5f2040a69031ca9ed30d11f63e4
          persist-credentials: false
          sparse-checkout: |
            research_core_v4/b_expiry_guard_20261019
            docs/p0-successor-b/20261018/NATIVE_BUNDLE_39147483523.json
      - name: Only new expiry and race controls, no accepted suite repeated
        if: github.event_name == 'push'
        run: python3 -m unittest research_core_v4.b_expiry_guard_20261019.test_guard -v
      - name: Exact live expiry reconciliation, no key or bootstrap
        run: python3 -m research_core_v4.b_expiry_guard_20261019.guard
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-b-expiry-guard-${{ github.run_id }}
          path: verification/b-expiry-guard/receipt.json
          if-no-files-found: error
