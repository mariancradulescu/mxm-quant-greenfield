name: MXM complete native paired strategy consecutive weeks V1
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/complete_strategy_frontier_v1/STRATEGY_EXECUTION_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-complete-strategy-frontier-v1
  cancel-in-progress: false
jobs:
  complete-strategy:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Verify causal price access, matched entries, costs and cash abstention
        run: python3 -m unittest -q research_core_v4.complete_strategy_frontier_v1.test_strategy_v1 research_core_v4.complete_strategy_frontier_v1.test_stage_a_v1
      - name: Reuse native data, checkpoint bounded gaps, execute complete strategy
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 3145728
          timeout --signal=TERM 5000 python3 -m research_core_v4.complete_strategy_frontier_v1.runner_v1
