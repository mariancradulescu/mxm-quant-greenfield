          assert report["network_connection_attempted"] is False, report
          assert report["credentials_used"] is False, report
          assert report["orders_permitted"] is False, report
          assert report["account_mutation_permitted"] is False, report
          assert report["economic_outcomes_opened"] is False, report
          assert report["v2_attempts_consumed"] == 0, report
          print("C031_STRUCTURAL_EXTENSION_PREFLIGHT_PASS", report)
          PY
      - name: Competition ultra-fast no-credential preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from competition.pydroid_ultra_fast_launcher import local_preflight
          report = local_preflight()
          assert report["shortlist"] == 32, report
          assert report["max_stage_a_markets"] == 12, report
          assert report["global_windows"] == 20, report
