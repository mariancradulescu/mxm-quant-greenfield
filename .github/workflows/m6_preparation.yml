name: m6-preparation
on:
  push:
    branches:
      - m6-prep-materialization-20260917
      - competition-performance-v1-20260921
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Android-safe M6 runtime
        run: |
          python -m pip install --only-binary=:all: --no-deps -r tools/requirements-m6-capture.txt
      - name: Compile actual Pydroid runtime files
        run: python -m py_compile M6_CAPTURE_RUN.py M6_COST_EVIDENCE_RUN.py M6_PREOPEN_SUPPLEMENT_RUN.py M6_STAGE_B_MARGIN_HISTORY_RUN.py COMPETITION_BROKER_UNIVERSE_CAPTURE_RUN.py COMPETITION_FRONTIER_DATA_CAPTURE_RUN.py COMPETITION_ULTRA_FAST_CAPTURE_RUN.py competition/broker_universe_capture.py competition/pydroid_broker_universe_launcher.py competition/frontier_data_capture.py competition/pydroid_frontier_data_launcher.py competition/ultra_fast_capture.py competition/friction_costs.py competition/pydroid_ultra_fast_launcher.py competition/shared_eur200_replay.py tools/build_competition_broker_universe_capture_package.py tools/build_competition_frontier_data_capture_package.py tools/build_competition_ultra_fast_capture_package.py m6/preopen_supplement.py m6/preopen_evidence_openapi.py m6/pydroid_preopen_launcher.py m6/stage_b_margin_evidence.py m6/stage_b_margin_openapi.py m6/pydroid_stage_b_margin_launcher.py m6/pydroid_launcher.py m6/pydroid_cost_launcher.py m6/pydroid_oauth.py m6/pydroid_symbol_mapping.py m6/broker_product_identity.py m6/causal_conversion.py m6/session_replay.py m6/tier1_candidate_replay.py m6/cost_evidence.py m6/cost_evidence_openapi.py m6/ctrader_capture.py m6/_ctrader_capture_base.py m6/ctrader_openapi.py m6/ctrader_transport.py m6/ctrader_proto/OpenApiCommonModelMessages_pb2.py m6/ctrader_proto/OpenApiCommonMessages_pb2.py m6/ctrader_proto/OpenApiModelMessages_pb2.py m6/ctrader_proto/OpenApiMessages_pb2.py
      - name: No-credential Android-safe runtime preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("m6_bootstrap_ci", Path("M6_CAPTURE_RUN.py"))
          bootstrap = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bootstrap)
          status = bootstrap.runtime_dependency_status()
          assert status["ready"] is True, status
          assert status["rust_required"] is False, status
          assert status["cryptography_required"] is False, status
          print("PYDROID_PY313_BOOTSTRAP_PASS", status)

          import m6.ctrader_capture as core
          import m6.ctrader_openapi as runtime
          report = runtime.runtime_sdk_preflight()
          assert report["transport"] == "python_stdlib_ssl_socket", report
          assert report["ctrader_open_api_version"] == "PROTO_MESSAGES_VENDOR_0.9.2", report
          assert report["twisted_required"] is False, report
          assert report["pyopenssl_required"] is False, report
          assert report["cryptography_required"] is False, report
          assert report["rust_required"] is False, report
          assert report["network_connection_attempted"] is False, report
          assert report["credentials_used"] is False, report
          assert 4.7 < core.HISTORICAL_TARGET_RPS < 4.8
          print("RUNTIME_PREFLIGHT_PASS", report)
          PY
      - name: Stage-B historical-margin no-credential preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from m6.pydroid_stage_b_margin_launcher import local_preflight
          report = local_preflight()
          assert report["network_connection_attempted"] is False, report
          assert report["credentials_used"] is False, report
          assert report["orders_permitted"] is False, report
          assert report["account_mutation_permitted"] is False, report
          assert report["targets"] == {"US500": 127, "NAS100": 126}, report
          print("STAGE_B_MARGIN_PREFLIGHT_PASS", report)
          PY
      - name: Competition broker-universe no-credential preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from competition.pydroid_broker_universe_launcher import local_preflight
          from competition.broker_universe_capture import FEASIBLE,INFEASIBLE,UNRESOLVED,classify_direction,directional_summary
          report = local_preflight()
          assert report["network_connection_attempted"] is False, report
          assert report["credentials_used"] is False, report
          assert report["orders_permitted"] is False, report
          assert report["account_mutation_permitted"] is False, report
          assert classify_direction(199.0, True) == FEASIBLE
          assert classify_direction(201.0, True) == INFEASIBLE
          assert classify_direction(10.0, False) == INFEASIBLE
          assert classify_direction(None, True) == UNRESOLVED
          assert directional_summary(FEASIBLE, INFEASIBLE) == "BUY_ONLY"
          print("COMPETITION_BROKER_UNIVERSE_PREFLIGHT_PASS", report)
          PY
      - name: Competition broad-frontier M5 no-credential preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from competition.pydroid_frontier_data_launcher import local_preflight
          report = local_preflight()
          assert report["symbols"] == 16, report
          assert report["resolution"] == "M5", report
          assert report["network_connection_attempted"] is False, report
          assert report["credentials_used"] is False, report
          assert report["orders_permitted"] is False, report
          assert report["account_mutation_permitted"] is False, report
          assert report["economic_outcomes_opened"] is False, report
          print("COMPETITION_FRONTIER_M5_PREFLIGHT_PASS", report)
          PY
      - name: Competition ultra-fast no-credential preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from competition.pydroid_ultra_fast_launcher import local_preflight
          report = local_preflight()
          assert report["shortlist"] == 32, report
          assert report["max_stage_a_markets"] == 12, report
          assert report["global_windows"] == 20, report
          assert report["crypto_windows"] == 28, report
          assert report["regional_windows"] == 8, report
          assert report["raw_ticks_transferred"] is False, report
          assert report["network_connection_attempted"] is False, report
          assert report["credentials_used"] is False, report
          assert report["orders_permitted"] is False, report
          assert report["account_mutation_permitted"] is False, report
          assert report["economic_outcomes_opened"] is False, report
          print("COMPETITION_ULTRA_FAST_PREFLIGHT_PASS", report)
          PY
      - name: Full repository unittest suite on Python 3.13
        run: PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build deterministic Pydroid deployment package
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/build_m6_pydroid_package.py
          sha256sum dist/MXM_M6_CAPTURE_PYDROID_PACKAGE.zip
      - name: Upload Pydroid deployment package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_M6_CAPTURE_PYDROID_PACKAGE
          path: dist/MXM_M6_CAPTURE_PYDROID_PACKAGE.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build deterministic Tier-1 cost-evidence Pydroid package
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/build_m6_cost_evidence_pydroid_package.py
          sha256sum dist/MXM_M6_COST_EVIDENCE_PYDROID_PACKAGE.zip
      - name: Upload Tier-1 cost-evidence Pydroid package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_M6_COST_EVIDENCE_PYDROID_PACKAGE
          path: dist/MXM_M6_COST_EVIDENCE_PYDROID_PACKAGE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build deterministic 09:30 pre-open supplement Pydroid package
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/build_m6_preopen_supplement_pydroid_package.py
          sha256sum dist/MXM_M6_PREOPEN_SUPPLEMENT_PYDROID_PACKAGE.zip
      - name: Upload 09:30 pre-open supplement Pydroid package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_M6_PREOPEN_SUPPLEMENT_PYDROID_PACKAGE
          path: dist/MXM_M6_PREOPEN_SUPPLEMENT_PYDROID_PACKAGE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build deterministic Stage-B historical-margin Pydroid package
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/build_m6_stage_b_margin_history_pydroid_package.py
          sha256sum dist/MXM_M6_STAGE_B_MARGIN_HISTORY_PYDROID_PACKAGE.zip
      - name: Upload Stage-B historical-margin Pydroid package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_M6_STAGE_B_MARGIN_HISTORY_PYDROID_PACKAGE
          path: dist/MXM_M6_STAGE_B_MARGIN_HISTORY_PYDROID_PACKAGE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build deterministic competition broker-universe capture package
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/build_competition_broker_universe_capture_package.py
          sha256sum dist/MXM_COMPETITION_BROKER_UNIVERSE_CAPTURE_V2.zip
      - name: Upload competition broker-universe capture package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_COMPETITION_BROKER_UNIVERSE_CAPTURE_V2
          path: dist/MXM_COMPETITION_BROKER_UNIVERSE_CAPTURE_V2.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build deterministic broad-frontier M5 capture package
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/build_competition_frontier_data_capture_package.py
          sha256sum dist/MXM_COMPETITION_FRONTIER_WAVE_01_V2_M5_CAPTURE_PACKAGE.zip
      - name: Upload broad-frontier M5 capture package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_COMPETITION_FRONTIER_WAVE_01_V2_M5_CAPTURE_PACKAGE
          path: dist/MXM_COMPETITION_FRONTIER_WAVE_01_V2_M5_CAPTURE_PACKAGE.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build deterministic ultra-fast capture package
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/build_competition_ultra_fast_capture_package.py
          sha256sum dist/MXM_COMPETITION_ULTRA_FAST_CAPTURE_PACKAGE_V4.zip
      - name: Upload ultra-fast capture package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_COMPETITION_ULTRA_FAST_CAPTURE_PACKAGE_V4
          path: dist/MXM_COMPETITION_ULTRA_FAST_CAPTURE_PACKAGE_V4.zip
          if-no-files-found: error
          retention-days: 30
