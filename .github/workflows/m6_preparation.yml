name: m6-preparation
on:
  push:
    branches:
      - m6-prep-materialization-20260917
      - main
  workflow_dispatch:
jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full repository unittest suite
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py' -v
