name: m6-preparation
on:
  push:
    branches:
      - m6-prep-materialization-20260917
      - competition-performance-v1-20260921
      - forensic-stabilization-20260922
      - c012-corrected-stage-b-20260922
      - c012-stage-b-persist-staging-20260922
      - performance-research-v3-20260922
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: m6-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Android-safe M6 runtime
        run: |
          python -m pip install --only-binary=:all: --no-deps -r tools/requirements-m6-capture.txt
      - name: Compile actual Pydroid runtime files
        run: python -m py_compile M6_CAPTURE_RUN.py M6_COST_EVIDENCE_RUN.py M6_PREOPEN_SUPPLEMENT_RUN.py M6_STAGE_B_MARGIN_HISTORY_RUN.py COMPETITION_BROKER_UNIVERSE_CAPTURE_RUN.py COMPETITION_FRONTIER_DATA_CAPTURE_RUN.py SESSION_GAP_SIX_PANEL_OUTER_CAPTURE_RUN.py C031_STRUCTURAL_EXTENSION_CAPTURE_RUN.py COMPETITION_ULTRA_FAST_CAPTURE_RUN.py research_v3/c031_structural_extension_capture.py research_v3/pydroid_c031_structural_extension_launcher.py tools/build_c031_structural_extension_capture_package.py competition/broker_universe_capture.py competition/pydroid_broker_universe_launcher.py competition/frontier_data_capture.py competition/pydroid_frontier_data_launcher.py competition/ultra_fast_capture.py competition/friction_costs.py competition/pydroid_ultra_fast_launcher.py competition/shared_eur200_replay.py tools/build_competition_broker_universe_capture_package.py tools/build_competition_frontier_data_capture_package.py tools/build_competition_ultra_fast_capture_package.py m6/preopen_supplement.py m6/preopen_evidence_openapi.py m6/pydroid_preopen_launcher.py m6/stage_b_margin_evidence.py m6/stage_b_margin_openapi.py m6/pydroid_stage_b_margin_launcher.py m6/pydroid_launcher.py m6/pydroid_cost_launcher.py m6/pydroid_oauth.py m6/pydroid_symbol_mapping.py m6/broker_product_identity.py m6/causal_conversion.py m6/session_replay.py m6/tier1_candidate_replay.py m6/cost_evidence.py m6/cost_evidence_openapi.py m6/ctrader_capture.py m6/_ctrader_capture_base.py m6/ctrader_openapi.py m6/ctrader_transport.py m6/ctrader_proto/OpenApiCommonModelMessages_pb2.py m6/ctrader_proto/OpenApiCommonMessages_pb2.py m6/ctrader_proto/OpenApiModelMessages_pb2.py m6/ctrader_proto/OpenApiMessages_pb2.py
      - name: No-credential Android-safe runtime preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("m6_bootstrap_ci", Path("M6_CAPTURE_RUN.py"))
          bootstrap = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bootstrap)
          status = bootstrap.runtime_dependency_status()
          assert status["ready"] is True, status
          assert status["rust_required"] is False, status
          assert status["cryptography_required"] is False, status
          print("PYDROID_PY313_BOOTSTRAP_PASS", status)

          import m6.ctrader_capture as core
          import m6.ctrader_openapi as runtime
          report = runtime.runtime_sdk_preflight()
          assert report["transport"] == "python_stdlib_ssl_socket", report
          assert report["ctrader_open_api_version"] == "PROTO_MESSAGES_VENDOR_0.9.2", report
          assert report["twisted_required"] is False, report
          assert report["pyopenssl_required"] is False, report
          assert report["cryptography_required"] is False, report
          assert report["rust_required"] is False, report
          assert report["network_connection_attempted"] is False, report
          assert report["credentials_used"] is False, report
          assert 4.7 < core.HISTORICAL_TARGET_RPS < 4.8
          print("RUNTIME_PREFLIGHT_PASS", report)
          PY
      - name: Stage-B historical-margin no-credential preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from m6.pydroid_stage_b_margin_launcher import local_preflight
          report = local_preflight()
          assert report["network_connection_attempted"] is False, report
          assert report["credentials_used"] is False, report
          assert report["orders_permitted"] is False, report
          assert report["account_mutation_permitted"] is False, report
          assert report["targets"] == {"US500": 127, "NAS100": 126}, report
          print("STAGE_B_MARGIN_PREFLIGHT_PASS", report)
          PY
      - name: Competition broker-universe no-credential preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from competition.pydroid_broker_universe_launcher import local_preflight
          from competition.broker_universe_capture import FEASIBLE,INFEASIBLE,UNRESOLVED,classify_direction,directional_summary
          report = local_preflight()
          assert report["network_connection_attempted"] is False, report
          assert report["credentials_used"] is False, report
          assert report["orders_permitted"] is False, report
          assert report["account_mutation_permitted"] is False, report
          assert classify_direction(199.0, True) == FEASIBLE
          assert classify_direction(201.0, True) == INFEASIBLE
          assert classify_direction(10.0, False) == INFEASIBLE
          assert classify_direction(None, True) == UNRESOLVED
          assert directional_summary(FEASIBLE, INFEASIBLE) == "BUY_ONLY"
          print("COMPETITION_BROKER_UNIVERSE_PREFLIGHT_PASS", report)
          PY
      - name: Competition broad-frontier M5 no-credential preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from competition.pydroid_frontier_data_launcher import local_preflight
          report = local_preflight()
          assert report["symbols"] == 16, report
          assert report["resolution"] == "M5", report
          assert report["network_connection_attempted"] is False, report
          assert report["credentials_used"] is False, report
          assert report["orders_permitted"] is False, report
          assert report["account_mutation_permitted"] is False, report
          assert report["economic_outcomes_opened"] is False, report
          print("COMPETITION_FRONTIER_M5_PREFLIGHT_PASS", report)
          PY
      - name: Six-panel independent outer no-credential preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from research_v3.pydroid_session_gap_six_panel_outer_launcher import local_preflight
          r=local_preflight()
          assert r["symbols"] == 6, r
          assert r["resolution"] == "M5", r
          assert r["outer_interval"] == {"start_utc":"2026-03-30T00:00:00Z","end_utc":"2026-07-19T23:59:59Z"}, r
          assert r["disjoint"] is True, r
          assert r["network_connection_attempted"] is False, r
          assert r["credentials_used"] is False, r
          assert r["orders_permitted"] is False, r
          assert r["account_mutation_permitted"] is False, r
          assert r["outer_outcome_opened"] is False, r
          assert r["economic_outcomes_opened"] is False, r
          assert r["v2_attempts_consumed"] == 0, r
          print("SIX_PANEL_OUTER_PREFLIGHT_PASS", r)
          PY
      - name: C031 structural-extension M5 no-credential preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
