          assert report["rate_limit_retry_after_honored"] is True, report
          assert report["rate_limit_retry_budget"] == 8, report
          assert report["stage_a_lower_boundary_overfetch_clipped"] is True, report
          assert report["checkpoint_v5_reusable"] is True, report
          print("COMPETITION_ULTRA_FAST_PREFLIGHT_PASS", report)
          PY
      - name: Validate authoritative repository invariants
        run: PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/validate_authoritative_promotion.py
      - name: Full repository unittest suite on Python 3.13
        run: PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python -m unittest discover -s tests -p 'test_*.py' -v
