name: MXM owner-private decision readback saved Pepperstone numerical results
on:
  push:
    branches: [performance-research-v3-20260922]
    paths:
      - research_core_v4/pepperstone_decision_readback_20261012_v1/EXECUTION_V1.json
permissions:
  contents: write
concurrency:
  group: mxm-owner-private-decision-readback-20261012
  cancel-in-progress: false
jobs:
  extract-decision-aggregates-only:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned existing dependencies
        run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Pure synthetic readback preflight
        run: |
          python3 -m py_compile research_core_v4/pepperstone_decision_readback_20261012_v1/runner_v1.py
          python3 -m research_core_v4.pepperstone_decision_readback_20261012_v1.runner_v1 --selftest
      - name: Extract already saved numerical results to existing encrypted private relay
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 3145728
          timeout --signal=TERM 1250 python3 -m research_core_v4.pepperstone_decision_readback_20261012_v1.runner_v1
