name: MXM delegated BC sealed runtime
run-name: MXM delegated BC ${{ inputs.command }} ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [continue, bootstrap, revoke]
        default: continue
      source_rule_id:
        description: Native exact source seal id; bootstrap only
        type: string
        required: false
permissions: {}
concurrency:
  group: mxm-active-single-delegated-issuer
  cancel-in-progress: false
jobs:
  delegated-issuer:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref_name == 'mxm-o04-successor-code-bc-v1' && github.run_attempt == 1
    environment: mxm-p0-successor-issuer-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, actions: read}
    outputs:
      next: ${{ steps.execute.outputs.next }}
      next_after: ${{ steps.execute.outputs.next_after }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Locked decoder dependencies before isolated credential process
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - id: execute
        name: Native delegated source admission, App CAS, encrypted worker and cold recovery
        run: python3 -m research_core_v4.delegated_bc_20261019.native
        env:
          GH_TOKEN: ${{ github.token }}
          BC_COMMAND: ${{ inputs.command }}
          BC_SOURCE_RULESET_ID: ${{ inputs.source_rule_id }}
          SUCCESSOR_APP_PRIVATE_KEY: ${{ secrets.SUCCESSOR_APP_PRIVATE_KEY }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-delegated-bc-${{ github.run_id }}
          path: verification/delegated-bc/
          if-no-files-found: error
  automatic-handoff:
    needs: delegated-issuer
    if: needs.delegated-issuer.outputs.next == 'continue'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {actions: write}
    steps:
      - name: Renew in a fresh workflow after expiry, no OWNER or App key here
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_AFTER: ${{ needs.delegated-issuer.outputs.next_after }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          delay=max(0,int(os.environ['NEXT_AFTER'])-int(time.time()))
          if delay>61:raise SystemExit('BC_HANDOFF_DEADLINE')
          if delay:time.sleep(delay)
          url='https://api.github.com/repos/mariancradulescu/mxm-quant-greenfield/actions/workflows/mxm-delegated-bc.yml/dispatches'
          body={'ref':'mxm-o04-successor-code-bc-v1','inputs':{'command':'continue'}}
          req=urllib.request.Request(url,data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              if r.status!=204:raise SystemExit('BC_HANDOFF_NOT_ACKNOWLEDGED')
          PY
