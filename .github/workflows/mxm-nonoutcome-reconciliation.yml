name: MXM nonoutcome reconciliation
run-name: MXM NONOUTCOME RECONCILIATION 525faecddd04f420451c4aec1ebb89b5f806a28f
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [research_programs/reconciliation/EXECUTE_NONOUTCOME.json]
permissions: {contents: read, actions: read}
concurrency:
  group: mxm-integrated-laboratory
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref_name == 'mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 525faecddd04f420451c4aec1ebb89b5f806a28f, persist-credentials: false}
      - run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Check only new accounting and diagnostic contracts
        run: python3 -m unittest research_core_v4.laboratory.test_reconcile_nonoutcome -v
      - name: Reconcile preserved data without broker requests or economic outcomes
        run: python3 -m research_core_v4.laboratory.reconcile_nonoutcome worker
        env:
          GH_TOKEN: ${{ github.token }}
          RECON_SOURCE_SHA: 525faecddd04f420451c4aec1ebb89b5f806a28f
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-nonoutcome-reconciliation-${{ github.run_id }}
          path: verification/nonoutcome-reconciliation/
          if-no-files-found: error
  durable-reconciliation:
    needs: reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 525faecddd04f420451c4aec1ebb89b5f806a28f, persist-credentials: false}
      - run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mxm-nonoutcome-reconciliation-${{ github.run_id }}
          path: verification/reconciliation-input/
      - name: Append encrypted diagnostic evidence without changing checkpoint16
        run: python3 -m research_core_v4.laboratory.reconcile_nonoutcome publish
        env:
          GH_TOKEN: ${{ github.token }}
          RECON_SOURCE_SHA: 525faecddd04f420451c4aec1ebb89b5f806a28f
