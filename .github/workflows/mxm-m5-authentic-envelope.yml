name: MXM preserved Pepperstone M5 nonoutcome price envelope
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-m5-authentic-envelope.yml
      - research_core_v4/laboratory/m5_authentic_envelope.py
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: mxm-integrated-laboratory
  cancel-in-progress: false
jobs:
  native-preserved-m5-envelopes:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: mxm-r3-custody-v1
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Use exact locked dependencies and nonsecret causal geometry check
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          python3 -m research_core_v4.laboratory.m5_authentic_envelope --selftest
      - name: Read exact original 100 encrypted M5 assets inside existing private custody
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          python3 -m research_core_v4.laboratory.m5_authentic_envelope --protected-output verification/mxm-preserved-m5-envelope
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: mxm-authentic-m5-movement-envelope
          path: verification/mxm-preserved-m5-envelope/receipt.json
          if-no-files-found: error
          retention-days: 30
