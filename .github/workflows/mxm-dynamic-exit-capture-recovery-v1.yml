name: MXM saved-entry causal dynamic exit diagnostic tick envelope recovery V1
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/dynamic_exit_diagnostic_v1/CAPTURE_RECOVERY_EXECUTION_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-dynamic-exit-capture-recovery-v1
  cancel-in-progress: false
jobs:
  causal-exits:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Verify causal exit chronology and fail-closed cash accounting
        run: python3 -m unittest -q research_core_v4.dynamic_exit_diagnostic_v1.test_v3
      - name: Saved native sources and bounded historical BID ASK exit diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 3145728
          timeout --signal=TERM 3800 python3 -m research_core_v4.dynamic_exit_diagnostic_v1.runner_v3
