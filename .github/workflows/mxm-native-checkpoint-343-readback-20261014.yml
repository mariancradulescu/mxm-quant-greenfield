name: MXM checkpoint 343 independent read-only forensic proof
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [.github/workflows/mxm-native-checkpoint-343-readback-20261014.yml]
permissions:
  contents: read
jobs:
  verify_checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Independent decrypt, hash validation, and no-resend mask test
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python3 - <<'PY'
          import os,json,pathlib,tempfile,hashlib
          from research_core_v4.full_native_frontier_20261014_v1 import runner_v1 as v1
          from research_core_v4.critical_frontier_repair_20261014_v2 import storage_v2 as storage,archive_v2 as ar
          from research_core_v4.critical_frontier_repair_20261014_v2.preserve_stop_v2 import api
          E=v1.E
          with tempfile.TemporaryDirectory(prefix='mxm-owner-343-forensic-',dir=os.environ['RUNNER_TEMP']) as td:
           tmp=pathlib.Path(td)
           key,fp=E.w.old._private_key_from_secret(tmp)
           assert fp==E.w.old.FP, 'OWNER_KEY_FINGERPRINT_MISMATCH'
           store=storage.RotatingStore(os.environ['GITHUB_SHA'],key,E.a.ROOT/E.w.old.PUBLIC_KEY,tmp)
           anchor=json.loads(store.anchor['body'])
           assert anchor['generation']==343,'GENERATION_CHANGED_ABORT'
           assert anchor['state']=='STOP_EXPLICIT_OPERATIONAL_LIMIT','STOP_STATE_CHANGED_ABORT'
           assert anchor['identities_evaluated']==36 and anchor['remaining']==1526,'CHECKPOINT_PROGRESS_CHANGED'
           journal=anchor['current_journal']
           asset=next(x for x in api('releases/'+str(journal['release_id']))['assets'] if x['id']==journal['id'])
           assert asset['digest']=='sha256:'+journal['ciphertext_sha256'],'CIPHERTEXT_SHA_MISMATCH'
           assert asset['size']==journal['size'],'ASSET_SIZE_MISMATCH'
           raw_manifest=store.restore(journal)
           assert raw_manifest['generation']==343,'JOURNAL_GENERATION_MISMATCH'
           db=ar.dbopen(tmp/'verify.sqlite')
           storage.track(db)
           state=storage.restore(db,store)
           assert state['generation']==343 and state['identity_cursor']==36,'RESTORE_IDENTITY_DRIFT'
           failures=[]
           for meta in state.get('increments_v2',[]):
            delta=store.restore(meta)
            for rec in delta.get('raw',[]):
             if 'exception_class' in rec or rec.get('state')=='PROVIDER_ERROR':
              req=rec['request']
              row=db.execute('SELECT z FROM wire WHERE s=? AND k=? AND a=? AND b=?',(req['s'],req['k'],req['a'],req['b'])).fetchone()
              assert row is not None,'MISSING_WIRE_FAILURE_LEDGER'
              assert not ar.actionable(db,req['s'],req['k'],req['a'],req['b']),'UNCERTAIN_WIRE_CAN_BE_DUPLICATED'
              failures.append({'kind':req['k'],'symbol_id':req['s'],'from_ms':req['a'],'to_ms':req['b'],'exception_class':rec.get('exception_class'),'provider_code':rec.get('provider_code'),'wire_state':row[0],'blocked_from_resend':True})
           assert any(x.get('exception_class') for x in failures),'FAILURE_RECEIPT_NOT_FOUND'
           print(json.dumps({'state':'CHECKPOINT_343_INDEPENDENT_READBACK_PASS','generation':343,'journal_ciphertext_sha256':journal['ciphertext_sha256'],'journal_canonical_sha256':journal['canonical_sha256'],'asset_id':journal['id'],'release_id':journal['release_id'],'identity_cursor':state['identity_cursor'],'remaining':len(state['eligible'])-state['identity_cursor'],'bars':db.execute('SELECT count(*) FROM bar').fetchone()[0],'ticks':db.execute('SELECT count(*) FROM tick').fetchone()[0],'coverage_states':ar.proof_table(db),'failures':failures,'recorded_errors':state['errors'][-3:],'uncertain_wire_count':len(state['uncertain_wire']),'broker_requests':0,'orders':0,'cloud_deployment':False},sort_keys=True),flush=True)
          PY
