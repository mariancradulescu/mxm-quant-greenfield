name: Operational V2 support-only depth machine gates
on:
  push:
    branches: [audit-operational-v2-depth-preflight-v1, audit-operational-v2-depth-stage-v1]
permissions:
  contents: write
concurrency:
  group: operational-v2-support-depth-single-writer
  cancel-in-progress: false
jobs:
  readonly-depth:
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      EXACT_TARGET: ${{ github.event.before }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
    steps:
      - run: python -m pip install numpy==2.3.5 protobuf==5.29.5
      - name: Exact hash-bound source and nonoutcome protocol allowlist; no checkout
        run: |
          python - <<'PYCODE'
          import os,json,pathlib,hashlib,urllib.request
          repo='mariancradulescu/mxm-quant-greenfield';ref=os.environ['EXACT_TARGET'];freeze='research_core_v4/state/STRICT_PREOUTCOME_V2_CURRENT_WAVE_OPERATIONAL_INFERENCE_V2_DEPTH_IMPLEMENTATION_FREEZE_V1.json';trace=[]
          def fetch(p,h=None):
           assert p.endswith(('.py','.json')) and not p.startswith('support_only_v1/')
           b=urllib.request.urlopen('https://raw.githubusercontent.com/'+repo+'/'+ref+'/'+p,timeout=90).read();digest=hashlib.sha256(b).hexdigest()
           if h:assert digest==h,p
           q=pathlib.Path(p);q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(b);trace.append({'ref':ref,'path':p,'sha256':digest});return b
          f=json.loads(fetch(freeze,'8ea44387cc73df510576d03892cd6de977edf6bf209d1518d8b20f47458af1b4'))
          for p,h in f['files_sha256'].items():fetch(p,h)
          if os.environ['GITHUB_REF_NAME']=='audit-operational-v2-depth-stage-v1':
           p='research_core_v4/state/STRICT_PREOUTCOME_V2_CURRENT_WAVE_OPERATIONAL_INFERENCE_V2_NEXT_STAGE_AUTHORITY_V1.json';a=json.loads(fetch(p));assert a['exact_implementation_freeze_sha256']=='8ea44387cc73df510576d03892cd6de977edf6bf209d1518d8b20f47458af1b4' and a['stage'] in range(1,7)
           with open(os.environ['GITHUB_ENV'],'a') as out:out.write('DEPTH_STAGE='+str(a['stage'])+'\n')
          pathlib.Path('depth_read_trace.json').write_text(json.dumps(trace,sort_keys=True,indent=2))
          print('EXACT_TARGET='+ref+' INITIAL_BROKER_REQUESTS=0')
          PYCODE
      - name: Offline read-only and immutable power software checks
        run: PYTHONPATH=. python research_core_v4/operational_v2/preflight.py --software
      - name: Machine preflight only; never broker authentication
        if: github.ref_name == 'audit-operational-v2-depth-preflight-v1'
        run: PYTHONPATH=. python research_core_v4/operational_v2/preflight.py --output preflight.json
      - name: Exactly one authorized next block; synthetic power after durable mask freeze
        if: github.ref_name == 'audit-operational-v2-depth-stage-v1'
        run: PYTHONPATH=. python research_core_v4/operational_v2/depth.py --stage "$DEPTH_STAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-v2-depth-ledger
          path: |
            depth_read_trace.json
            preflight.json
