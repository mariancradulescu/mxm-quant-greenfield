name: MXM broker-wide native NET cost and frequency discovery V1
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/cost_frequency_discovery_v1/EXECUTION_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-cost-frequency-discovery-v1
  cancel-in-progress: false
jobs:
  authentic-cost-frequency:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Verify causal labels, separate counters, FX liabilities and fixed capital
        run: python3 -m unittest -q research_core_v4.cost_frequency_discovery_v1.test_v1
      - name: Native cost-first acquisition and distinct NET DEVELOPMENT
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 3145728
          timeout --signal=TERM 14500 python3 -m research_core_v4.cost_frequency_discovery_v1.runner_v1
