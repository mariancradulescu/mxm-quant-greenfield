name: MXM final report OWNER ciphertext readback
on:
  push:
    branches: [mxm-final-redress-report-20261014]
    paths: [.github/workflows/mxm-final-report-owner-readback-20261014-v1.yml]
permissions: {contents: read}
concurrency:
  group: mxm-final-report-owner-readback-20261014-v1
  cancel-in-progress: false
jobs:
  report_readback:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 1}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Verify newly archived report using existing OWNER key; no broker IO
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,tempfile,base64,gzip,hashlib
          from research_core_v4.asymmetric_recovery_v4_gate import _private_key_from_secret
          from research_core_v4 import master1576_screen_v2 as crypto
          p=pathlib.Path('research_core_v4/final_recovery_20261014_v1/report')
          meta=json.loads((p/'REPORT_ARCHIVE_V1.json').read_text());blob=base64.b64decode((p/'complete-final-report-owner.mxmenc.b64').read_bytes())
          assert hashlib.sha256(blob).hexdigest()==meta['ciphertext_sha256'] and len(blob)==meta['ciphertext_size'],'REPORT_CIPHER'
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as td:
           tmp=pathlib.Path(td);key,fp=_private_key_from_secret(tmp);assert fp==meta['owner_spki_sha256'],'OWNER_KEY'
           raw=gzip.decompress(crypto.decrypt_package(blob,private_key=key,expected_public_spki_sha256=fp,temp_parent=tmp));assert hashlib.sha256(raw).hexdigest()==meta['canonical_sha256'],'REPORT_CANONICAL_SHA'
           report=crypto.strict_json(raw);assert crypto.canonical(report)==raw,'REPORT_CANONICAL_BYTES'
           assert hashlib.sha256(base64.b64decode(report['report_bytes_b64'])).hexdigest()==meta['report_sha256'],'REPORT_MEMBER_SHA'
           assert report['source_head']==meta['source_head']=='9c5f9f1b7f2d73f98bb188a2651fd9a3c00df6b9','EXECUTION_SOURCE'
           print(json.dumps({'schema':'mxm.complete.report.owner.readback.v1','OWNER_READBACK_SUCCESS':True,'report_commit':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'source_head':meta['source_head'],'canonical_sha256':meta['canonical_sha256'],'ciphertext_sha256':meta['ciphertext_sha256'],'report_sha256':meta['report_sha256'],'broker_requests':0,'new_numeric_research':False,'orders':0,'OWNER_private_key_export':False},sort_keys=True),flush=True)
          PY
