name: MXM P0 successor A explicit OWNER critical gate NO BOOTSTRAP
on:
  push:
    branches: [mxm-o04-successor-code-a-v1]
  workflow_dispatch:
    inputs:
      bundle:
        description: Exact OWNER B bundle, empty means A reception only
        required: false
        type: string
permissions: {contents: read, actions: read}
jobs:
  exact-manifest:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.actor_id == '322088485' && github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || github.sha == github.event.after)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - id: plan
        run: python3 -m research_core_v4.p0_successor_a_20261017.gate plan
        env:
          SUCCESSOR_BUNDLE: ${{ inputs.bundle }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-successor-a-critical-manifest
          path: verification/successor-a/
  owner-critical:
    needs: exact-manifest
    environment: mxm-p0-owner-critical-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify explicit native OWNER review; cannot bootstrap or issue tokens
        run: python3 -m research_core_v4.p0_successor_a_20261017.gate verify
        env:
          GH_TOKEN: ${{ github.token }}
          CRITICAL_MANIFEST: ${{ needs.exact-manifest.outputs.manifest }}
  successor-issuer:
    needs: [exact-manifest, owner-critical]
    if: github.event_name == 'workflow_dispatch' && inputs.bundle != ''
    environment: mxm-p0-successor-issuer-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify native grant, mint internally, atomic publish, revoke
        run: python3 -m research_core_v4.p0_successor_a_20261017.issuer
        env:
          GH_TOKEN: ${{ github.token }}
          SUCCESSOR_BUNDLE: ${{ inputs.bundle }}
          SUCCESSOR_APP_PRIVATE_KEY: ${{ secrets.SUCCESSOR_APP_PRIVATE_KEY }}
