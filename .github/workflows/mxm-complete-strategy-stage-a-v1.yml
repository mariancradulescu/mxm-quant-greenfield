name: MXM complete strategy economic feasibility Stage A V1
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/complete_strategy_frontier_v1/STAGE_A_EXECUTION_V1.json]
permissions:
  contents: write
jobs:
  native-cost-feasibility:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - run: python3 -m unittest -q research_core_v4.complete_strategy_frontier_v1.test_stage_a_v1
      - name: Existing authenticated data economic hurdle calculation
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m research_core_v4.complete_strategy_frontier_v1.stage_a_v1
