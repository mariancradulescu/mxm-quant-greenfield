name: MXM Read Only Copilot Quota Snapshot
# Observe category keys returned by the current Actions credential.
on:
  push:
    branches: [main]
    paths: [".github/workflows/copilot-quota-snapshot.yml"]
  workflow_dispatch:
permissions:
  contents: write
  copilot-requests: write
concurrency:
  group: mxm-autonomous-runtime-v2-performance-research-v3-20260922
  cancel-in-progress: false
jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-research-v3-20260922
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned SDK runtime
        run: |
          python -m pip install github-copilot-sdk==1.0.14
          python -m copilot download-runtime
      - name: Read account quota without model request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: python -m research_v3.copilot_quota_snapshot --root . --run-id "$GITHUB_RUN_ID"
      - name: Persist observed quota
        run: |
          git config user.name "mxm-runtime-v2[bot]"
          git config user.email "mxm-runtime-v2@users.noreply.github.com"
          git add research_v3/ai_director/COPILOT_ACCOUNT_QUOTA_V1.json
          git commit -m "[skip ci] Record read-only Copilot account quota snapshot"
          git push origin HEAD:refs/heads/performance-research-v3-20260922
