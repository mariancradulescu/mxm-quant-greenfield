name: MXM authentic W37 EURUSD GBPUSD original BIDASK monetary spread observations
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/laboratory/w37_authentic_spread_cash_20261031.py
      - .github/workflows/mxm-authentic-w37-spread-cash-20261031.yml
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-authentic-w37-spread-cash-20261031.yml
permissions: {contents: read}
concurrency:
  group: mxm-w37-original-spread-observation-first-20261031
  cancel-in-progress: false
jobs:
  source-blind-monetary-and-causal-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Test strict-prior quote, stale/ambiguous rejection and actual USD to EUR price scale
        run: |
          python3 -m research_core_v4.laboratory.w37_authentic_spread_cash_20261031 selftest
  exact-original-spread-research:
    if: github.event_name == 'push' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    needs: source-blind-monetary-and-causal-tests
    runs-on: ubuntu-24.04
    environment: mxm-r3-custody-v1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d2fae5641b759b1c8c24161d83d62d39e104eafd
          path: .sealed-chronology-source
          persist-credentials: false
      - name: Install existing pinned native decode dependencies and restore the TWO preserved originals offline
        run: |
          set -eu
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          mkdir -p "${RUNNER_TEMP}/mxm-w37-spread"
          python3 -m research_core_v4.laboratory.durable_week_chronology --out "${RUNNER_TEMP}/mxm-w37-spread/eur-original"
          python3 -m research_core_v4.laboratory.durable_gbpusd_week37_chronology --out "${RUNNER_TEMP}/mxm-w37-spread/gbp-original"
          cp research_core_v4/laboratory/week_chronology_reception.py research_core_v4/laboratory/usd_pair_native_reception.py research_core_v4/laboratory/usd_pair_alignment.py .sealed-chronology-source/research_core_v4/laboratory/
      - name: Decrypt and verify original native wire/source identities in existing R3 custody only
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          cd .sealed-chronology-source
          python3 -m research_core_v4.laboratory.usd_pair_native_reception export EURUSD "${RUNNER_TEMP}/mxm-w37-spread/eur-original/capture.mxmenc" "${RUNNER_TEMP}/mxm-w37-spread/eur.ndjson"
          python3 -m research_core_v4.laboratory.usd_pair_native_reception export GBPUSD "${RUNNER_TEMP}/mxm-w37-spread/gbp-original/capture.mxmenc" "${RUNNER_TEMP}/mxm-w37-spread/gbp.ndjson"
      - name: Measure same-week historical source-time spread in EUR for 1000 reference units, no alpha trial
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.w37_authentic_spread_cash_20261031 original --eur "${RUNNER_TEMP}/mxm-w37-spread/eur.ndjson" --gbp "${RUNNER_TEMP}/mxm-w37-spread/gbp.ndjson" --out verification/w37-authentic-spread-20261031/public.json
      - name: Preserve only one bounded public aggregate, never quote rows or keys
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-actual-w37-spread-cost-eur-${{ github.run_id }}
          path: verification/w37-authentic-spread-20261031/public.json
          if-no-files-found: error
          retention-days: 90
