name: MXM B-E original annual JPY source envelope one-first recovery EUR200 CSharp
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/laboratory/mxm_be_jpy_consensus_annual_funded_20261101.py
      - .github/workflows/mxm-be-jpy-annual-one-recovery-20261101.yml
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [.github/workflows/mxm-be-jpy-annual-one-recovery-20261101.yml]
permissions: {contents: read, actions: read}
concurrency: {group: mxm-be-jpy-original-one-recovery-20261101, cancel-in-progress: false}
jobs:
  ciphertext-envelope-offline-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify seven original encrypted chunks, exact original ciphertext SHA and corrected Base64
        run: |
          set -eu
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          python3 -m research_core_v4.laboratory.mxm_be_jpy_consensus_annual_funded_20261101 selftest
          python3 - <<'PY'
          import pathlib,base64,hashlib
          from research_core_v4.laboratory import native_h1_csharp_annual_receipt as src
          path=src.CIPHER_DIR
          pts=sorted(path.glob("chunk-*.b64"))
          assert len(pts)==7
          cipher=b''.join(base64.b64decode(x.read_text()) for x in pts)
          assert hashlib.sha256(cipher).hexdigest()==src.EXPECTED_CIPHER_SHA
          print('EXACT_ORIGINAL_ENCRYPTED_SOURCE_PREDECRYPT_SHA256_VALID')
          PY
      - name: Compile the unchanged shared native CSharp EUR200 reference and old receipt regression
        run: |
          set -eu
          dotnet build research_core_v4/laboratory/csharp/portfolio_policy/MxmPortfolioPolicy.csproj -c Release
          dotnet build research_core_v4/laboratory/csharp/shared_account/MxmSharedAccount.csproj -c Release
          python3 -m unittest research_core_v4.laboratory.test_portfolio_programme -v
  one-guarded-original-recovery:
    needs: ciphertext-envelope-offline-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Compile exactly the existing native EUR200 shared account
        run: |
          set -eu
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          dotnet build research_core_v4/laboratory/csharp/shared_account/MxmSharedAccount.csproj -c Release
      - name: Prove original failed before source and did not publish any economic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 -m research_core_v4.laboratory.mxm_be_jpy_consensus_annual_funded_20261101 recover-admit
      - name: Authenticate annual originals and execute ONE actual causal CSharp EUR200 scenario set
        id: research
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.mxm_be_jpy_consensus_annual_funded_20261101 run
      - name: Cold replay-free original independent cash ledger SHA custody proof
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.mxm_be_jpy_consensus_annual_funded_20261101 cold
      - name: Publish public aggregated funding verdict and encrypted original only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-be-jpy-annual-one-recovery-${{ github.run_id }}
          path: verification/mxm-be-jpy-consensus-annual-20261101/
          if-no-files-found: warn
          retention-days: 90
