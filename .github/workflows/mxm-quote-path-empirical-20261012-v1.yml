name: MXM fixed quote path empirical DEVELOPMENT 20261012 V1
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/quote_path_execution_20261012_v1/EXECUTION_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-quote-path-empirical-20261012-v1
  cancel-in-progress: false
jobs:
  fixed-saved-corpus-pilot:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned existing dependencies
        run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: Immutable feature and ledger synthetic tests
        run: python3 -m unittest -q research_core_v4.quote_path_order_20261012_v1.test_v1 research_core_v4.quote_path_execution_20261012_v1.test_integration_v1
      - name: Single authenticated saved-corpus numerical evaluation
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 3145728
          timeout --signal=TERM 2100 python3 -m research_core_v4.quote_path_execution_20261012_v1.runner_v1
