name: MXM full native frontier durable autonomous continuation
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/full_native_frontier_20261014_v1/EXECUTION_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-full-native-frontier-20261014-v1
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      done: ${{ steps.engine.outputs.done }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - run: dotnet build research_core_v4/full_native_frontier_20261014_v1/csharp/Replay.csproj -c Release --nologo
      - run: dotnet build research_core_v4/full_native_frontier_20261014_v1/csharp/NativeCompatible.csproj -c Release --nologo
      - run: python3 -m unittest -v research_core_v4.full_native_frontier_20261014_v1.test_v1
      - name: Durable authenticated native frontier engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: timeout --signal=TERM 3900 python3 -m research_core_v4.full_native_frontier_20261014_v1.runner_v1
