name: MXM P0 ordinary fault isolation guard
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [.github/workflows/mxm-integrated-p0.yml, .github/workflows/mxm-p0-ordinary-safety-ci.yml, verification/P0_FAULT_ISOLATION_GUARD.py]
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [.github/workflows/mxm-integrated-p0.yml, .github/workflows/mxm-p0-ordinary-safety-ci.yml, verification/P0_FAULT_ISOLATION_GUARD.py]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  static-boundary:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Prove ordinary path cannot inject faults
        run: python3 verification/P0_FAULT_ISOLATION_GUARD.py
