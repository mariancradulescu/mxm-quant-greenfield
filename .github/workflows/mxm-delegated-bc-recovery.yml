name: MXM delegated campaign ordinary recovery
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: mxm-delegated-bc-recovery-dispatcher
  cancel-in-progress: false
jobs:
  ordinary-recovery:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read, actions: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ca99a5ad609a301fef8bd3efe0e902fe3fbe905b
          persist-credentials: false
      - name: Recover missed ordinary handoff from protected Git; never bootstrap
        run: python3 -m research_core_v4.delegated_campaign_20261019.watch
        env:
          GH_TOKEN: ${{ github.token }}
          BC_EXPECTED_SOURCE_SHA: ca99a5ad609a301fef8bd3efe0e902fe3fbe905b
