name: MXM laboratory completion V5 finite program
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [research_core_v4/laboratory_completion_20261019_v2/EXECUTE_ONCE.json]
permissions: {contents: read}
concurrency:
  group: mxm-laboratory-completion-v5-once
  cancel-in-progress: false
jobs:
  recovery:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      ciphertext_sha256: ${{ steps.execute.outputs.ciphertext_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9e2ac4b4d8bba8c13f0df8e9407f1b3d9a6a9db9
          persist-credentials: false
      - name: Existing locked dependencies
        run: >-
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: New scientific and checkpoint controls only
        run: python3 -m unittest research_core_v4.laboratory_completion_20261019_v2.test_runtime_v2 -v
      - id: execute
        name: recovery from exact authenticated checkpoint
        run: python3 -m research_core_v4.laboratory_completion_20261019_v2.runtime recovery
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          LAB_SOURCE_SHA: 9e2ac4b4d8bba8c13f0df8e9407f1b3d9a6a9db9
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-lab-v5-recovery-${{ github.run_id }}
          path: verification/laboratory-completion/recovery*
          if-no-files-found: error
          retention-days: 90
  frontier:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.event_name == 'push' && github.run_attempt == 1
    needs: recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ciphertext_sha256: ${{ steps.execute.outputs.ciphertext_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9e2ac4b4d8bba8c13f0df8e9407f1b3d9a6a9db9
          persist-credentials: false
      - name: Existing locked dependencies
        run: >-
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mxm-lab-v5-recovery-${{ github.run_id }}
          path: verification/laboratory-input/
      - id: execute
        name: frontier from exact authenticated checkpoint
        run: python3 -m research_core_v4.laboratory_completion_20261019_v2.runtime frontier
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          LAB_SOURCE_SHA: 9e2ac4b4d8bba8c13f0df8e9407f1b3d9a6a9db9
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          LAB_PARENT_SHA256: ${{ needs.recovery.outputs.ciphertext_sha256 }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-lab-v5-frontier-${{ github.run_id }}
          path: verification/laboratory-completion/frontier*
          if-no-files-found: error
          retention-days: 90
  admission:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.event_name == 'push' && github.run_attempt == 1
    needs: frontier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ciphertext_sha256: ${{ steps.execute.outputs.ciphertext_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9e2ac4b4d8bba8c13f0df8e9407f1b3d9a6a9db9
          persist-credentials: false
      - name: Existing locked dependencies
        run: >-
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mxm-lab-v5-frontier-${{ github.run_id }}
          path: verification/laboratory-input/
      - id: execute
        name: admission from exact authenticated checkpoint
        run: python3 -m research_core_v4.laboratory_completion_20261019_v2.runtime admission
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          LAB_SOURCE_SHA: 9e2ac4b4d8bba8c13f0df8e9407f1b3d9a6a9db9
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          LAB_PARENT_SHA256: ${{ needs.frontier.outputs.ciphertext_sha256 }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-lab-v5-admission-${{ github.run_id }}
          path: verification/laboratory-completion/admission*
          if-no-files-found: error
          retention-days: 90
