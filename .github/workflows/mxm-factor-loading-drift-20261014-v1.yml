name: MXM one factor loading drift economic DEVELOPMENT pilot
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/factor_loading_drift_20261014_v1/EXECUTION_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-factor-loading-drift-20261014-v1
  cancel-in-progress: false
jobs:
  factor-loading-economic-pilot:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Existing pinned numerical and crypto dependencies
        run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: New causal loading and accounting tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python3 -m unittest -v research_core_v4.factor_loading_drift_20261014_v1.test_v1
      - name: One frozen accepted-corpus pilot and verified OWNER encryption
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 4194304
          timeout --signal=TERM 3500 python3 -m research_core_v4.factor_loading_drift_20261014_v1.runner_v1
