name: Persist Opened Wave05 Outcomes
on:
  push:
    branches:
      - tmp-wave05-source-export-20260923

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact authoritative recovery head
        uses: actions/checkout@v4
        with:
          ref: ff65de81535b702782a6d9b736f8bf88eb90641d
          fetch-depth: 0
      - name: Fail closed if authoritative branch advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin performance-research-v3-20260922
          test "$(git rev-parse origin/performance-research-v3-20260922)" = "ff65de81535b702782a6d9b736f8bf88eb90641d"
          test "$(git rev-parse HEAD)" = "ff65de81535b702782a6d9b736f8bf88eb90641d"
      - name: Persist already-opened Wave05 artifacts idempotently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from research_v3.persistence import persist_wave_results

          root=Path(".")
          before=json.loads((root/"CURRENT_STATE.json").read_text())
          assert before["v2_attempts_used"] == 16
          assert before["economic_outcomes_opened"] == 23
          for cid, expected in {
              "V2-C029":"5980cabc52a1cd1ca513fa356e980a613de06147609d3e1658dfa93d70e46e45",
              "V2-C030":"4de6fdf5cc8c2eab41cbfb1b9802dc41402f6663d56aca3cb3c9b52c6ffe0cf0",
          }.items():
              doc=json.loads((root/f"discovery/results/{cid}_STAGE_A_V1.json").read_text())
              assert doc["result_hash"] == expected
              assert doc["status"] == "DATA_INSUFFICIENT"

          report=persist_wave_results(
              root,
              wave_key="wave05",
              results=None,
              recorded_utc="2026-09-23T11:22:00Z",
              result_refs={
                  "V2-C029":"discovery/results/V2-C029_STAGE_A_V1.json",
                  "V2-C030":"discovery/results/V2-C030_STAGE_A_V1.json",
              },
              execution_result_ref="research_v3/WAVE_05_EXECUTION_RESULT_V1.json",
              live_equivalent_candidate_ids=["V2-C029","V2-C030"],
          )
          assert report["new_result_ids_this_invocation"] == ["V2-C029","V2-C030"]
          assert report["v2_attempts_used"] == 18
          assert report["v2_search_budget_remaining"] == 66
          assert report["economic_outcomes_opened"] == 25

          state=json.loads((root/"CURRENT_STATE.json").read_text())
          assert state["v2_attempts_used"] == 18
          assert state["v2_evaluated_identities"] == 18
          assert state["v2_search_budget_remaining"] == 66
          assert state["economic_outcomes_opened"] == 25
          assert state["stage_a_result_recorded_entries"] == 23
          assert state["discovery_result_recorded_entries"] == 23
          assert state["distinct_identity_outcomes_opened"] == 18
          assert state["global_attempts_seen"] == 34
          assert state["discovery_ledger_entries"] == 66
          assert state["performance_research_v3"]["wave05"]["candidate_own_outcomes_opened"] is True
          assert state["performance_research_v3"]["wave05"]["stage_b_extension_candidates"] == []
          assert state["protected_evidence_opened"] is False
          assert state["live_orders_authorized"] is False
          assert state["competition_start_authorized"] is False
          PY
      - name: Update durable autonomous checkpoint without claiming GREEN yet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          s=json.loads((root/"CURRENT_STATE.json").read_text())
          cp=json.loads((root/"research_v3/AUTONOMOUS_CHECKPOINT_V1.json").read_text())
          w=s["performance_research_v3"]["wave05"]
          cp.update({
              "status":"WAVE05_RESULTS_PERSISTED_PENDING_EXACT_HEAD_GREEN",
              "source_head":"ff65de81535b702782a6d9b736f8bf88eb90641d",
              "phase":s["phase"],
              "next_action":"REQUIRE_EXACT_HEAD_GREEN_THEN_CONTINUE_AUTONOMOUS_DISCOVERY",
              "ledger_tail_entry_hash":w["ledger_tail_entry_hash"],
              "accounting":{
                  "v2_attempts_used":s["v2_attempts_used"],
                  "v2_evaluated_identities":s["v2_evaluated_identities"],
                  "v2_search_budget_remaining":s["v2_search_budget_remaining"],
                  "economic_outcomes_opened":s["economic_outcomes_opened"],
                  "distinct_identity_outcomes_opened":s["distinct_identity_outcomes_opened"],
                  "stage_a_result_recorded_entries":s["stage_a_result_recorded_entries"],
                  "stage_b_current_config_economic_observations":s["stage_b_current_config_economic_observations"],
              },
              "wave05":{
                  "status":w["status"],
                  "candidate_ids":w["candidate_ids"],
                  "candidate_spec_hashes":w["candidate_spec_hashes"],
                  "outcomes_opened":True,
                  "result_hashes":w["result_hashes"],
                  "result_refs":w["result_refs"],
                  "attempts_consumed":2,
                  "persistence_additional_attempts":0,
                  "stage_b_extension_candidates":w["stage_b_extension_candidates"],
              },
              "recovery":{
                  "classification":"POST_OUTCOME_ARTIFACT_RECOVERY_NO_ECONOMIC_RERUN",
                  "authority_ref":"evidence/WAVE_05_POST_OUTCOME_RECOVERY_V1.json",
                  "economic_reexecution_performed":False,
              },
              "safety":{
                  "protected_evidence_opened":False,
                  "live_orders_authorized":False,
                  "competition_start_authorized":False,
              },
          })
          (root/"research_v3/AUTONOMOUS_CHECKPOINT_V1.json").write_text(
              json.dumps(cp,sort_keys=True,indent=2)+"\n",encoding="utf-8"
          )
          PY
      - name: Validate post-persistence repository
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/validate_authoritative_promotion.py
          PYTHONPATH=. python -m unittest -v \
            tests.test_performance_research_v3_persistence \
            tests.test_performance_research_v3_wave05_freeze \
            tests.test_current_accounting_integrity
      - name: Commit and push canonical persistence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mxm-autonomous-research"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT_STATE.json discovery/ledger.jsonl             discovery/results/V2-C029_STAGE_A_V1.json             discovery/results/V2-C030_STAGE_A_V1.json             research_v3/WAVE_05_EXECUTION_RESULT_V1.json             research_v3/AUTONOMOUS_CHECKPOINT_V1.json
          git diff --cached --check
          git commit -m "Persist opened Wave05 outcomes canonically"
          git push origin HEAD:performance-research-v3-20260922
