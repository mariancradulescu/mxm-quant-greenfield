name: MXM B-E preserved original EUR200 CSharp cold reconciliation only no model rerun
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/laboratory/mxm_be_jpy_residual_cold_only_20261101.py
      - research_core_v4/laboratory/mxm_be_jpy_residual_annual_funded_20261101.py
      - .github/workflows/mxm-be-jpy-residual-cold-only-20261101.yml
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [.github/workflows/mxm-be-jpy-residual-cold-only-20261101.yml]
permissions: {contents: read, actions: read}
concurrency: {group: mxm-be-jpy-preserved-original-cold-read-only-20261101, cancel-in-progress: false}
jobs:
  independent-no-secret-cold-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate pinned original and guarantee cold-only path, no new economic model
        run: |
          set -eu
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          python3 -m research_core_v4.laboratory.mxm_be_jpy_residual_cold_only_20261101 selftest
          python3 -m research_core_v4.laboratory.mxm_be_jpy_residual_annual_funded_20261101 selftest
  first-original-cold-only:
    needs: independent-no-secret-cold-boundary
    if: github.event_name == 'push' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Authenticate exact previous one-shot original run and failure restricted to cold reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 -m research_core_v4.laboratory.mxm_be_jpy_residual_cold_only_20261101 admit
      - name: Download ONLY the saved original encrypted CSharp ledger, no sources or economic workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          gh run download 41347641856 --repo mariancradulescu/mxm-quant-greenfield --name mxm-be-jpy-fourhour-original-41347641856 --dir verification/mxm-be-jpy-residual-annual-20261101
          python3 -m research_core_v4.laboratory.mxm_be_jpy_residual_cold_only_20261101 preflight
      - name: Decrypt saved original and independently check all three actual native EUR200 ledgers, NO model rerun
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.mxm_be_jpy_residual_annual_funded_20261101 cold
      - name: Preserve only independent readback proof and original public aggregate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-be-jpy-original-cold-only-${{ github.run_id }}
          path: |
            verification/mxm-be-jpy-residual-annual-20261101/cold.json
            verification/mxm-be-jpy-residual-annual-20261101/receipt.json
          if-no-files-found: warn
          retention-days: 90
