name: Runtime V2 Liveness Watchdog

on:
  schedule:
    # Recovery-only fallback. Normal continuation is event-driven by Sentinel.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/runtime-v2-liveness-watchdog.yml"
      - ".github/workflows/runtime-v2-liveness-sentinel.yml"
      - ".github/workflows/autonomous-research-runtime-v2.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: mxm-runtime-v2-liveness-recovery
  cancel-in-progress: true

env:
  TARGET_BRANCH: performance-research-v3-20260922

jobs:
  recovery-dispatcher:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Classify durable execution state
        id: route
        shell: bash
        run: python -m research_v3.lightweight_dispatcher classify --root . --github-output "${GITHUB_OUTPUT}"

      - name: Dispatch exactly one supervisor recovery
        if: steps.route.outputs.dispatch_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runtime-v2-liveness-sentinel.yml/dispatches" \
            -d '{"ref":"main"}'
