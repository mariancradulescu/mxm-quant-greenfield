name: Runtime V2 Liveness Watchdog — LEGACY READ ONLY

# PERMANENT LEGACY V2 READ-ONLY KILL SWITCH.
# Former watchdog; cron wakeups and sentinel dispatches have been disabled.
# Runtime V2 is preserved as historical evidence only. It must never wake itself,
# dispatch another workflow, mutate the research branch, or invoke Copilot/provider.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEGACY_V2_READ_ONLY: "1"

jobs:
  legacy-v2-read-only:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Enforce LEGACY_V2_READ_ONLY fail-closed guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LEGACY_V2_READ_ONLY:-}" != "1" ]]; then
            echo "LEGACY_V2_READ_ONLY guard missing; refusing execution." >&2
            exit 1
          fi
          echo "Runtime V2 is permanently read-only."
          echo "No branch writes, workflow dispatches, schedules, workflow_run continuation, or provider calls are authorized."
