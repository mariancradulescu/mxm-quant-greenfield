name: Runtime V2 Liveness Watchdog

# Recovery-only tool. Normal research continuation never depends on this workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: mxm-runtime-v2-liveness-recovery
  cancel-in-progress: true

env:
  TARGET_BRANCH: performance-research-v3-20260922

jobs:
  recovery-dispatcher:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Classify durable execution state
        id: route
        shell: bash
        run: python -m research_v3.lightweight_dispatcher classify --root . --github-output "${GITHUB_OUTPUT}"

      - name: Dispatch exactly one supervisor recovery
        if: steps.route.outputs.dispatch_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for state in in_progress queued; do
            runs="$(curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-runtime-v2.yml/runs?status=${state}&per_page=100")"
            if jq -e '.total_count > 0' <<< "${runs}" >/dev/null; then
              echo "Canonical research writer is already ${state}; watchdog will not create a competing writer."
              exit 0
            fi
          done
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runtime-v2-liveness-sentinel.yml/dispatches" \
            -d '{"ref":"main"}'
