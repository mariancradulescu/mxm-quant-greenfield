# probe-schema: v4-corrected-secret-reprobe-20261003
name: V4 Asymmetric Private Key Presence and Pair Probe

on:
  push:
    branches: [performance-research-v3-20260922]
    paths:
      - ".github/workflows/v4-asymmetric-private-key-probe.yml"
      - "research_core_v4/keys/MXM_V4_INPUT_BUNDLE_PUBLIC_KEY.pem"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SPKI_SHA256: "464d2429313b8a417d26e478dab32aa1fa606471db1239a9fcfc6daa3329cb11"
      MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed public key fingerprint
        run: |
          set -euo pipefail
          actual="$(openssl pkey -pubin -in research_core_v4/keys/MXM_V4_INPUT_BUNDLE_PUBLIC_KEY.pem -outform DER | sha256sum | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SPKI_SHA256"
          echo "COMMITTED_PUBLIC_KEY_FINGERPRINT_STATUS=MATCH"

      - name: Non-revealing normalized private-key presence and pair probe
        run: |
          set -euo pipefail
          if [ -z "${MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM:-}" ]; then
            echo "PRIVATE_KEY_SECRET_STATUS=ABSENT"
            echo "PRIVATE_KEY_PAIR_STATUS=NOT_TESTED"
            exit 0
          fi
          echo "PRIVATE_KEY_SECRET_STATUS=PRESENT"
          python - <<'PY'
          import base64, os, pathlib, subprocess, sys
          raw=os.environ["MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM"]
          candidates=[]
          def add(label,s):
              if s and all(s != x[1] for x in candidates):
                  candidates.append((label,s))
          add("RAW",raw)
          add("NORMALIZED_CRLF",raw.replace("\r\n","\n").replace("\r","\n"))
          if "\\n" in raw:
              add("LITERAL_BACKSLASH_N_NORMALIZED",raw.replace("\\r\\n","\n").replace("\\n","\n"))
          stripped=raw.strip()
          if len(stripped)>=2 and stripped[0]==stripped[-1] and stripped[0] in "'\"":
              add("SURROUNDING_QUOTES_REMOVED",stripped[1:-1].replace("\\n","\n"))
          if "-----BEGIN" not in raw:
              try:
                  decoded=base64.b64decode(raw,validate=True).decode("utf-8")
                  if "-----BEGIN" in decoded:
                      add("BASE64_DECODED_PEM",decoded)
              except Exception:
                  pass
          tmp=pathlib.Path(os.environ["RUNNER_TEMP"])
          expected=os.environ["EXPECTED_SPKI_SHA256"]
          saw_encrypted=False
          saw_openssh=False
          for label,value in candidates:
              header=value.lstrip().splitlines()[0] if value.lstrip().splitlines() else ""
              if "BEGIN ENCRYPTED PRIVATE KEY" in header:
                  saw_encrypted=True
              if "BEGIN OPENSSH PRIVATE KEY" in header:
                  saw_openssh=True
              key=tmp/"mxm_v4_private_key_candidate"
              key.write_text(value,encoding="utf-8")
              key.chmod(0o600)
              der=tmp/"derived-public.der"
              p=subprocess.run(["openssl","pkey","-in",str(key),"-pubout","-outform","DER","-out",str(der)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if p.returncode==0:
                  import hashlib
                  actual=hashlib.sha256(der.read_bytes()).hexdigest()
                  key.unlink(missing_ok=True); der.unlink(missing_ok=True)
                  print("PRIVATE_KEY_PARSE_STATUS=VALID")
                  print("PRIVATE_KEY_NORMALIZATION="+label)
                  if actual != expected:
                      print("PRIVATE_KEY_PAIR_STATUS=FINGERPRINT_MISMATCH")
                      sys.exit(1)
                  print("PRIVATE_KEY_PAIR_STATUS=MATCH")
                  sys.exit(0)
              key.unlink(missing_ok=True); der.unlink(missing_ok=True)
          headers=[v.lstrip().splitlines()[0] for _,v in candidates if v.lstrip().splitlines()]
          if any("BEGIN PUBLIC KEY" in h or "BEGIN RSA PUBLIC KEY" in h for h in headers):
              print("PRIVATE_KEY_PARSE_STATUS=PUBLIC_KEY_MATERIAL_NOT_PRIVATE_KEY")
          elif saw_encrypted:
              print("PRIVATE_KEY_PARSE_STATUS=ENCRYPTED_PRIVATE_KEY_REQUIRES_SEPARATE_PASSPHRASE")
          elif saw_openssh:
              print("PRIVATE_KEY_PARSE_STATUS=OPENSSH_FORMAT_NOT_ACCEPTED_BY_OPENSSL_PKEY")
          elif any("BEGIN CERTIFICATE" in h for h in headers):
              print("PRIVATE_KEY_PARSE_STATUS=CERTIFICATE_MATERIAL_NOT_PRIVATE_KEY")
          else:
              print("PRIVATE_KEY_PARSE_STATUS=INVALID_AFTER_SAFE_NORMALIZATION")
          print("PRIVATE_KEY_PAIR_STATUS=NOT_VERIFIABLE")
          sys.exit(1)
          PY
