name: Runtime V2 Liveness Sentinel

# Recovery-only tool. Normal research continuation never depends on this workflow.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: mxm-runtime-v2-event-dispatcher
  cancel-in-progress: true

env:
  TARGET_BRANCH: performance-research-v3-20260922

jobs:
  dispatcher:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Classify durable execution state
        id: route
        shell: bash
        run: python -m research_v3.lightweight_dispatcher classify --root . --github-output "${GITHUB_OUTPUT}"

      - name: Resolve exact-head authority and dispatch legal continuation
        if: >-
          steps.route.outputs.dispatch_required == 'true' &&
          (
            github.event_name != 'workflow_run' ||
            github.event.workflow_run.conclusion == 'success' ||
            (
              github.event.workflow_run.name == 'Autonomous Research Runtime V2 Supervisor' &&
              github.event.workflow_run.conclusion == 'failure'
            )
          )
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EXECUTION_CLASS: ${{ steps.route.outputs.execution_class }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(git rev-parse HEAD)"
          ci_head=""
          ci_conclusion=""
          ci_run_id=""
          if [[ "${EXECUTION_CLASS}" == "SEMANTIC_REASONING" ]]; then
            fast_name="Research Fast Path Validation"
            if [[ "${EVENT_WORKFLOW}" == "${fast_name}" && "${EVENT_HEAD}" == "${current_head}" && "${EVENT_CONCLUSION}" == "success" ]]; then
              ci_head="${EVENT_HEAD}"
              ci_conclusion="success"
              ci_run_id="${EVENT_RUN_ID}"
            else
              runs="$(curl --fail-with-body -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${current_head}&per_page=100")"
              ci_run="$(jq -c --arg n "${fast_name}" '[.workflow_runs[] | select(.name == $n)] | sort_by(.created_at) | last // empty' <<< "${runs}")"
              if [[ -n "${ci_run}" ]]; then
                ci_conclusion="$(jq -r '.conclusion // empty' <<< "${ci_run}")"
                ci_run_id="$(jq -r '.id' <<< "${ci_run}")"
                if [[ "${ci_conclusion}" == "success" ]]; then
                  ci_head="${current_head}"
                elif [[ "${ci_conclusion}" == "failure" ]]; then
                  echo "Focused research fast-path validation failed at ${current_head}; technical repair required (run ${ci_run_id})."
                  exit 1
                else
                  echo "Focused research fast-path validation is already queued or running (run ${ci_run_id})."
                  exit 0
                fi
              else
                echo "Dispatching focused research fast-path validation for ${current_head}."
                payload="$(jq -nc --arg ref "${TARGET_BRANCH}" '{ref:$ref}')"
                curl --fail-with-body -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/research-fast-path-validation.yml/dispatches" -d "${payload}"
                exit 0
              fi
            fi
          elif [[ "${EVENT_WORKFLOW}" == "m6-preparation" && "${EVENT_HEAD}" == "${current_head}" && "${EVENT_CONCLUSION}" == "success" ]]; then
            ci_head="${EVENT_HEAD}"
            ci_conclusion="success"
            ci_run_id="${EVENT_RUN_ID}"
          elif [[ "${EXECUTION_CLASS}" == "NOVEL_AI_IMPLEMENTATION" || "${EXECUTION_CLASS}" == "AUTHORITY_CI" ]]; then
            runs="$(curl --fail-with-body -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${current_head}&per_page=100")"
            ci_run="$(jq -c '[.workflow_runs[] | select(.name == "m6-preparation")] | sort_by(.created_at) | last // empty' <<< "${runs}")"
            if [[ -n "${ci_run}" ]]; then
              ci_conclusion="$(jq -r '.conclusion // empty' <<< "${ci_run}")"
              ci_run_id="$(jq -r '.id' <<< "${ci_run}")"
              if [[ "${ci_conclusion}" == "success" ]]; then
                ci_head="${current_head}"
              elif [[ "${ci_conclusion}" == "failure" ]]; then
                echo "Exact-head authority CI failed at ${current_head}; technical repair required (run ${ci_run_id})."
                exit 1
              else
                echo "Exact-head authority CI is already queued or running (run ${ci_run_id})."
                exit 0
              fi
            else
              echo "Dispatching exact-head authority CI for ${current_head}."
              payload="$(jq -nc --arg ref "${TARGET_BRANCH}" '{ref:$ref}')"
              curl --fail-with-body -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/m6_preparation.yml/dispatches" -d "${payload}"
              exit 0
            fi
          fi
          # Re-check the canonical writer immediately before dispatch. The watchdog
          # check is intentionally duplicated here to close the check/dispatch race.
          for writer_state in in_progress queued; do
            writer_runs="$(curl --fail-with-body -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-runtime-v2.yml/runs?status=${writer_state}&per_page=100")"
            if jq -e '.total_count > 0' <<< "${writer_runs}" >/dev/null; then
              echo "Canonical research writer is already ${writer_state}; sentinel will not dispatch a competitor."
              exit 0
            fi
          done
          payload="$(jq -nc --arg ref main --arg head "${ci_head}" --arg conclusion "${ci_conclusion}" --arg run_id "${ci_run_id}" '{ref:$ref,inputs:{mode:"resume",predecessor_ci_head:$head,predecessor_ci_conclusion:$conclusion,predecessor_ci_run_id:$run_id}}')"
          curl --fail-with-body -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/autonomous-research-runtime-v2.yml/dispatches" -d "${payload}"
