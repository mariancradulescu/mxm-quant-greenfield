name: Runtime V2 Liveness Sentinel

on:
  workflow_run:
    workflows:
      - Autonomous Research Runtime V2 Supervisor
      - m6-preparation
    types:
      - completed
  schedule:
    # Secondary best-effort fallback only; primary liveness is event-driven workflow_run.
    - cron: "4,19,34,49 * * * *"

permissions:
  contents: write
  actions: write
  copilot-requests: write

concurrency:
  group: mxm-autonomous-runtime-v2-performance-research-v3-20260922
  cancel-in-progress: false

env:
  TARGET_BRANCH: performance-research-v3-20260922
  MXM_RUNTIME_TARGET_BRANCH: performance-research-v3-20260922
  PYTHONUNBUFFERED: "1"

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure durable checkpoint identity
        run: |
          git config user.name "mxm-runtime-v2[bot]"
          git config user.email "mxm-runtime-v2@users.noreply.github.com"

      - name: Reconcile durable control plane
        run: python -m research_v3.autonomous_control_plane validate

      - name: Focused Runtime V2 and general AI director tests
        run: python -m unittest -v tests.test_autonomous_runtime_v2 tests.test_autonomous_director_v2 tests.test_general_ai_director_bridge tests.test_general_ai_reasoning_provider tests.test_general_ai_implementation_executor tests.test_c031_structural_extension_capture

      - name: Prove general AI research director boundary if not yet accepted
        shell: bash
        run: |
          if [[ -f evidence/GENERAL_AI_RESEARCH_DIRECTOR_ACCEPTANCE_V1.json ]] && \
             [[ "$(jq -r '.status // empty' evidence/GENERAL_AI_RESEARCH_DIRECTOR_ACCEPTANCE_V1.json)" == "PASS" ]]; then
            echo "General AI director already accepted"
          else
            python -m research_v3.general_ai_director_acceptance prove \
              --root . \
              --git-checkpoint \
              --git-push
          fi

      - name: Drain auditable AI research proposals through Runtime V2
        run: |
          python -m research_v3.general_ai_director_bridge drain \
            --root . \
            --git-checkpoint \
            --git-push

      - name: Install GitHub Copilot CLI for unattended reasoning
        run: npm install -g @github/copilot

      - name: Continue general AI reasoning and implementation autonomously
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          MXM_COPILOT_MODEL: auto
          MXM_COPILOT_IMPLEMENTATION_MODEL: auto
          MXM_PREDECESSOR_CI_HEAD: ${{ github.event.workflow_run.head_sha }}
          MXM_PREDECESSOR_CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          MXM_PREDECESSOR_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python -m research_v3.general_ai_autonomy_loop continue \
            --root . \
            --git-checkpoint \
            --git-push \
            --max-cycles 8

      - name: Materialize any explicitly AI-authorized economic envelope
        run: |
          python -m research_v3.economic_operation_materializer materialize \
            --root . \
            --git-checkpoint \
            --git-push

