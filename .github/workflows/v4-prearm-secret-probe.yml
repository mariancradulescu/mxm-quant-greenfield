name: V4 Pre-Arm Secret Presence Probe

on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [".github/workflows/v4-prearm-secret-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secret without revealing it
        env:
          MXM_V4_INPUT_BUNDLE_PASSPHRASE: ${{ secrets.MXM_V4_INPUT_BUNDLE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "$MXM_V4_INPUT_BUNDLE_PASSPHRASE" ]; then
            echo "MXM_V4_INPUT_BUNDLE_PASSPHRASE_STATUS=PRESENT"
          else
            echo "MXM_V4_INPUT_BUNDLE_PASSPHRASE_STATUS=ABSENT"
          fi

      - name: Installed workflow SHA256
        run: sha256sum .github/workflows/v4-greenfield-recovery-v3.yml
