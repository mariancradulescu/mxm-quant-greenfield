name: MXM MASTER1576 metadata reconciliation V1
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [.github/workflows/mxm-master1576-metadata-reconciliation-v1.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: mxm-master1576-metadata-v1
  cancel-in-progress: false
jobs:
  metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Accepted metadata join and verified remote publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 research_core_v4/master_frontier_v1/metadata_reconcile_v1.py
      - name: Preserve safe execution receipt or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: master1576-metadata-forensics-${{ github.run_id }}
          path: |
            research_core_v4/master_frontier_v1/RUN_READBACK_RECEIPT_V1.json
            research_core_v4/master_frontier_v1/RUN_FAILURE_V1.json
          if-no-files-found: error
          retention-days: 30
