name: MXM owner authenticated existing cost coverage
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/aidr_cost_coverage_v1/OWNER_EXECUTION_MANDATE_V1.json]
permissions:
  contents: write
concurrency:
  group: mxm-owner-existing-cost-coverage-v1
  cancel-in-progress: false
jobs:
  private-existing-source-intersection:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref == 'refs/heads/performance-research-v3-20260922' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5
      - name: Owner scope and frozen source gate before secret access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m research_core_v4.aidr_cost_coverage_v1.execute_owner_coverage_v1 --preflight
      - name: Private authenticated availability intersection
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_EXPECTED_ACCOUNT_ID: ${{ secrets.CTRADER_EXPECTED_ACCOUNT_ID }}
        run: |
          ulimit -v 2097152
          ulimit -t 600
          timeout --signal=TERM 900 python3 -m research_core_v4.aidr_cost_coverage_v1.execute_owner_coverage_v1
