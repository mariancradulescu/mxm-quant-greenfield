name: Research Core V3 Adaptive Collector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-core-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mxm-research-core-v3-validation
  cancel-in-progress: false

jobs:
  deterministic-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact authoritative research HEAD
        uses: actions/checkout@v4
        with:
          ref: 90f8ec61bd94c9c39fe8a5bf6a402a17fbd4ad8c
          fetch-depth: 0

      - name: Confirm current research branch HEAD
        shell: bash
        run: |
          set -euo pipefail
          validated_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/performance-research-v3-20260922 | cut -f1)"
          test "${validated_head}" = "90f8ec61bd94c9c39fe8a5bf6a402a17fbd4ad8c"
          test "${remote_head}" = "${validated_head}"
          echo "Validated current research HEAD: ${validated_head}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic broker collector dependency
        run: python -m pip install -r tools/requirements-m6-capture.txt

      - name: Validate generic engine and adaptive full-frontier collector
        run: python -m unittest -v tests.test_research_core_v3 tests.test_research_core_v3_adaptive_collector

      - name: Build exact adaptive full-frontier package
        run: |
          python tools/build_research_core_v3_collector_package.py
          sha256sum dist/MXM_RESEARCH_CORE_V3_FULL_FRONTIER_FINAL.zip

      - name: Upload exact adaptive full-frontier artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXM_RESEARCH_CORE_V3_FULL_FRONTIER_FINAL
          path: dist/MXM_RESEARCH_CORE_V3_FULL_FRONTIER_FINAL.zip
          if-no-files-found: error
