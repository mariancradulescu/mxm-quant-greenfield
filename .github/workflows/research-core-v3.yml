name: Research Core V3 Broad Development Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-core-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mxm-research-core-v3-validation
  cancel-in-progress: false

jobs:
  deterministic-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact authoritative research HEAD
        uses: actions/checkout@v4
        with:
          ref: c2fe24e7dd0938603ad5fadcc5cc79651d38c483
          fetch-depth: 0

      - name: Confirm current research branch HEAD
        shell: bash
        run: |
          set -euo pipefail
          validated_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/performance-research-v3-20260922 | cut -f1)"
          test "${validated_head}" = "c2fe24e7dd0938603ad5fadcc5cc79651d38c483"
          test "${remote_head}" = "${validated_head}"
          echo "Validated current research HEAD: ${validated_head}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic broker collector dependency
        run: |
          python -m pip install -r tools/requirements-m6-capture.txt
          python -m pip install numpy==2.3.5

      - name: Validate complete 145-identity frozen development surface
        run: python -m unittest -v tests.test_research_core_v3 tests.test_research_core_v3_adaptive_collector tests.test_v3_capture_ingest tests.test_v3_delta_core tests.test_research_core_v3_fast_engine tests.test_v3_full_surface_manifest tests.test_v3_broad_interpretation tests.test_v3_corrected_semantics tests.test_v3_corrected_surface_integrity
