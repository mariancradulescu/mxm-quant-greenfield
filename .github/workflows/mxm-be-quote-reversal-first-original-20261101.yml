name: MXM B-E fresh Pepperstone original BIDASK quote-reversal single economic exposure
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/laboratory/mxm_be_quote_reversal_cost_20261101.py
      - .github/workflows/mxm-be-quote-reversal-first-original-20261101.yml
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-be-quote-reversal-first-original-20261101.yml
permissions: {contents: read, actions: read}
concurrency:
  group: mxm-be-quote-reversal-original-first-20261101
  cancel-in-progress: false
jobs:
  fixed-source-blind-quote-economics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify causal completed history, future-poison, later entry/exit and spread inclusion before private data
        run: |
          set -eu
          python3 -m research_core_v4.laboratory.mxm_be_quote_reversal_cost_20261101 selftest
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research_core_v4/laboratory/mxm_be_quote_reversal_cost_20261101.py').read_text()
          assert "RUN=41311440117" in p
          assert 'SOURCE_HEAD="6273c44e559e7d9a703a86b66ef344300c31814a"' in p
          assert "entry=book.first(t,t+EXECUTION_LATENCY_MS,True)" in p
          assert "exit_info=book.first(target,target+EXECUTION_LATENCY_MS)" in p
          assert "after=10000*d*((xb if d==1 else xa)-(ea if d==1 else eb))/em" in p
          assert "REVERSAL_THRESHOLD_MULTIPLE_OF_SPREAD=2" in p
          assert "HOLD_MS=20000" in p
          assert '"independent_strategy_confirmation":False' in p
          assert '"broker_requests":0,"orders":0' in p
          workflow=Path('.github/workflows/mxm-be-quote-reversal-first-original-20261101.yml').read_text()
          assert '\\${{' not in workflow
          assert "GH_TOKEN: ${{ github.token }}" in workflow
          assert "MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}" in workflow
          print("MXM_BE_AUTHENTIC_BIDASK_FIRST_ECONOMIC_HYPOTHESIS_FIXED")
          PY
  one-authentic-custody-bidask-economic-study:
    needs: fixed-source-blind-quote-economics
    if: github.event_name == 'push' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: First-only, authentic source artifact, pre-reviewed official merge and unchanged owner source gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 - <<'PY'
          import json,os,subprocess
          repo='repos/mariancradulescu/mxm-quant-greenfield/'
          def get(p):return json.loads(subprocess.check_output(['gh','api',repo+p],text=True))
          b='mxm-remediation-p0-p4-20261015-v1'
          assert os.environ['GITHUB_REPOSITORY']=='mariancradulescu/mxm-quant-greenfield'
          assert os.environ['GITHUB_REF']=='refs/heads/'+b and os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert get('git/ref/heads/'+b)['object']['sha']==os.environ['GITHUB_SHA']
          assert len(get('commits/'+os.environ['GITHUB_SHA'])['parents'])==2
          source=get('actions/runs/41311440117')
          assert source['conclusion']=='success' and source['head_sha']=='6273c44e559e7d9a703a86b66ef344300c31814a'
          asset=get('actions/artifacts/13085561304')
          assert asset['workflow_run']['id']==41311440117 and asset['size_in_bytes']==51046
          assert asset['digest']=='sha256:ef16c92429109e0dca15caca0db5d0f51e5b4ca330df850b73cf2515ff96aaef'
          assert not asset['expired']
          history=get('actions/workflows/mxm-be-quote-reversal-first-original-20261101.yml/runs?per_page=100')
          assert history['total_count']<=100 and history['total_count']==len(history['workflow_runs'])
          pushes=[x for x in history['workflow_runs'] if x['event']=='push' and x['head_branch']==b]
          assert len(pushes)==1 and pushes[0]['id']==int(os.environ['GITHUB_RUN_ID'])
          print('MXM_BE_FRESH_QUOTE_STUDY_ONE_FIRST_ORIGINAL_ADMITTED')
          PY
      - name: Install existing pinned isolated decrypt dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: ONE authenticated first outcome from already conserved bid/ask with independent later date
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.mxm_be_quote_reversal_cost_20261101 original
      - name: Preserve public aggregate and encrypted individual directional outcomes; zero broker calls
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-be-authentic-bidask-first-quote-reversal-${{ github.run_id }}
          path: verification/be-quote-reversal-20261101/
          retention-days: 90
          if-no-files-found: error
