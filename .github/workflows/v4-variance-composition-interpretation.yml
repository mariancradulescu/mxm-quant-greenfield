name: V4 Variance Composition Persisted Result Interpretation Only
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/state/VARIANCE_COMPOSITION_RAW_RESULT_V1.json]
permissions: {contents: read}
jobs:
  interpret-persisted-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_CORETYPE: Nehalem
      NPY_DISABLE_CPU_FEATURES: AVX512F,AVX2,FMA3,AVX
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.16'}
      - run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r research_core_v4/runtime/numeric-requirements-v1.txt
      - name: Interpret canonical raw scores using unchanged preoutcome law
        run: |
          python - <<'PY' > "$RUNNER_TEMP/VARIANCE_COMPOSITION_INTERPRETATION_V1.json"
          import json,os,platform,subprocess
          from pathlib import Path
          from research_core_v4 import variance_composition_v1 as v
          from tools.variance_composition_preoutcome import network_fence,environment
          S=Path('research_core_v4/state')
          raw_bytes=(S/'VARIANCE_COMPOSITION_RAW_RESULT_V1.json').read_bytes()
          raw=json.loads(raw_bytes)
          v.require(platform.python_version()=='3.11.16' and v.np.__version__=='2.4.6','numeric versions')
          for path,h in raw['source_binding'].items():
              prior=subprocess.check_output(['git','show',raw['trigger_head']+':'+path])
              v.require(v.sha(prior)==h,'opening source binding '+path)
              if path!='research_core_v4/state/V4_STATE.json': v.require(v.sha(Path(path).read_bytes())==h,'current frozen source '+path)
          v.require(subprocess.check_output(['git','merge-base',raw['preoutcome_freeze_head'],'HEAD']).decode().strip()==raw['preoutcome_freeze_head'],'immutable freeze ancestor')
          d=json.loads((S/'VARIANCE_COMPOSITION_DESIGN_V1.json').read_bytes())
          v.require(v.sha(v.canonical(d))==raw['design_sha256'],'design exact')
          network_fence()
          def denied(*a,**k):raise PermissionError('NO_MARKET_RESPONSE_ACCESS_IN_INTERPRETATION')
          v.raw_result=denied;v.response=denied;v.read_series=denied
          result=v.interpret(raw,d)
          result.update(raw_result_sha256=v.sha(raw_bytes),raw_canonical_publication_head=os.environ['GITHUB_SHA'],preoutcome_freeze_head=raw['preoutcome_freeze_head'],interpretation_run_id=int(os.environ['GITHUB_RUN_ID']),environment=environment(),scientific_law_changed=False,new_real_openings=0,broker_contacts=0,historical_requests=0)
          print(json.dumps(result,sort_keys=True,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: variance-composition-interpretation-${{ github.run_id }}
          path: ${{ runner.temp }}/VARIANCE_COMPOSITION_INTERPRETATION_V1.json
          if-no-files-found: error
          retention-days: 90
