name: V3 maxT14 authentic friction package
on:
  push:
    branches: [performance-research-v3-20260922]
  workflow_dispatch:
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Android-safe protobuf
        run: |
          python -m pip install --only-binary=:all: --no-deps -r tools/requirements-m6-capture.txt
      - name: Compile targeted V3 capture and evidence runtime
        run: |
          python -m py_compile V3_MAXT14_FRICTION_CAPTURE_RUN.py research_core_v3/v3_friction_capture.py research_core_v3/pydroid_v3_friction_launcher.py research_core_v3/v3_friction_evidence.py tools/build_v3_maxt14_friction_capture_package.py tools/assess_v3_maxt14_friction_evidence.py
      - name: No-network exact frozen-scope geometry preflight
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python - <<'PY'
          from pathlib import Path
          from research_core_v3.v3_friction_capture import local_geometry_preflight
          g=local_geometry_preflight(Path("."))
          assert g["symbols"] == 14, g
          assert g["exact_windows"] == 691_919, g
          assert g["transport_blocks"] > 0, g
          assert g["base_bid_ask_requests_before_pagination"] == 2*g["transport_blocks"], g
          print("V3_MAXT14_GEOMETRY_PASS", g)
          PY
      - name: Focused unit tests
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python -m unittest tests.test_v3_maxt14_friction_capture tests.test_v3_maxt14_friction_evidence -v
      - name: Build deterministic Android capture package
        run: |
          PYTHONPATH=. PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python python tools/build_v3_maxt14_friction_capture_package.py
          sha256sum dist/MXM_V3_MAXT14_FRICTION_CAPTURE_PACKAGE_V1.zip
      - name: Upload capture package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_V3_MAXT14_FRICTION_CAPTURE_PACKAGE_V1
          path: dist/MXM_V3_MAXT14_FRICTION_CAPTURE_PACKAGE_V1.zip
          if-no-files-found: error
          retention-days: 30
