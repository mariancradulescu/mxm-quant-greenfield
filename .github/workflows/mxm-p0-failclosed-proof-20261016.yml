name: MXM P0 fail-closed isolated proof 20261016
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/p0_failclosed_20261016/**
      - .github/workflows/mxm-p0-failclosed-proof-20261016.yml
permissions:
  contents: read
concurrency:
  group: mxm-p0-failclosed-proof-20261016
  cancel-in-progress: false
jobs:
  isolated-denial:
    # One native attempt is archived at source 7af72e8; no repeat or automatic retry.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inactive issuer boundary tests only
        run: |
          mkdir -p failclosed-verification
          python -m unittest research_core_v4.p0_failclosed_20261016.test_disabled -v > failclosed-verification/tests.txt 2>&1
          cat failclosed-verification/tests.txt
      - name: One native protected synthetic creation rejection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research_core_v4.p0_failclosed_20261016.native_denial_probe
      - name: Preserve public receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-p0-failclosed-proof-${{ github.run_id }}
          path: failclosed-verification/
          retention-days: 90
