name: Research Fast Path Validation — LEGACY READ ONLY

# LEGACY V2 READ-ONLY KILL SWITCH.
# Former V2 semantic validation path and Supervisor dispatcher.
# Historical source/evidence remains in Git history. This workflow is deliberately
# manual-only and cannot mutate the research branch, dispatch another workflow,
# invoke an AI/provider, or consume resources autonomously.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEGACY_V2_READ_ONLY: "1"

jobs:
  legacy-read-only:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Enforce LEGACY_V2_READ_ONLY
        shell: bash
        run: |
          set -euo pipefail
          test "${LEGACY_V2_READ_ONLY:-}" = "1"
          echo "Legacy Runtime V2 execution is retired. Read Git history/evidence for diagnostics."
          echo "No writes, autonomous wakes, downstream dispatches, or provider calls are authorized."
