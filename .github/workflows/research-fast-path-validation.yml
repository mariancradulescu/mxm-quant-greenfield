name: Research Fast Path Validation

on:
  workflow_dispatch:
    inputs:
      required_head:
        type: string
        required: true

permissions:
  contents: read
  actions: write

env:
  TARGET_BRANCH: performance-research-v3-20260922
  PYTHONUNBUFFERED: "1"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate non-authoritative projection for validation
        run: python -c 'from research_v3.evidence_epoch import refresh_derived_views; refresh_derived_views(".")'

      - name: Validate research fast path
        run: |
          python -m research_v3.autonomous_control_plane validate
          python -m unittest -v \
            tests.test_execution_router_v1 \
            tests.test_deterministic_operation_executor_v1 \
            tests.test_general_ai_director_bridge \
            tests.test_general_ai_reasoning_provider \
            tests.test_general_ai_implementation_executor \
            tests.test_general_ai_autonomy_loop \
            tests.test_research_fast_path \
            tests.test_active_research_projection \
            tests.test_epoch34_composite_causal_ml_regime_screen \
            tests.test_epoch34_deterministic_operation

      - name: Resume supervisor after exact-head success
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_HEAD: ${{ inputs.required_head }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUIRED_HEAD"
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')"
          test "$current_head" = "$REQUIRED_HEAD"
          python - <<'PY'
          from research_v3.general_ai_autonomy_loop import _material_state_signature, _blocked_scopes
          from research_v3.runtime_v2_primitives import load_json
          from research_v3.general_ai_reasoning_provider import build_reasoning_request
          from research_v3.general_ai_director_bridge import NEXT_STATE_REL
          from pathlib import Path
          state=load_json(Path('.')/NEXT_STATE_REL,{}) or {}
          if state.get('user_action_required') or state.get('external_data_required') or state.get('status')=='MATERIAL_INTEGRITY_FAILURE':
              raise SystemExit('Fast CI green; durable state is externally gated')
          if state.get('status')=='PENDING_EXACT_HEAD_GREEN':
              print('Exact-head acceptance pending; resume supervisor')
              raise SystemExit(0)
          request=load_json(Path('research_v3/ai_director/ADDITIONAL_AUTHORITY_REQUEST_V1.json'),{}) or {}
          if request.get('status')=='ADDITIONAL_AUTHORITY_REQUIRED' and request.get('evidence_epoch')==state.get('current_research_evidence_epoch') and request.get('request_id')==build_reasoning_request('.')['request_id']:
              raise SystemExit('Fast CI green; unchanged authority request')
          print('Internally actionable:',_material_state_signature(state),_blocked_scopes(Path('.')))
          PY
          gh workflow run autonomous-research-runtime-v2.yml --ref main \
            -f predecessor_ci_head="$REQUIRED_HEAD" \
            -f predecessor_ci_conclusion=success \
            -f predecessor_ci_run_id="$GITHUB_RUN_ID"
