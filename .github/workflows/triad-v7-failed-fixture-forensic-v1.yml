name: TRIAD V7 exact failed fixture forensic
on:
  push:
    branches: [performance-research-v3-20260922]
    paths:
      - .github/workflows/triad-v7-failed-fixture-forensic-v1.yml
permissions:
  contents: write
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.17.0'
      - name: Reproduce exact frozen engineering failure and capture traceback locals
        run: |
          set -euo pipefail
          python research_core_v4/triad_v7/distributed/reproduce_failed_fixture_v1.py /tmp/EXACT_FAILED_FIXTURE_FORENSIC_V1.json
      - name: Persist forensic checkpoint
        run: |
          set -euo pipefail
          git fetch origin performance-research-v3-20260922
          test "$(git rev-parse origin/performance-research-v3-20260922)" = "$GITHUB_SHA"
          git checkout -B performance-research-v3-20260922 "$GITHUB_SHA"
          cp /tmp/EXACT_FAILED_FIXTURE_FORENSIC_V1.json research_core_v4/triad_v7/distributed/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_core_v4/triad_v7/distributed/EXACT_FAILED_FIXTURE_FORENSIC_V1.json
          git commit -m 'Persist exact V7 failed engineering fixture forensic geometry'
          git push origin HEAD:performance-research-v3-20260922
