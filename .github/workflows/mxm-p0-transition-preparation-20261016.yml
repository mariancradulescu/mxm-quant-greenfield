name: MXM P0 transition preparation synthetic and GET only
run-name: P0 PREPARATION ONLY NO GO ${{ github.sha }}
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - 'research_core_v4/p0_transition_20261016/**'
      - '.github/workflows/mxm-p0-transition-preparation-20261016.yml'
permissions:
  contents: read
  actions: read
jobs:
  synthetic_bootstrap_and_readonly_receipt:
    if: github.event_name == 'push' && github.actor_id == '322088485' && github.run_attempt == 1 && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.sha == github.event.after
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 1}
      - name: New bootstrap preparation tests in local marked bare Git only
        run: python3 -m research_core_v4.p0_transition_20261016.test_transition
      - name: Native GET observations and preserved OWNER invariants
        run: python3 -m research_core_v4.p0_transition_20261016.live_probe
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mxm-p0-preparation-${{ github.sha }}
          path: verification/p0-preparation/
          if-no-files-found: error
          retention-days: 90
