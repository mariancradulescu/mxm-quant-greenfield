name: V3 Quote Revision Sequence V2 Package

on:
  push:
    branches:
      - performance-research-v3-20260922
    paths:
      - "research_core_v3/quote_revision_sequence_raw_capture_v2.py"
      - "research_core_v3/pydroid_quote_revision_sequence_launcher_v2.py"
      - "V3_QUOTE_REVISION_SEQUENCE_CAPTURE_RUN.py"
      - "tests/test_quote_revision_sequence_capture_v2.py"
      - "research_core_v3/state/QUOTE_REVISION_SEQUENCE_METHOD_AND_ACQUISITION_AUDIT_V2.json"
      - "research_core_v3/state/QUOTE_REVISION_SEQUENCE_PRESSURE_DEVELOPMENT_DESIGN_V2.json"
      - "research_core_v3/state/QUOTE_REVISION_SEQUENCE_PRESSURE_ACQUISITION_PLAN_V2.json"
      - ".github/workflows/v3-quote-revision-sequence-v2-package.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check protobuf

      - name: Static compile
        run: |
          python -m py_compile \
            research_core_v3/quote_revision_sequence_raw_capture_v2.py \
            research_core_v3/pydroid_quote_revision_sequence_launcher_v2.py \
            V3_QUOTE_REVISION_SEQUENCE_CAPTURE_RUN.py \
            m6/ctrader_capture.py \
            m6/ctrader_transport.py \
            m6/pydroid_oauth.py

      - name: Offline integrity tests
        run: python -m unittest tests.test_quote_revision_sequence_capture_v2

      - name: Static no-trading surface guard
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("research_core_v3/quote_revision_sequence_raw_capture_v2.py").read_text(encoding="utf-8")
          forbidden = [
              "ProtoOANewOrderReq","ProtoOACancelOrderReq","ProtoOAClosePositionReq",
              "ProtoOAAmendOrderReq","ProtoOAAmendPositionSLTPReq",
              "ProtoOASubscribeSpotsReq","ProtoOAUnsubscribeSpotsReq",
          ]
          bad = [x for x in forbidden if x in src]
          if bad:
              raise SystemExit(f"forbidden protocol surface present: {bad}")
          required = [
              "ProtoOAExpectedMarginReq","ProtoOAGetTickDataReq",
              "raw_ticks_transferred_off_device", "device_computes_strategy_outcomes",
          ]
          missing = [x for x in required if x not in src and x not in Path("research_core_v3/state/QUOTE_REVISION_SEQUENCE_PRESSURE_ACQUISITION_PLAN_V2.json").read_text()]
          if missing:
              raise SystemExit(f"required contract token missing: {missing}")
          print("READ_ONLY_STATIC_GUARD_PASS")
          PY

      - name: Build deterministic one-package ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          files = [
              "V3_QUOTE_REVISION_SEQUENCE_CAPTURE_RUN.py",
              "research_core_v3/__init__.py",
              "research_core_v3/quote_revision_sequence_raw_capture_v2.py",
              "research_core_v3/pydroid_quote_revision_sequence_launcher_v2.py",
              "research_core_v3/state/QUOTE_REVISION_SEQUENCE_METHOD_AND_ACQUISITION_AUDIT_V2.json",
              "research_core_v3/state/QUOTE_REVISION_SEQUENCE_PRESSURE_DEVELOPMENT_DESIGN_V2.json",
              "research_core_v3/state/QUOTE_REVISION_SEQUENCE_PRESSURE_ACQUISITION_PLAN_V2.json",
              "m6/__init__.py",
              "m6/_ctrader_capture_base.py",
              "m6/ctrader_capture.py",
              "m6/ctrader_transport.py",
              "m6/pydroid_oauth.py",
              "m6/ctrader_proto/__init__.py",
              "m6/ctrader_proto/OpenApiCommonModelMessages_pb2.py",
              "m6/ctrader_proto/OpenApiCommonMessages_pb2.py",
              "m6/ctrader_proto/OpenApiModelMessages_pb2.py",
              "m6/ctrader_proto/OpenApiMessages_pb2.py",
              "m6/ctrader_proto/LICENSE_SPOTWARE_OPENAPIPY.txt",
          ]
          missing = [x for x in files if not Path(x).is_file()]
          if missing:
              raise SystemExit(f"package source missing: {missing}")

          target = Path("MXM_V3_QUOTE_REVISION_SEQUENCE_PILOT_PACKAGE_V2.zip")
          with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for rel in files:
                  data = Path(rel).read_bytes()
                  info = zipfile.ZipInfo(rel, (1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  zf.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          with zipfile.ZipFile(target, "r") as zf:
              if zf.testzip() is not None:
                  raise SystemExit("zip CRC failure")
              if set(zf.namelist()) != set(files):
                  raise SystemExit("package member mismatch")

          sha = hashlib.sha256(target.read_bytes()).hexdigest()
          print(f"PACKAGE_NAME={target.name}")
          print(f"PACKAGE_SHA256={sha}")
          print(f"PACKAGE_BYTES={target.stat().st_size}")
          PY

      - name: Upload exactly one package
        uses: actions/upload-artifact@v4
        with:
          name: MXM_V3_QUOTE_REVISION_SEQUENCE_PILOT_PACKAGE_V2
          path: MXM_V3_QUOTE_REVISION_SEQUENCE_PILOT_PACKAGE_V2.zip
          if-no-files-found: error
          retention-days: 30
