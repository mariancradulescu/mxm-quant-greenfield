          python3 -m research_core_v4.laboratory.csharp_week_account_attribution "${RUNNER_TEMP}/mxm-week-csharp-product-stop12/portfolio-exposed-quote-readback.json" --out "${RUNNER_TEMP}/mxm-week-csharp-product-stop12/attribution.json"
