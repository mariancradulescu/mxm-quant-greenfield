          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release --no-build -- --native-week-captured-terms-eurusd "${RUNNER_TEMP}/mxm-week-ticks.ndjson" "${RUNNER_TEMP}/mxm-week-csharp" "${RUNNER_TEMP}/mxm-week-ticks.ndjson.symbol-terms.json"
          python3 -m research_core_v4.laboratory.csharp_native_portfolio_independent_mark "${RUNNER_TEMP}/mxm-week-ticks.ndjson" "${RUNNER_TEMP}/mxm-week-csharp/portfolio-exposed-quote-readback.json" --captured-terms "${RUNNER_TEMP}/mxm-week-ticks.ndjson.symbol-terms.json" --out "${RUNNER_TEMP}/mxm-week-csharp/independent-mark.json"
          # Counterfactual using existing cTrader product default 12 pips, not W37-fitted.
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release --no-build -- --native-week-product-stop12-recovery-eurusd "${RUNNER_TEMP}/mxm-week-ticks.ndjson" "${RUNNER_TEMP}/mxm-week-csharp-product-stop12" "${RUNNER_TEMP}/mxm-week-ticks.ndjson.symbol-terms.json"
          python3 -m research_core_v4.laboratory.csharp_native_portfolio_independent_mark "${RUNNER_TEMP}/mxm-week-ticks.ndjson" "${RUNNER_TEMP}/mxm-week-csharp-product-stop12/portfolio-exposed-quote-readback.json" --captured-terms "${RUNNER_TEMP}/mxm-week-ticks.ndjson.symbol-terms.json" --out "${RUNNER_TEMP}/mxm-week-csharp-product-stop12/independent-mark.json"
