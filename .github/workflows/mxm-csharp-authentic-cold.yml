name: MXM CSharp authenticated chronology nonoutcome
# Retired: these fixed original-source economic computations are complete.
# Retain historical job bodies for audit; false gates stop before environment/key
# access. New research uses a separate prospectively admitted finite operation.
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - .github/workflows/mxm-csharp-authentic-cold.yml
      - research_core_v4/laboratory/chronology_csharp_bridge.py
      - research_core_v4/laboratory/captured_symbol_terms.py
      - research_core_v4/laboratory/durable_native_chronology.py
permissions: {}
concurrency:
  group: mxm-integrated-laboratory
  cancel-in-progress: false
jobs:
  bounded-cold-to-csharp:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: mxm-r3-custody-v1
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Pin independent original Pepperstone source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d2fae5641b759b1c8c24161d83d62d39e104eafd
          path: .sealed-chronology-source
          persist-credentials: false
      - run: |
          test "$(git -C .sealed-chronology-source rev-parse HEAD)" = d2fae5641b759b1c8c24161d83d62d39e104eafd
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          dotnet build research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release
      - name: Restore exact ORIGINAL encrypted Pepperstone evidence from durable Git bytes; zero broker requests
        run: |
          python3 -m research_core_v4.laboratory.durable_native_chronology --out verification/r3-chronology
      - name: Decrypt only inside existing protected custody and validate every raw native page
        env:
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          cp research_core_v4/laboratory/chronology_csharp_bridge.py .sealed-chronology-source/research_core_v4/laboratory/chronology_csharp_bridge.py
          cp research_core_v4/laboratory/captured_symbol_terms.py .sealed-chronology-source/research_core_v4/laboratory/captured_symbol_terms.py
          cd .sealed-chronology-source
          python3 -m research_core_v4.laboratory.chronology_csharp_bridge "${GITHUB_WORKSPACE}/verification/r3-chronology/capture.mxmenc" "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson"
      - name: Execute CSharp single-account portfolio model against exact pinned authenticated Pepperstone quotes (development only)
        run: |
          dotnet build research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release --no-build -- --native-exposed-eurusd "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson" "${RUNNER_TEMP}/mxm-csharp-native-portfolio"
          python3 -m research_core_v4.laboratory.csharp_native_portfolio_independent_mark "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson" "${RUNNER_TEMP}/mxm-csharp-native-portfolio/portfolio-exposed-quote-readback.json" --out "${RUNNER_TEMP}/mxm-csharp-native-portfolio/independent-terminal-mark.json"
          python3 - <<'PY'
          import os,json,pathlib
          from research_core_v4.laboratory.common import bytes_digest,need
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          bridge=json.loads((root/'mxm-authentic-ticks.ndjson.receipt.json').read_text())
          native=json.loads((root/'mxm-csharp-native-portfolio/portfolio-exposed-quote-readback.json').read_text())
          need(bridge['source_run']==39660692230 and bridge['verified_bid_events']==14003 and
               bridge['verified_ask_events']==14209 and bridge['orders']==bridge['fills']==0,
               'ORIGINAL_NATIVE_CUSTODY_AND_NO_TRADING')
          need(native['derived_stream_sha256']==bridge['derived_ticks_sha256']==
               bytes_digest((root/'mxm-authentic-ticks.ndjson').read_bytes()),
               'PORTFOLIO_SOURCE_HASH_CUSTODY_BINDING')
          need(native['classification']=='ORIGINAL_PEPPERSTONE_QUOTES_SINGLE_SYMBOL_MODELED_TERMS_DEVELOPMENT_EXPOSED' and
               native['original_native_run_id']==39660692230 and native['quote_events']==28212 and
               native['actual_symbols']==1 and not native['multi_instrument_native_data_available'] and
               native['synthetic_quote_events_injected']==0 and native['new_broker_requests']==native['live_orders']==0,
               'PORTFOLIO_EXPOSED_SINGLE_SYMBOL_ONLY')
          account=native['account']
          need(account['initial_capital_eur']==200 and account['complete_iso_utc_weeks']==0 and
               not account['hard21_proven'] and not native['historical_broker_fills_proven'] and
               not native['historical_quote_arrival_order_proven'] and
               not native['scientific_confirmation_opened'] and
               not account['broker_fills_proven'] and not account['costs_broker_verified'],
               'PORTFOLIO_NOT_PROMOTED_OR_AUTHORIZED')
          print('MXM_AUTHENTIC_SOURCE_EXPOSED_EURUSD_CSHARP_ACCOUNT_ENGINE_ONLY_PASS')
          PY
      - name: Apply captured commission components and quote-side FX to same unchanged strategy and source
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/MxmPortfolioNativeQuoteReadback.csproj -c Release --no-build -- --native-captured-terms-eurusd "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson" "${RUNNER_TEMP}/mxm-csharp-captured-components" "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson.symbol-terms.json"
          python3 -m research_core_v4.laboratory.csharp_native_portfolio_independent_mark "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson" "${RUNNER_TEMP}/mxm-csharp-captured-components/portfolio-exposed-quote-readback.json" --captured-terms "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson.symbol-terms.json" --out "${RUNNER_TEMP}/mxm-csharp-captured-components/independent-mark.json"
      - name: Evaluate same CSharp decision kernel and exploratory economic sensitivity on verified authentic quotes
        run: |
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --authentic-nonoutcome "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson" "${RUNNER_TEMP}/mxm-csharp-output"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'mxm-csharp-output/reference-report.json'
          r=json.loads(p.read_bytes())
          assert r['classification']=='AUTHENTIC_CHRONOLOGY_NONOUTCOME_ONLY'
          assert not r['authenticated_market_corpus'] and r['raw_events']==28212
          assert r['economic_entries']==r['economic_exits']==0 and r['charged_cost_eur']==0
          assert r['pepperstone_historical_fills_proven'] is False and r['cTrader_native_backtest'] is False
          PY
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --authentic-scenario "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson" "${RUNNER_TEMP}/mxm-csharp-scenario"
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --authentic-research "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson" "${RUNNER_TEMP}/mxm-csharp-research"
          dotnet run --project research_core_v4/native_tick_replay_v1/csharp/EconomicReference.csproj -c Release --no-build -- --risk-capacity-research "${RUNNER_TEMP}/mxm-authentic-ticks.ndjson" "${RUNNER_TEMP}/mxm-csharp-stop-risk-capacity"
          python3 -m research_core_v4.laboratory.csharp_account_cross_engine "${RUNNER_TEMP}/mxm-csharp-scenario/reference-report.json" --out verification/csharp-authentic-aggregate/independent-account-receipt.json
          python3 - <<'PY'
          import json,os,pathlib
          from research_core_v4.laboratory.common import encoded,bytes_digest,need
          from research_core_v4.shallow_m5_support_v2_production import encrypt_shard,public_spki_sha256
          from research_core_v4.successor_c_20261018.readback import FP
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          bridge=json.loads((temp/'mxm-authentic-ticks.ndjson.receipt.json').read_bytes())
          stream=temp/'mxm-authentic-ticks.ndjson'
          need(bridge['source_run']==39660692230 and
               bridge['verified_bid_events']==14003 and bridge['verified_ask_events']==14209 and
               bridge['derived_ticks_sha256']==bytes_digest(stream.read_bytes()) and
               bridge['economic_outcomes']==bridge['orders']==bridge['fills']==0,'CSHARP_BRIDGE_BOUND')
          p=temp/'mxm-csharp-scenario/reference-report.json'
          r=json.loads(p.read_bytes())
          from pathlib import Path
          independent=json.loads(Path('verification/csharp-authentic-aggregate/independent-account-receipt.json').read_text())
          assert independent['entry_count']==r['economic_entries'] and independent['exit_count']==r['economic_exits']
          assert independent['classification']=='SAME_LEDGER_INDEPENDENT_ACCOUNT_ENGINE_NOT_INDEPENDENT_MARKET_EVIDENCE'
          assert abs(float(independent['cash_difference_eur']))<0.0005
          assert independent['orders']==0 and independent['full_iso_week_coverage']==0 and independent['hard21'] is False
          assert r['classification']=='OBSERVED_PEPPERSTONE_QUOTES_ASSUMPTION_SCENARIO_UNCERTIFIED'
          assert r['raw_events']==28212 and not r['authenticated_market_corpus'] and not r['broker_historical_costs_verified']
          assert r['cross_side_same_ms_order_unknown_groups']==11414
          assert r['crossed_snapshots']==0 and r['stale_snapshots']==0
          assert r['zero_spread_accepted_snapshots']>0
          assert r['feature_price_basis'].startswith('BID_LAST_OBSERVED')
          assert not r['economic_identity_opened'] and not r['historical_execution_fills_proven'] and not r['cTrader_native_backtest']
          assert r['economic_entries']==r['economic_exits']==len([x for x in r['ledger'] if x['kind']=='ENTRY'])
          assert r['initial_equity_eur']==200 and r['hard21']==all(x>=21 for x in r['entries_per_iso_week'].values())
          assert all(x['equity_eur']>=0 for x in r['equity']) or r['economic_entries']==0
          safe={k:r[k] for k in ('schema','classification','raw_events','bar_decisions','same_ms_conflict_groups','gap_bars','invalid_quote_snapshots','cross_side_same_ms_order_unknown_groups',
            'zero_spread_accepted_snapshots','missing_side_snapshots','crossed_snapshots',
            'stale_snapshots','feature_price_basis','economic_entries','economic_exits','charged_cost_eur','cTrader_native_backtest','pepperstone_historical_fills_proven')}
          research=json.loads((temp/'mxm-csharp-research/research.json').read_bytes())
          assert research['schema']=='mxm.csharp.authentic-exploratory-sensitivity.v1'
          assert research['classification']=='REAL_PEPPERSTONE_QUOTES_COUNTERFACTUAL_MODELS_UNCERTIFIED_NO_SCIENTIFIC_SELECTION'
          assert research['raw_events']==28212 and research['model_count']==216 and research['full_iso_weeks']==0
          assert research['no_independent_trial_or_advantage'] and not research['economic_identity_consumed']
          assert len({z['family'] for z in research['models']})==4
          assert {z['timeframe_minutes'] for z in research['models']}=={1,5,15}
          assert {z['modeled_stop_loss_pips'] for z in research['models']}=={0,12}
          assert {z['max_margin_fraction_of_free_margin'] for z in research['models']}=={0.4,0.6,0.8}
          assert all(z['entries']==0 for z in research['models'] if z['margin_eur']>200*z['max_margin_fraction_of_free_margin'])
          assert all(z['modeled_stop_exits']>=0 and (z['modeled_stop_exits']==0 if z['modeled_stop_loss_pips']==0 else True) for z in research['models'])
          assert all(z['initial_equity_eur']==200 and z['entries']==z['exits'] and not z['hard21'] for z in research['models'])
          capacity=json.loads((temp/'mxm-csharp-stop-risk-capacity/stop-risk-capacity.json').read_bytes())
          assert capacity['schema']=='mxm.csharp.pepperstone.exposed-stop-risk-capacity.v1'
          assert capacity['classification']=='ORIGINAL_PEPPERSTONE_BIDASK_EXPOSED_COUNTERFACTUAL_UNCERTIFIED'
          assert capacity['original_run_id']==39660692230 and capacity['reused_quotes']==28212
          assert capacity['model_leaves']==len(capacity['capacities'])==6
          assert not capacity['independent_scientific_trial'] and not capacity['selected_candidate']
          assert capacity['actual_broker_orders']==capacity['new_broker_requests']==0 and not capacity['hard21']
          assert {z['max_estimated_stop_risk_fraction'] for z in capacity['capacities']}=={0.005,0.01,0.02}
          assert {z['assumed_cost_reserve_eur'] for z in capacity['capacities']}=={0.2,1.0}
          assert all(z['modeled_entries']==z['modeled_exits'] and
                     z['stop_risk_rejections']>=0 and z['margin_headroom_rejections']>=0
                     for z in capacity['capacities'])
          safe.update(risk_capacity_engineering_leaves=6,
            risk_capacity_source="SAME_ORIGINAL_EXPOSED_QUOTES_NO_NEW_ECONOMIC_IDENTITY",
            risk_capacity_unverified_broker_stop_and_cost_authority=True,
            risk_capacity_model_cells=capacity['capacities'])
          safe.update(orders=0,economic_outcomes=0,full_results_withheld=True,original_source_run=39660692230,
            economic_research_classification=research['classification'],research_model_count=216,
            no_new_economic_identity=True,no_complete_iso_week=True,scientific_selection_authorized=False,
            sensitivity_M5=[{'family':z['family'],'cost_case':z['cost_case'],
              'entries':z['entries'],'exits':z['exits'],'modeled_stop_loss_pips':z['modeled_stop_loss_pips'],
              'max_margin_fraction':z['max_margin_fraction_of_free_margin'],
              'margin_rejections':z['margin_headroom_rejections'],
              'modeled_stop_exits':z['modeled_stop_exits'],'net_pnl_eur':z['net_pnl_eur'],
              'final_equity_eur':z['final_equity_eur'],'modeled_cost_eur':z['modeled_cost_eur'],
              'max_drawdown_eur':z['max_drawdown_eur'],'hard21':False}
              for z in research['models'] if z['timeframe_minutes']==5],
            scenario_classification=r['classification'],scenario_entries=r['economic_entries'],
            scenario_exits=r['economic_exits'],scenario_initial_equity_eur=r['initial_equity_eur'],
            scenario_final_equity_eur=r['final_equity_eur'],scenario_drawdown_eur=r['maximum_absolute_drawdown_eur'],
            scenario_modeled_costs_eur=r['charged_cost_eur'],scenario_hard21=r['hard21'],
            scenario_assumption=r['account_convention'],scenario_unverified_fx_margin_swap_and_fills=True,
            preserved_corpus_sha256=bridge['ciphertext_sha256'],derived_stream_sha256=bridge['derived_ticks_sha256'])
          out=pathlib.Path('verification/csharp-authentic-aggregate');out.mkdir(parents=True,exist_ok=True)
          nativeportfolio=json.loads((temp/'mxm-csharp-native-portfolio/portfolio-exposed-quote-readback.json').read_bytes())
          native_terminal_mark=json.loads((temp/'mxm-csharp-native-portfolio/independent-terminal-mark.json').read_bytes())
          need(native_terminal_mark['classification']=='INDEPENDENT_ARITHMETIC_SAME_EXPOSED_NATIVE_QUOTES_UNVERIFIED_EXECUTION' and
               native_terminal_mark['market_source_sha256']==bridge['derived_ticks_sha256'] and
               native_terminal_mark['source_native_quote_events']==28212 and
               native_terminal_mark['full_iso_weeks_verified']==0 and
               not native_terminal_mark['hard21'] and not native_terminal_mark['independent_native_broker_execution'] and
               not native_terminal_mark['broker_historical_costs_verified'] and native_terminal_mark['orders']==0 and
               float(native_terminal_mark['equity_abs_difference_eur'])<=0.000001 and
               float(native_terminal_mark['cash_abs_difference_eur'])<=0.000001,
               'INDEPENDENT_NATIVE_TERMINAL_BIDASK_MTM_PARITY')

          need(nativeportfolio['derived_stream_sha256']==bridge['derived_ticks_sha256'] and
               nativeportfolio['actual_symbols']==1 and nativeportfolio['quote_events']==28212 and
               nativeportfolio['new_broker_requests']==0 and nativeportfolio['live_orders']==0,
               'PORTFOLIO_REPLAY_NATIVE_PROVENANCE')
          cash=__import__('decimal').Decimal('200')
          for trade in nativeportfolio['account']['ledger']:
              if trade['kind']=='ENTRY':
                  cash-=__import__('decimal').Decimal(str(trade['commission_eur']))
              elif trade['kind']=='EXIT':
                  cash+=__import__('decimal').Decimal(str(trade['gross_eur']))-__import__('decimal').Decimal(str(trade['commission_eur']))
              else:raise ValueError('UNRECOGNIZED_ACCOUNT_LEDGER_ENTRY')
              need(abs(cash-__import__('decimal').Decimal(str(trade['cash_eur'])))<__import__('decimal').Decimal('0.000001'),'ONE_ACCOUNT_CASH_LEDGER')
          need(abs(cash-__import__('decimal').Decimal(str(nativeportfolio['account']['final_cash_eur'])))<__import__('decimal').Decimal('0.000001'),'CONTINUOUS_ACCOUNT_FINAL_CASH')
          from collections import Counter
          safe.update(native_portfolio_completed_bar_events=nativeportfolio['completed_bar_decision_events'],
            native_portfolio_usable_atomic_quote_snapshots=nativeportfolio['grouped_atomic_usable_snapshots'],
            native_portfolio_rejections_by_type=dict(Counter(nativeportfolio['account']['rejections'])))
          safe.update(native_portfolio_independent_terminal_bidask_mtm_arithmetic_pass=True,
            native_portfolio_independent_terminal_cash_diff_eur=float(native_terminal_mark['cash_abs_difference_eur']),
            native_portfolio_independent_terminal_equity_diff_eur=float(native_terminal_mark['equity_abs_difference_eur']))
          safe.update(native_portfolio_source_original=True,native_portfolio_input_symbols=1,
            native_portfolio_full_iso_utc_weeks=0,
            native_portfolio_entry_scenarios=nativeportfolio['account']['accepted_entries'],
            native_portfolio_exit_scenarios=nativeportfolio['account']['executed_exits'],
            native_portfolio_cash_model_eur=nativeportfolio['account']['final_cash_eur'],
            native_portfolio_marked_equity_model_eur=nativeportfolio['account']['marked_equity_eur'],
            native_portfolio_unverified_broker_terms=True,
            native_portfolio_independent_full_mtm_parity_not_proven=True,
            native_portfolio_not_qualified=True,native_portfolio_hard21=False)
          terms_bytes=(temp/'mxm-authentic-ticks.ndjson.symbol-terms.json').read_bytes()
          terms=json.loads(terms_bytes)
          need(bytes_digest(terms_bytes)==bridge['captured_symbol_terms_sha256'] and
               terms['source_crypto_authenticated_by_original_native_replay'] is True and
               terms['source_run']==bridge['source_run']==39660692230 and
               terms['source_ciphertext_sha256']==bridge['ciphertext_sha256'] and
               terms['source_private_sha256']==bridge['private_sha256'] and
               terms['modeled_units_checked']=='1000' and
               terms['historical_commission_proven'] is False and
               terms['dated_historical_volume_rules_proven'] is False and
               terms['orders']==terms['new_broker_requests']==0,
               'CAPTURED_SYMBOL_TERMS_ORIGINAL_WIRE_CUSTODY_BINDING')
          safe.update(captured_symbol_terms_present=True,
            captured_symbol_terms_sha256=bridge['captured_symbol_terms_sha256'],
            captured_volume_fields_present=terms['volume_fields_present'],
            captured_volume_geometry_unambiguous=terms['unambiguous_volume_geometry'],
            model_volume_on_captured_native_lattice=terms['modeled_volume_on_captured_lattice'],
            captured_precise_commission_rate_decoded=terms['commission_rate'] is not None,
            captured_minimum_commission_semantics_known=terms['minimum_commission_semantics_known'],
            captured_terms_do_not_prove_historical_execution=True)
          captured=json.loads((temp/'mxm-csharp-captured-components/portfolio-exposed-quote-readback.json').read_bytes())
          captured_check=json.loads((temp/'mxm-csharp-captured-components/independent-mark.json').read_bytes())
          need(captured['valuation_mode']=='CAPTURED_COMMISSION_AND_QUOTE_SIDE_FX_COMPONENTS_ONLY' and
               captured['captured_terms_sha256']==bridge['captured_symbol_terms_sha256'] and
               captured['derived_stream_sha256']==bridge['derived_ticks_sha256'] and
               captured['account']['initial_capital_eur']==200 and
               captured_check['market_source_sha256']==bridge['derived_ticks_sha256'] and
               captured_check['captured_commission_component_checked'] is True and
               captured_check['quote_side_fx_conversion_checked'] is True and
               float(captured_check['cash_abs_difference_eur'])<=0.000001 and
               float(captured_check['equity_abs_difference_eur'])<=0.000001 and
               captured['all_cost_components_verified'] is False and
               captured['captured_terms_are_historical'] is False and
               captured['account']['hard21_proven'] is False and
               captured_check['broker_historical_costs_verified'] is False,
               'CAPTURED_COMPONENT_SCENARIO_INDEPENDENT_CASH_AND_FX_PARITY')
          safe.update(captured_components_scenario_only=True,
            captured_components_entries=captured['account']['accepted_entries'],
            captured_components_exits=captured['account']['executed_exits'],
            captured_components_cash_eur=captured['account']['final_cash_eur'],
            captured_components_equity_eur=captured['account']['marked_equity_eur'],
            captured_components_independent_arithmetic_pass=True,
            captured_components_all_costs_verified=False,
            captured_components_historical_fees_verified=False,
            captured_components_new_scientific_trial=False)
          full=encoded({'bridge':bridge,'captured_original_native_symbol_terms':terms,
                         'captured_commission_quote_side_fx_component_scenario':captured,
                         'independent_captured_component_arithmetic':captured_check,
                         'research_matrix':research,'modeled_reference':r,'independent_continuous_account_cash_parity':independent,'stop_risk_capacity':capacity,
                         'native_exposed_quote_continuous_account_model':nativeportfolio,'independent_native_quote_terminal_cash_and_mtm':native_terminal_mark,'nonoutcome_reference':json.loads((temp/'mxm-csharp-output/reference-report.json').read_bytes())})
          public=pathlib.Path('research_core_v4/keys/MXM_V4_INPUT_BUNDLE_PUBLIC_KEY.pem')
          need(public_spki_sha256(public)==FP,'CSHARP_MODELED_CUSTODY_RECIPIENT')
          ciphertext=out/'modeled-reference.mxmenc'
          encrypt_shard(full,public_key=public,output=ciphertext)
          safe['independent_cash_replay_parity']='PASS_CASH_ONLY_NOT_MTM_OR_EXECUTION'
          safe['independent_cash_replay_abs_error_eur']=abs(float(independent['cash_difference_eur']))
          safe['modeled_ciphertext_sha256']=bytes_digest(ciphertext.read_bytes())
          safe['modeled_private_sha256']=bytes_digest(full)
          (out/'receipt.json').write_bytes(encoded(safe))
          print('MXM_AUTHENTIC_REFERENCE_AGGREGATE',json.dumps(safe,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: csharp-authentic-nonoutcome-aggregate
          path: |
            verification/csharp-authentic-aggregate/receipt.json
            verification/csharp-authentic-aggregate/modeled-reference.mxmenc
          if-no-files-found: error
          retention-days: 30

  weekly-cold-to-csharp:
    # An additional job of the EXISTING protected CSharp pipeline; no new
    # custody, provider connection, authority, or GitHub credential.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: mxm-r3-custody-v1
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Pin original authenticated Pepperstone wire decoder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d2fae5641b759b1c8c24161d83d62d39e104eafd
          path: .sealed-chronology-source
          persist-credentials: false
      - name: Restore exact new-week ciphertext without key or market access
        run: |
          test "$(git -C .sealed-chronology-source rev-parse HEAD)" = d2fae5641b759b1c8c24161d83d62d39e104eafd
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
          python3 -m research_core_v4.laboratory.durable_week_chronology --out "${RUNNER_TEMP}/mxm-week-chronology"
          cp research_core_v4/laboratory/week_chronology_reception.py .sealed-chronology-source/research_core_v4/laboratory/
