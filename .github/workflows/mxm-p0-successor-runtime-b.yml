name: MXM B frozen native continuation
run-name: MXM B native ${{ inputs.command }} ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      command:
        description: Initial exact OWNER gate or ordinary continuation
        type: choice
        options: [arm, continue]
        default: continue
      access:
        description: Public B custody/config JSON, required only for initial arm
        type: string
        required: false
permissions: {}
concurrency:
  group: mxm-b-native-single-issuer
  cancel-in-progress: false
jobs:
  exact-manifest:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.ref_name == 'mxm-o04-successor-code-b-v1' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read, actions: read}
    outputs:
      bundle: ${{ steps.plan.outputs.bundle }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing hash-locked modules, no key access
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - id: plan
        run: python3 -m research_core_v4.p0_successor_b_20261017.native plan
        env:
          GH_TOKEN: ${{ github.token }}
          B_COMMAND: ${{ inputs.command }}
          B_ACCESS: ${{ inputs.access }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-b-public-bundle-${{ github.run_id }}
          path: verification/successor-b/native-bundle.json
          if-no-files-found: error
  owner-critical:
    needs: exact-manifest
    if: inputs.command == 'arm'
    environment: mxm-p0-owner-critical-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Initial gate only, no key or writer
        run: echo 'Initial OWNER gate passed; issuer verifies exact native review separately.'
  successor-issuer:
    needs: [exact-manifest, owner-critical]
    if: always() && needs.exact-manifest.result == 'success' && (needs.owner-critical.result == 'success' || (inputs.command == 'continue' && needs.owner-critical.result == 'skipped'))
    environment: mxm-p0-successor-issuer-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, actions: read}
    outputs:
      next: ${{ steps.execute.outputs.next }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing decoder dependencies before secrets enter process
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - id: execute
        name: Native review, exclusive App, CAS, real restore, readback and revoke token
        run: python3 -m research_core_v4.p0_successor_b_20261017.native execute
        env:
          GH_TOKEN: ${{ github.token }}
          B_COMMAND: ${{ inputs.command }}
          B_BUNDLE: ${{ needs.exact-manifest.outputs.bundle }}
          SUCCESSOR_APP_PRIVATE_KEY: ${{ secrets.SUCCESSOR_APP_PRIVATE_KEY }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-b-native-receipt-${{ github.run_id }}
          path: |
            verification/successor-b/native-receipt.json
            verification/successor-b/real-restore.json
          if-no-files-found: error
  automatic-handoff:
    needs: successor-issuer
    if: needs.successor-issuer.outputs.next == 'continue'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {actions: write}
    steps:
      - name: Dispatch second finite segment on the same frozen source, no human gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/mariancradulescu/mxm-quant-greenfield/actions/workflows/mxm-p0-successor-runtime-b.yml/dispatches'
          body={'ref':'mxm-o04-successor-code-b-v1','inputs':{'command':'continue'}}
          req=urllib.request.Request(url,data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              if r.status!=204:raise SystemExit('B_HANDOFF_NOT_ACKNOWLEDGED')
          PY
