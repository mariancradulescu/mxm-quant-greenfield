name: MXM laboratory saved result followthrough
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [research_core_v4/laboratory_followthrough_20261019_v1/EXECUTE_ONCE.json]
permissions: {contents: read}
concurrency:
  group: mxm-laboratory-saved-followthrough-v1
  cancel-in-progress: false
jobs:
  saved-result-followthrough:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 67dbe37b2913581f90e119fee16b32f36e8daaed
          persist-credentials: false
      - run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - run: python3 -m unittest research_core_v4.laboratory_followthrough_20261019_v1.test_report -v
      - run: python3 -m research_core_v4.laboratory_followthrough_20261019_v1.report
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          FOLLOW_SOURCE_SHA: 67dbe37b2913581f90e119fee16b32f36e8daaed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-laboratory-followthrough-${{ github.run_id }}
          path: verification/laboratory-followthrough/
          if-no-files-found: error
