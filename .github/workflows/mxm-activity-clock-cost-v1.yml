name: MXM new cost-first native activity-clock DEVELOPMENT
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/activity_clock_cost_v1/EXECUTION_V1.json]
permissions:
  contents: write
jobs:
  new-frozen-activity-clock-existing-cost-and-corpus:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5 numpy==2.2.6 cryptography==46.0.3
      - name: New causal and scientific checks
        run: python3 -m unittest research_core_v4.activity_clock_cost_v1.test_kernel_v1
      - name: Reuse authentic sources and measure new economic comparison only
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          ulimit -v 2097152
          ulimit -t 1600
          timeout --signal=TERM 1900 python3 -m research_core_v4.activity_clock_cost_v1.runner_v1
