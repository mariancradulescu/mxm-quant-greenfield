name: MXM full-Pepperstone-universe first shared economic portfolio
on:
  pull_request:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/laboratory/broad_shared_breadth_response.py
      - research_core_v4/laboratory/BROAD_SHARED_BREADTH_RESPONSE_20261030_V1.json
      - research_core_v4/laboratory/test_broad_shared_breadth_response.py
      - docs/economic-development/20261030/BROAD_SHARED_UNIVERSE_CORRECTION_AND_ECONOMICS.md
      - .github/workflows/mxm-broad-shared-universe-20261030.yml
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths: [.github/workflows/mxm-broad-shared-universe-20261030.yml]
permissions: {contents: read, actions: read}
concurrency:
  group: mxm-integrated-laboratory
  cancel-in-progress: false
jobs:
  source-blind-broad-scientific-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Prove whole-broker 1575 identity join and future-proof cross-class selector
        run: |
          set -eu
          python3 -m unittest research_core_v4.laboratory.test_broad_shared_breadth_response -v
          python3 -m research_core_v4.laboratory.broad_shared_breadth_response selftest
  one-original-whole-source-economics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/mxm-remediation-p0-p4-20261015-v1' && github.run_attempt == 1
    needs: source-blind-broad-scientific-tests
    runs-on: ubuntu-24.04
    environment: mxm-r3-custody-v1
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Admit one reviewed first-run full-source policy and authorized owner anchor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 - <<'PY'
          import os,subprocess,json
          repo='repos/mariancradulescu/mxm-quant-greenfield/'
          def get(s):return json.loads(subprocess.check_output(['gh','api',repo+s],text=True))
          def need(x,k):
              if not x:raise RuntimeError('MXM_BROAD_SHARED_PROTECTED_'+k)
          need(os.environ['GITHUB_REPOSITORY']=='mariancradulescu/mxm-quant-greenfield' and
               os.environ['GITHUB_EVENT_NAME']=='push' and
               os.environ['GITHUB_REF']=='refs/heads/mxm-remediation-p0-p4-20261015-v1' and
               os.environ['GITHUB_RUN_ATTEMPT']=='1','EXACT_OWNER_LANE')
          need(get('git/ref/heads/mxm-remediation-p0-p4-20261015-v1')['object']['sha']==os.environ['GITHUB_SHA'],'STALE_HEAD')
          need(get('git/ref/heads/mxm-o04-accepted-owner-1807-v1')['object']['sha']=='a830c132521bd4348454653f713e04f6107484fe','OWNER_ANCHOR')
          runs=get('actions/workflows/mxm-broad-shared-universe-20261030.yml/runs?per_page=100')
          need(runs['total_count']<=100 and runs['total_count']==len(runs['workflow_runs']),'ONE_RUN_INVENTORY')
          pushed=[x for x in runs['workflow_runs'] if x['event']=='push']
          need(len(pushed)==1 and pushed[0]['id']==int(os.environ['GITHUB_RUN_ID']) and
               pushed[0]['head_sha']==os.environ['GITHUB_SHA'],'ONE_ECONOMIC_IDENTITY')
          need(len(get('commits/'+os.environ['GITHUB_SHA'])['parents'])==2,'MERGED_PR')
          print('MXM_FULL_BROKER_ONE_INTEGRATED_PORTFOLIO_REVIEW_ADMITTED')
          PY
      - name: Install existing pinned dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Authenticate original all 1576 3.35 million bars and evaluate exactly one full cross-class shared policy
        id: economic
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          umask 077
          python3 -m research_core_v4.laboratory.broad_shared_breadth_response protected
      - name: Preserve encrypted original policy decisions and limited public genuine result
        if: steps.economic.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-broad-shared-original-${{ github.run_id }}
          path: verification/broad-shared-breadth-20261030/
          if-no-files-found: error
          retention-days: 90
