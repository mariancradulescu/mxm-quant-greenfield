name: MXM O04.2 preflight only no installation tokens
on:
  push:
    branches: [mxm-o04-preflight-code-v2]
permissions: {}
jobs:
  issue:
    if: github.actor_id == '322088485' && github.event_name == 'push'
    uses: ./.github/workflows/mxm-o042-issuer.yml
    secrets:
      O04_CUSTODY_CANARY: ${{ secrets.O04_CUSTODY_CANARY }}
      O04_ACCEPTOR_APP_PRIVATE_KEY: ${{ secrets.O04_ACCEPTOR_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      actions: read
      id-token: write
