name: MXM O04.2 single-job protected key preflight only
on:
  workflow_call:
    secrets:
      O04_CUSTODY_CANARY:
        required: true
      O04_ACCEPTOR_APP_PRIVATE_KEY:
        required: true
permissions: {}
jobs:
  acceptor:
    if: github.actor_id == '322088485' && github.ref == 'refs/heads/mxm-o04-preflight-code-v1' && github.event_name == 'push'
    environment: mxm-o04-staging-issuer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Authenticate workload and GET App identity only
        run: python3 -m o042.preflight
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_FREEZE_RULE_ID: ${{ vars.O04_CODE_FREEZE_RULE_ID }}
          CUSTODY_CANARY: ${{ secrets.O04_CUSTODY_CANARY }}
          APP_PRIVATE_KEY: ${{ secrets.O04_ACCEPTOR_APP_PRIVATE_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mxm-o042-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/o042-preflight.json
          if-no-files-found: error
          retention-days: 90
