name: MXM B continuation components and real read-only restore
run-name: MXM B components ${{ github.sha }}
on:
  push:
    branches: [mxm-remediation-p0-p4-20261015-v1]
    paths:
      - research_core_v4/p0_successor_b_20261017/**
      - .github/workflows/mxm-p0-successor-b-components.yml
permissions: {}
concurrency:
  group: mxm-b-components-only
  cancel-in-progress: false
jobs:
  new-b-controls:
    if: github.repository == 'mariancradulescu/mxm-quant-greenfield' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: New B controls only, no A or B1 repetition
        run: python3 -m research_core_v4.p0_successor_b_20261017.test_continuity
      - name: First isolated continuity segment
        run: python3 -m research_core_v4.p0_successor_b_20261017.test_continuity --phase1 verification/successor-b/transfer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-b-transfer-${{ github.sha }}
          path: verification/successor-b/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  cold-handoff:
    needs: new-b-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mxm-b-transfer-${{ github.sha }}
          path: verification/successor-b/
      - name: Cold job readback and deterministic renewal, no App credentials
        run: python3 -m research_core_v4.p0_successor_b_20261017.test_continuity --phase2 verification/successor-b/transfer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-b-cold-${{ github.sha }}
          path: verification/successor-b/transfer/cold-receipt.json
          if-no-files-found: error
          retention-days: 90
  real-owner-restore:
    needs: new-b-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing hash-locked OWNER decoder dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r research_core_v4/remediation_p0_p4_20261015/requirements.lock
      - name: Restore original checkpoint into new read-only adapter
        run: python3 -m research_core_v4.p0_successor_b_20261017.recovery
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mxm-b-real-restore-${{ github.sha }}
          path: verification/successor-b/real-restore.json
          if-no-files-found: error
          retention-days: 90
