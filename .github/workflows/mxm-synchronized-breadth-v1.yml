name: MXM cost first synchronized breadth DEVELOPMENT
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/synchronized_breadth_v1/EXECUTION_V1.json]
permissions:
  contents: write
jobs:
  frozen-breadth-and-authenticated-cost-reuse:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m pip install protobuf==5.29.5
      - name: Frozen paired breadth comparison and private cost accounting
        env:
          GH_TOKEN: ${{ github.token }}
          MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM: ${{ secrets.MXM_V4_INPUT_BUNDLE_PRIVATE_KEY_PEM }}
        run: |
          ulimit -v 2097152
          ulimit -t 1500
          timeout --signal=TERM 1800 python3 -m research_core_v4.synchronized_breadth_v1.execute_v1
