name: V4 Online Change Synthetic Daily Gap Power
on:
  push:
    branches: [performance-research-v3-20260922]
    paths: [research_core_v4/state/ONLINE_CHANGE_GAP_POWER_REQUEST_V1.json]
permissions: {contents: read}
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_CORETYPE: Nehalem
      NPY_DISABLE_CPU_FEATURES: AVX512F,AVX2,FMA3,AVX
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.16'}
      - run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r research_core_v4/runtime/numeric-requirements-v1.txt
      - run: |
          python -m research_core_v4.online_change_gap_power_v1 --output "$RUNNER_TEMP/ONLINE_CHANGE_GAP_POWER_V1.json"
      - uses: actions/upload-artifact@v4
        with:
          name: online-change-gap-power-${{ github.run_id }}
          path: ${{ runner.temp }}/ONLINE_CHANGE_GAP_POWER_V1.json
          if-no-files-found: error
          retention-days: 90
